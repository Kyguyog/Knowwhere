<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StopwatchSync</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f4f4f9;
            color: #333;
        }

        .container {
            background: #ffffff;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }

        h1 {
            margin-top: 0;
            font-size: 1.8rem;
            color: #2c3e50;
        }

        .status {
            margin: 1rem 0;
            font-size: 0.95rem;
            color: #666;
        }

        .status-badge {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.85rem;
            background-color: #e0e0e0;
            color: #555;
        }

        .status-badge.connected {
            background-color: #d4edda;
            color: #155724;
        }

        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            font-size: 1rem;
            border-radius: 6px;
            cursor: pointer;
            margin: 0.5rem;
            transition: background-color 0.2s ease;
        }

        button:hover {
            background-color: #0056b3;
        }

        button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }
    </style>
</head>

        // Convert Base64 string safely to ArrayBuffer (stripping whitespace/newlines)
        function base64ToArrayBuffer(base64) {
            const cleanBase64 = base64.replace(/\s/g, ''); 
            const binaryString = window.atob(cleanBase64);
            const len = binaryString.length;
            const bytes = new Uint8Array(len);
            for (let i = 0; i < len; i++) {
                bytes[i] = binaryString.charCodeAt(i);
            }
            return bytes.buffer;
        }

        // Initialize Audio Context & Decode Base64 Audio
        async function initAudio() {
            try {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const arrayBuffer = base64ToArrayBuffer(SOUND_BASE64);

                document.getElementById('audioStatus').innerText = 'Sound Ready!';
                document.getElementById('playBtn').disabled = false;
            } catch (err) {
                console.error('Audio decode error:', err);
                document.getElementById('audioStatus').innerText = 'Failed to decode audio.';
            }

        async function resumeAudio() {
            if (audioCtx && audioCtx.state === 'suspended') {
                await audioCtx.resume();
            }

            if (!audioCtx) return 0;
            return ((audioCtx.outputLatency || audioCtx.baseLatency || 0) * 1000);

            };

            const compensatedDelayMs = Math.max(0, delayMs - audioOutputLatencyMs());
            const startAt = audioCtx.currentTime + compensatedDelayMs / 1000;
            source.start(startAt);
            pendingSource = source;
        }

        // Web Bluetooth Logic
        async function connectBluetooth() {
            const bleStatus = document.getElementById('bleStatus');
            try {
                bleStatus.innerText = 'Searching...';

                bleDevice = await navigator.bluetooth.requestDevice({
                    filters: [{ name: DEVICE_NAME }],
                    optionalServices: [SERVICE_UUID]
                });

                bleDevice.addEventListener('gattserverdisconnected', onDisconnected);

                const server = await bleDevice.gatt.connect();
                const service = await server.getPrimaryService(SERVICE_UUID);
                bleCharacteristic = await service.getCharacteristic(CHARACTERISTIC_UUID);

                await resumeAudio();

                // Enable notifications for trigger events from the device
                await bleCharacteristic.startNotifications();
                bleCharacteristic.addEventListener('characteristicvaluechanged', handleBluetoothData);

                bleStatus.innerText = 'Connected';
                bleStatus.classList.add('connected');
                document.getElementById('connectBtn').innerText = 'Disconnect';

                startClockSync();
            } catch (err) {
                console.error('Bluetooth Connection Error:', err);
                bleStatus.innerText = 'Disconnected';
                bleStatus.classList.remove('connected');
            }
        }

        function updateClockOffset(serverTimeMs, clientSentMs) {
            const now = performance.now();

            if (!Number.isFinite(serverTimeMs)) {
                return;
            }

            if (Number.isFinite(clientSentMs)) {
                const rttMs = now - clientSentMs;
                const midpointMs = clientSentMs + rttMs / 2;

                if (rttMs > 0 && rttMs < bestSyncRttMs + 20) {
                    clockOffsetMs = serverTimeMs - midpointMs;
                    bestSyncRttMs = Math.min(bestSyncRttMs, rttMs);
                }
                return;
            }

            clockOffsetMs = serverTimeMs - now;
        }

        async function sendBluetoothAction(action, extra = {}) {
            if (!bleCharacteristic) {
                await playSound();
                return;
            }

            const payload = JSON.stringify({ action, ...extra });
            const data = new TextEncoder().encode(payload);
            await bleCharacteristic.writeValue(data);
        }

        function syncClock() {
            if (!bleCharacteristic) return;

            sendBluetoothAction('sync', {
                clientId,
                clientSentMs: performance.now()
            }).catch((err) => {
                console.warn('Clock sync failed:', err);
            });
        }

        function startClockSync() {
            stopClockSync();
            bestSyncRttMs = Infinity;

            for (let i = 0; i < 6; i++) {
                syncBurstTimers.push(setTimeout(syncClock, i * 250));
            }

            syncTimer = setInterval(syncClock, 5000);
        }

        function stopClockSync() {
            syncBurstTimers.forEach(clearTimeout);
            syncBurstTimers = [];

            if (syncTimer) {
                clearInterval(syncTimer);
                syncTimer = null;
            }
        }

        function handleBluetoothData(event) {
            const text = new TextDecoder().decode(event.target.value);

            try {
                const message = JSON.parse(text);

                if (message.serverTimeMs !== undefined) {
                    if (message.clientId && message.clientId !== clientId) {
                        return;
                    }

                    updateClockOffset(
                        Number(message.serverTimeMs),
                        Number(message.clientSentMs)
                    );
                }

                if (message.action === 'time') {
                    return;
                }

                if (message.action === 'play') {
                    const playAtMs = Number(message.playAtMs);
                    const fallbackDelayMs = Number(message.delayMs);
                    const delayMs = Number.isFinite(playAtMs)
                        ? playAtMs - (performance.now() + clockOffsetMs)
                        : fallbackDelayMs;

                    playSound(Number.isFinite(delayMs) ? delayMs : 0);
                    return;
                }
            } catch (err) {
                console.warn('Unrecognized Bluetooth message:', text);
            }

            playSound();
        }

        function onDisconnected() {
            const bleStatus = document.getElementById('bleStatus');
            bleStatus.innerText = 'Disconnected';
            bleStatus.classList.remove('connected');
            document.getElementById('connectBtn').innerText = 'Connect Device';
            bleCharacteristic = null;
            stopClockSync();
        }

        function toggleConnection() {
            if (bleDevice && bleDevice.gatt.connected) {
                bleDevice.gatt.disconnect();
            } else {
                connectBluetooth();
            }
        }

        // Event Listeners
        window.addEventListener('DOMContentLoaded', initAudio);
        document.getElementById('playBtn').addEventListener('click', () => {
            sendBluetoothAction('play').catch((err) => {
                console.error('Bluetooth write error:', err);
                playSound();
            });
        });
        document.getElementById('connectBtn').addEventListener('click', toggleConnection);
    </script>
</body>
</html>
