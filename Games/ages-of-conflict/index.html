<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <title>Ages of Conflict</title>
    <base href="https://raw.githubusercontent.com/Kyguyog/Knowwhere/main/game-assets/ages-of-conflict/" />
    <link rel="shortcut icon" href="TemplateData/favicon.ico" />
    <link rel="stylesheet" href="TemplateData/style.css" />
  </head>
  <body>
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" width="1280" height="720"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"></div>
      <div id="unity-footer">
        <div id="unity-webgl-logo"></div>
        <div id="unity-fullscreen-button"></div>
        <div id="unity-build-title">Ages of Conflict</div>
      </div>
    </div>
    <script>
      // All assets are streamed from the repo's game-assets folder. GitHub raw
      // serves .js and .unityweb as text/plain, so the Unity loader (a <script>
      // tag) is downloaded as text and re-served from a same-origin blob: URL
      // before createUnityInstance runs. The data/framework/wasm URLs are passed
      // straight to the loader, which fetches them itself (fetch is not subject
      // to Opaque Response Blocking).
      var GITHUB_BASE = "https://raw.githubusercontent.com/Kyguyog/Knowwhere/main/game-assets/ages-of-conflict/";

      var container = document.querySelector("#unity-container");
      var canvas = document.querySelector("#unity-canvas");
      var loadingBar = document.querySelector("#unity-loading-bar");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");
      var fullscreenButton = document.querySelector("#unity-fullscreen-button");
      var warningBanner = document.querySelector("#unity-warning");

      function unityShowBanner(msg, type) {
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? "block" : "none";
        }
        var div = document.createElement("div");
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == "error") div.style = "background: red; padding: 10px;";
        else {
          if (type == "warning") div.style = "background: yellow; padding: 10px;";
          setTimeout(function () {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = GITHUB_BASE + "Build";
      var loaderUrl = buildUrl + "/v1.04.2w.loader.js";
      var config = {
        dataUrl: buildUrl + "/v1.04.2w.data.unityweb",
        frameworkUrl: buildUrl + "/v1.04.2w.framework.js.unityweb",
        codeUrl: buildUrl + "/v1.04.2w.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "JokuPelle",
        productName: "Ages of Conflict",
        productVersion: "1.04.2",
        showBanner: unityShowBanner,
      };

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        var meta = document.createElement("meta");
        meta.name = "viewport";
        meta.content = "width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes";
        document.getElementsByTagName("head")[0].appendChild(meta);
        container.className = "unity-mobile";

        canvas.style.width = window.innerWidth + "px";
        canvas.style.height = window.innerHeight + "px";

        unityShowBanner("WebGL builds are not supported on mobile devices.");
      } else {
        canvas.style.width = "1280px";
        canvas.style.height = "720px";
      }

      loadingBar.style.display = "block";

      fetch(loaderUrl)
        .then(function (r) {
          if (!r.ok) throw new Error("HTTP " + r.status + " for loader");
          return r.text();
        })
        .then(function (text) {
          var blobUrl = URL.createObjectURL(new Blob([text], { type: "application/javascript" }));
          return new Promise(function (resolve, reject) {
            var script = document.createElement("script");
            script.src = blobUrl;
            script.onload = function () { URL.revokeObjectURL(blobUrl); resolve(); };
            script.onerror = function () { reject(new Error("Unity loader failed to execute")); };
            document.body.appendChild(script);
          });
        })
        .then(function () {
          return createUnityInstance(canvas, config, function (progress) {
            progressBarFull.style.width = 100 * progress + "%";
          });
        })
        .then(function (unityInstance) {
          loadingBar.style.display = "none";
          fullscreenButton.onclick = function () {
            unityInstance.SetFullscreen(1);
          };
        })
        .catch(function (message) {
          alert(message);
        });
    </script>
  </body>
</html>
