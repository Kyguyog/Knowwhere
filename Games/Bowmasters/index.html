<!DOCTYPE html>
<html>
<head>
    <title>Bowmasters</title>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-touch-fullscreen" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="msapplication-tap-highlight" content="no">
    <meta name="MobileOptimized" content="960">
    <meta name="viewport" content="width=device-width, minimum-scale=1.0, maximum-scale=1.0, initial-scale=1.0, user-scalable=no, minimal-ui">
    <meta charset="utf-8">
    <link rel="icon" href="data:,">
    <style>
html, body {
	padding: 0;
	margin: 0;
	background: #000000;
	overflow: hidden;
}
html, body {
    margin: 0;
    padding: 0;
}
body {
    background: #000;
    overflow: hidden;
}

#bm-loading-wrap {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    z-index: 999999;
    background: #060b1a;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: 'Segoe UI', Tahoma, Verdana, Arial, sans-serif;
    color: #fff;
}
#bm-loading-text {
    font-weight: bold;
    font-size: 42px;
    letter-spacing: 2px;
    background: linear-gradient(270deg,#ff0000,#ff7f00,#ffff00,#00ff00,#0000ff,#4b0082,#8f00ff);
    background-size: 400% 400%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: bm-rainbow 3s ease infinite;
}
@keyframes bm-rainbow {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}
#bm-load-progress {
    width: 60%;
    max-width: 480px;
    height: 14px;
    margin: 28px auto 12px auto;
    border: 1px solid #444;
    border-radius: 7px;
    background: #111;
    overflow: hidden;
}
#bm-load-progress::-webkit-progress-bar {
    background: #111;
}
#bm-load-progress::-webkit-progress-value {
    background: linear-gradient(90deg,#00c853,#00e676);
    transition: width .2s ease;
}
#bm-load-progress::-moz-progress-bar {
    background: linear-gradient(90deg,#00c853,#00e676);
}
#bm-stage {
    font-size: 14px;
    color: #9aa5b8;
    letter-spacing: 1.5px;
    text-transform: uppercase;
}

    </style>
</head>
<body>
    <div id="bm-loading-wrap">
        <div id="bm-loading-text">LOADING...</div>
        <progress id="bm-load-progress" value="0" max="100"></progress>
        <div id="bm-stage">0%</div>
    </div>
    <div id="game"></div>
    <div id="banner-container"></div>

<script>
window.__logs = [];
['log','warn','error','info','debug'].forEach(m => {
  console['__orig'+m] = console[m].bind(console);
  console[m] = function() {
    try {
      var s = Array.from(arguments).map(a => {
        if (a instanceof Error) return (a.stack || a.message);
        if (a && a.stack && a.message) return a.stack;
        if (typeof a === 'object') { try { return JSON.stringify(a).substring(0,500); } catch(e) { return String(a); } }
        return String(a);
      }).join(' ');
      window.__logs.push(m.toUpperCase()+': '+s);
      localStorage.setItem('bm_logs', JSON.stringify(window.__logs.slice(-200)));
    } catch(e) {}
    console['__orig'+m].apply(console, arguments);
  };
});
window.addEventListener('error', e => {
  try {
    var s = 'ONERROR: ' + (e.error ? (e.error.stack || e.error.message) : e.message) + ' @' + e.filename + ':' + e.lineno;
    window.__logs.push(s);
    localStorage.setItem('bm_logs', JSON.stringify(window.__logs.slice(-200)));
  } catch(err) {}
});
window.addEventListener('unhandledrejection', e => {
  try {
    var s = 'REJECTION: ' + (e.reason && (e.reason.stack || e.reason.message) ? (e.reason.stack || e.reason.message) : (e.reason+''));
    window.__logs.push(s);
    localStorage.setItem('bm_logs', JSON.stringify(window.__logs.slice(-200)));
  } catch(err) {}
});
window.__initErr = null;
try {
  document.addEventListener('DOMContentLoaded', function() {
    try { localStorage.setItem('bm_ready', document.readyState + ' ' + location.href); } catch(e){}
  });
} catch(e) { window.__initErr = String(e); }
</script>
<script>
(function(){
  if (typeof window._rafPatched !== 'undefined') return;
  window._rafPatched = true;
  var lastTime = 0;
  var realRaf = window.requestAnimationFrame.bind(window);
  var realCaf = window.cancelAnimationFrame.bind(window);
  function raf(cb){
    var now = performance.now();
    var delay = Math.max(0, 16 - (now - lastTime));
    lastTime = now + delay;
    var id = setTimeout(function(){ cb(now + delay); }, delay);
    return id;
  }
  function caf(id){ clearTimeout(id); }
  window.requestAnimationFrame = raf;
  window.cancelAnimationFrame = caf;
})();
</script>
<script>
var CODE_BASE = "https://raw.githubusercontent.com/Kyguyog/Knowwhere/main/Games/Bowmasters/code/";
    var CODE_FILES = ['sdk.js', 'chunk_309.js', 'game.js'];

    function loadCode(name) {
        return fetch(CODE_BASE + name).then(function (r) {
            if (!r.ok) throw new Error('Missing code part: ' + name + ' (HTTP ' + r.status + ')');
            return r.text();
        });
    }

(function () {
    'use strict';

    /* ------- config -------- */
    var DEFAULT_BASE = "https://raw.githubusercontent.com/Kyguyog/Knowwhere/main/Games/Bowmasters/assets/";
    var ZIP_NAME = "assets.zip";
    var PARTS = [1];
    var GITHUB_BASE = null;
    try {
        GITHUB_BASE = new URLSearchParams(window.location.search).get('base') || DEFAULT_BASE;
        if (GITHUB_BASE.indexOf('://') === -1) {
            GITHUB_BASE = new URL(GITHUB_BASE, window.location.href).href;
        }
    } catch (e) {
        GITHUB_BASE = DEFAULT_BASE;
    }

    var blobMap = Object.create(null);

    window.__bmStats = {
        totalEntries: 0,
        mergedBytes: 0,
        extractMs: 0,
        fetchHits: 0,
        xhrHits: 0,
        mediaHits: 0,
        fontsRegistered: 0,
        fontFacesPatched: 0,
        initMs: 0
    };
    window.__bmStats.initMs = Date.now();
    window.__bmBlobPaths = {};

    var loadingWrap = document.getElementById('bm-loading-wrap');
    var loadingText = document.getElementById('bm-loading-text');
    var progressEl = document.getElementById('bm-load-progress');
    var stageEl = document.getElementById('bm-stage');

    function updateProgress(text, percent) {
        if (loadingText) loadingText.textContent = text;
        if (progressEl) progressEl.value = percent;
        if (stageEl) stageEl.textContent = Math.floor(percent) + '%';
    }

    function fail(msg) {
        updateProgress('LOAD FAILED', 100);
        if (stageEl) {
            stageEl.textContent = msg;
            stageEl.style.color = '#ff6161';
            stageEl.style.textTransform = 'none';
        }
        console.error('[Bowmasters] ' + msg);
    }

    /* ------- path lookup ------- */
    function normalizePath(url) {
        if (url instanceof URL) url = url.href;
        url = String(url);
        try {
            if (/^https?:/.test(url)) {
                url = new URL(url).pathname;
            }
        } catch (e) {}
        url = url.split('?')[0].split('#')[0];
        if (url.charAt(0) === '/') url = url.slice(1);
        if (url.indexOf('Games/Bowmasters/') !== -1) {
            url = url.slice(url.indexOf('Games/Bowmasters/') + 'Games/Bowmasters/'.length);
        }
        if (url.indexOf('./') === 0) url = url.slice(2);
        return url;
    }

    function lookup(url) {
        var name = normalizePath(url);
        if ((name.indexOf('assets/') === 0 || name.indexOf('data/') === 0) && blobMap[name]) {
            return blobMap[name];
        }
        return null;
    }

    function hit(type) {
        if (window.__bmStats) window.__bmStats[type] = (window.__bmStats[type] || 0) + 1;
    }

    /* ------- intercept ------- */
    function rewriteFontUrls(styleEl) {
        var txt = styleEl ? (styleEl.textContent || '') : '';
        if (txt.indexOf('@font-face') === -1 || txt.indexOf('url(') === -1) return false;
        var n = txt.replace(
            /url\(\s*["']?(assets\/main\/fonts\/[^"')\s]+)["']?\s*\)/g,
            function (all, path) {
                var b = blobMap[path];
                if (b) window.__bmStats.fontFacesPatched++;
                return b ? 'url("' + b + '")' : all;
            }
        );
        if (n !== txt) {
            styleEl.textContent = n;
            return true;
        }
        return false;
    }

    function patchStyleInsertion() {
        /* Synchronously rewrite @font-face urls BEFORE the CSS parser fetches them,
           so fonts are pulled from the blob map with no race. */
        function makeHook(methodName) {
            return function () {
                var arg = arguments[0];
                if (arg && arg.nodeType === 1 && arg.tagName === 'STYLE') {
                    rewriteFontUrls(arg);
                }
                return this._bmOrig[methodName].apply(this, arguments);
            };
        }
        function patchProto(proto) {
            if (!proto || proto._bmStylePatched) return;
            proto._bmStylePatched = true;
            var orig = {
                appendChild: proto.appendChild,
                insertBefore: proto.insertBefore
            };
            proto._bmOrig = proto._bmOrig || {};
            proto._bmOrig.appendChild = proto._bmOrig.appendChild || orig.appendChild;
            proto._bmOrig.insertBefore = proto._bmOrig.insertBefore || orig.insertBefore;
            proto.appendChild = makeHook('appendChild');
            proto.insertBefore = makeHook('insertBefore');
        }
        patchProto(Node.prototype);
        if (document.head) { patchProto(document.head.constructor.prototype); }
    }

    function installInterceptors() {
        var originalFetch = window.fetch;
        window['__bmOriginalFetch'] = originalFetch;
        window.fetch = function (input, init) {
            var url = typeof input === 'string' ? input : (input && input.url);
            var blobUrl = lookup(url);
            if (blobUrl) {
                hit('fetchHits');
                return originalFetch(blobUrl, init);
            }
            return originalFetch(input, init);
        };

        var originalOpen = XMLHttpRequest.prototype.open;
        XMLHttpRequest.prototype.open = function (method, url, async, user, pass) {
            var blobUrl = lookup(url);
            if (blobUrl) {
                hit('xhrHits');
                url = blobUrl;
                if (arguments.length >= 3 && typeof arguments[2] === 'undefined') arguments[2] = true;
                return originalOpen.call(this, method, url, true, user, pass);
            }
            return originalOpen.apply(this, arguments);
        };

        var mediaTypes = [HTMLImageElement, HTMLAudioElement, HTMLVideoElement];
        for (var i = 0; i < mediaTypes.length; i++) {
            var Tag = mediaTypes[i];
            var desc = Object.getOwnPropertyDescriptor(Tag.prototype, 'src');
            if (desc && desc.set) {
                (function (d) {
                    Object.defineProperty(Tag.prototype, 'src', {
                        configurable: true,
                        enumerable: true,
                        get: d.get,
                        set: function (val) {
                            if (typeof val === 'string') {
                                var blobUrl = lookup(val);
                                if (blobUrl) {
                                    hit('mediaHits');
                                    try {
                                        if (Tag === HTMLImageElement) {
                                            this.crossOrigin = null;
                                        }
                                    } catch (e) {}
                                    d.set.call(this, blobUrl);
                                    return;
                                }
                            }
                            d.set.call(this, val);
                        }
                    });
                })(desc);
            }
        }

        var observer = new MutationObserver(function (mutations) {
            for (var m = 0; m < mutations.length; m++) {
                var nodes = mutations[m].addedNodes;
                for (var n = 0; n < nodes.length; n++) {
                    var node = nodes[n];
                    if (node && node.nodeType === 1 && node.tagName === 'STYLE') {
                        rewriteFontUrls(node);
                    }
                }
            }
        });
        observer.observe(document.head || document.documentElement, { childList: true, subtree: true });
        patchStyleInsertion();
    }

    /* ------- zip extraction ------- */
    function extractZip(arrayBuffer) {
        return JSZip.loadAsync(arrayBuffer).then(function (zip) {
            var entries = Object.keys(zip.files).filter(function (name) {
                var f = zip.files[name];
                return !f.dir;
            });
            var total = entries.length;
            var i = 0;

            var fonts = [];

            function next() {
                if (i >= total) {
                    return Promise.resolve(fonts);
                }
                var entryName = entries[i];
                var file = zip.files[entryName];
                return file.async('blob').then(function (blob) {
                    blobMap[entryName] = URL.createObjectURL(blob);
                    window.__bmBlobPaths[blobMap[entryName]] = entryName;
                    window.__bmStats.totalEntries++;
                    if (/^assets\/main\/fonts\/[^/]+\.ttf$/.test(entryName)) {
                        fonts.push(entryName);
                    }
                    i++;
                    if (i % 40 === 0 || i === total) {
                        updateProgress('BOOTING UP ARCHIVE...', 80 + Math.floor((i / total) * 20));
                    }
                    return next();
                });
            }

            return next();
        });
    }

    /* ------- font pre-registration (race-free) ------- */
    function registerFonts(fontPaths) {
        if (!document.fonts || !window.FontFace) return;
        fontPaths.forEach(function (path) {
            var family = path.split('/').pop().replace(/\.ttf$/i, '');
            try {
                var face = new FontFace(family, 'url("' + blobMap[path] + '")');
                face.load().then(function (loaded) {
                    document.fonts.add(loaded);
                    window.__bmStats.fontsRegistered++;
                }).catch(function (e) {
                    console.warn('[Bowmasters] font fallback for ' + family, e);
                });
            } catch (e) {
                console.warn('[Bowmasters] font skip ' + family, e);
            }
        });
    }

    /* ------- part merge ------- */
    function loadPart(partUrl) {
        return fetch(partUrl).then(function (res) {
            if (!res.ok) throw new Error('Missing part: ' + partUrl);
            return res.arrayBuffer();
        });
    }

    function mergeParts() {
        updateProgress('LOCATING ARCHIVE...', 2);
        var total = PARTS.length;
        var buffers = [];
        var loaded = 0;
        var chain = Promise.resolve();

        PARTS.forEach(function (num, idx) {
            chain = chain.then(function () {
                return loadPart(GITHUB_BASE + ZIP_NAME + '.part' + num).then(function (buf) {
                    buffers.push(buf);
                    loaded++;
                    updateProgress('LOCATING ARCHIVE...', 3 + Math.floor((loaded / total) * 47));
                });
            });
        });

        return chain.then(function () {
            updateProgress('UNPACKING ARCHIVE...', 51);
            var t0 = Date.now();
            return new Blob(buffers, { type: 'application/zip' }).arrayBuffer().then(function (ab) {
                window.__bmStats.mergedBytes = ab.byteLength;
                return ab;
            });
        });
    }

    /* ------- script injection ------- */
    function injectScript(code) {
        var blob = new Blob([code], { type: 'application/javascript' });
        var src = URL.createObjectURL(blob);
        return new Promise(function (resolve, reject) {
            var s = document.createElement('script');
            s.src = src;
            s.async = false;
            s.onload = function () {
                setTimeout(resolve, 0);
            };
            s.onerror = function (ev) {
                reject(new Error('Could not execute bundle'));
            };
            document.body.appendChild(s);
        });
    }

    /* ------- boot ------- */
    function done() {
        if (loadingWrap) loadingWrap.remove();
    }

    function boot() {
        updateProgress('DOWNLOADING ASSETS...', 4);
        var t0 = Date.now();
        mergeParts()
            .then(extractZip)
            .then(function (fonts) {
                updateProgress('STARTING GAME...', 98);
                installInterceptors();
                registerFonts(fonts);
                window.__bmStats.extractMs = Date.now() - t0;
                return fonts;
            })
            .then(function () {
                updateProgress('STARTING GAME...', 99);
                return loadCode('sdk.js').then(injectScript)
                    .then(function () { return loadCode('chunk_309.js'); }).then(injectScript)
                    .then(function () { return loadCode('game.js'); }).then(injectScript);
            })
            .then(function () {
                updateProgress('STARTING GAME...', 100);
                window.runGame();
                done();
            })
            .catch(function (err) {
                fail((err && err.message) || String(err));
            });
    }

    /* JSZip pull (mirrors FNAF's approach) */
    var JSZIP_CDN = 'https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js';
    var js = document.createElement('script');
    js.src = JSZIP_CDN;
    js.onload = boot;
    js.onerror = function () {
        fail('Could not reach CDN for JSZip');
    };
    document.body.appendChild(js);
})();

</script>
</body>
</html>
