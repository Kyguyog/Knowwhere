<Module>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="x-ua-compatible" content="ie=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>really cool flash game</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: black;
      overflow: hidden;
      height: 100%;
      width: 100%;
    }
    #flash-container {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: black;
      overflow: hidden;
    }
    .black-box {
      position: fixed;
      background: black;
      z-index: 10;
    }
    #box-top {
      top: 0;
      left: 0;
      width: 100%;
      height: 0;
    }
    #box-bottom {
      bottom: 0;
      left: 0;
      width: 100%;
      height: 0;
    }
    #box-left {
      top: 0;
      left: 0;
      width: 0;
      height: 100%;
    }
    #box-right {
      top: 0;
      right: 0;
      width: 0;
      height: 100%;
    }
    ruffle-player {
      width: 100%;
      height: 100%;
      background: black;
      display: block;
    }
  </style>
  <script>
    // Ruffle is streamed from the repo's game-assets folder. GitHub raw serves
    // .js as text/plain + nosniff, so Chromium's Opaque Response Blocking
    // refuses a cross-origin <script src> -- every script is downloaded as
    // text and re-served from a same-origin blob: URL instead.
    //
    // ruffle.js is not self-contained: at runtime webpack lazy-loads the
    // core.ruffle.<hash>.js chunk through a <script> tag and fetch()es the
    // .wasm, both resolved against ruffle.js's own URL (webpack's publicPath).
    // A blob: URL cannot be used as a base, so publicPath falls back to the
    // page's own folder and both requests 404 (the ChunkLoadError). Fix: run
    // the core chunk from a blob: URL *before* ruffle.js -- webpack drains the
    // self.webpackChunkruffle_selfhosted queue when its runtime starts, so the
    // chunk counts as already loaded -- and pin publicPath to the raw folder
    // so the wasm still resolves.
    window.kwRuffleBase =
      "https://raw.githubusercontent.com/Kyguyog/Knowwhere/main/game-assets/Burito%20Bison%20Revenge/";
    window.kwRuffleReady = (function () {
      var BASE = window.kwRuffleBase;

      function fetchText(url) {
        return fetch(url).then(function (r) {
          if (!r.ok) throw new Error("HTTP " + r.status + " for " + url);
          return r.text();
        });
      }

      function evalFromBlob(text) {
        var url = URL.createObjectURL(
          new Blob([text], { type: "text/javascript" })
        );
        return new Promise(function (res, rej) {
          var s = document.createElement("script");
          s.src = url;
          s.onload = function () {
            URL.revokeObjectURL(url);
            res();
          };
          s.onerror = function () {
            URL.revokeObjectURL(url);
            rej(new Error("kw script failed"));
          };
          document.head.appendChild(s);
        });
      }

      return fetchText(BASE + "core.ruffle.ae1054522f49580946c0.js")
        .then(evalFromBlob)
        .then(function () {
          window.RufflePlayer = window.RufflePlayer || {};
          window.RufflePlayer.config = Object.assign(
            { publicPath: BASE + "assets/" },
            window.RufflePlayer.config
          );
          return fetchText(BASE + "assets/ruffle.min.js");
        })
        .then(evalFromBlob);
    })();
  </script>
</head>
<body>
  <div id="flash-container"></div>
  <div class="black-box" id="box-top"></div>
  <div class="black-box" id="box-bottom"></div>
  <div class="black-box" id="box-left"></div>
  <div class="black-box" id="box-right"></div>
  <script>
    const container = document.getElementById("flash-container");
    const boxTop = document.getElementById("box-top");
    const boxBottom = document.getElementById("box-bottom");
    const boxLeft = document.getElementById("box-left");
    const boxRight = document.getElementById("box-right");
    
    function resizeGame() {
      const windowWidth = window.innerWidth;
      const windowHeight = window.innerHeight;
      const aspectRatio = 5.5 / 3;
      
      // Use 95% of available space instead of 100%
      let width = Math.floor(windowWidth * 1);
      let height = Math.floor(width / aspectRatio);
      
      if (height > windowHeight * 1) {
        height = Math.floor(windowHeight * 1);
        width = Math.floor(height * aspectRatio);
      }
      
      container.style.width = `${width}px`;
      container.style.height = `${height}px`;
      
      // Calculate margins
      const topMargin = (windowHeight - height) / 2;
      const leftMargin = (windowWidth - width) / 2;
      
      // Set black box sizes
      boxTop.style.height = `${topMargin}px`;
      boxBottom.style.height = `${topMargin}px`;
      boxLeft.style.width = `${leftMargin}px`;
      boxRight.style.width = `${leftMargin}px`;
    }
    
    window.addEventListener("resize", resizeGame);
    window.addEventListener("DOMContentLoaded", () => {
      resizeGame();
      (window.kwRuffleReady || Promise.resolve()).then(() => {
        const ruffle = window.RufflePlayer?.newest() || window.RufflePlayer?.createPlayer();
        if (!ruffle || !container) {
          container.textContent = "Ruffle failed to load.";
          return;
        }
        const player = ruffle.createPlayer();
        player.style.width = "100%";
        player.style.height = "100%";
        player.style.background = "black";
        container.appendChild(player);
        player.load(window.kwRuffleBase + "Burrito_Bison_Revenge_FIX.swf").catch((e) => {
          console.warn("swf load:", e);
          container.textContent = "Ruffle failed to load.";
        });
      }).catch((e) => {
        console.warn("ruffle load:", e);
        container.textContent = "Ruffle failed to load.";
      });
    });
  </script>

</body>
</html>
