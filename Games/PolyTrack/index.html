<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no"
    />
    <base href="https://raw.githubusercontent.com/Kyguyog/Knowwhere/main/game-assets/PolyTrack/" />
    <script>
      window.polytrackModConfiguration = {
        unblocked: true,
        modName: "PolyUnblocked",
        author: "Kyguy",
      };
    </script>
    <script>
      // crypto.subtle only exists in secure contexts, and the site is served
      // over plain HTTP (its HTTPS cert is self-signed). PolyTrack SHA-256
      // hashes every car/part physics mesh during boot, so on HTTP it dies
      // with "Cannot read properties of undefined (reading 'digest')". When
      // the native SubtleCrypto is missing, fall back to a pure-JS SHA-256
      // that speaks just enough of the WebCrypto API for the game.
      (function () {
        function rotr(x, n) {
          return (x >>> n) | (x << (32 - n));
        }

        function sha256(bytes) {
          var K = [
            0x428a2f98, 0x71374491, 0xb5c0fbcf, 0xe9b5dba5, 0x3956c25b,
            0x59f111f1, 0x923f82a4, 0xab1c5ed5, 0xd807aa98, 0x12835b01,
            0x243185be, 0x550c7dc3, 0x72be5d74, 0x80deb1fe, 0x9bdc06a7,
            0xc19bf174, 0xe49b69c1, 0xefbe4786, 0x0fc19dc6, 0x240ca1cc,
            0x2de92c6f, 0x4a7484aa, 0x5cb0a9dc, 0x76f988da, 0x983e5152,
            0xa831c66d, 0xb00327c8, 0xbf597fc7, 0xc6e00bf3, 0xd5a79147,
            0x06ca6351, 0x14292967, 0x27b70a85, 0x2e1b2138, 0x4d2c6dfc,
            0x53380d13, 0x650a7354, 0x766a0abb, 0x81c2c92e, 0x92722c85,
            0xa2bfe8a1, 0xa81a664b, 0xc24b8b70, 0xc76c51a3, 0xd192e819,
            0xd6990624, 0xf40e3585, 0x106aa070, 0x19a4c116, 0x1e376c08,
            0x2748774c, 0x34b0bcb5, 0x391c0cb3, 0x4ed8aa4a, 0x5b9cca4f,
            0x682e6ff3, 0x748f82ee, 0x78a5636f, 0x84c87814, 0x8cc70208,
            0x90befffa, 0xa4506ceb, 0xbef9a3f7, 0xc67178f2,
          ];
          var H = [
            0x6a09e667, 0xbb67ae85, 0x3c6ef372, 0xa54ff53a, 0x510e527f,
            0x9b05688c, 0x1f83d9ab, 0x5be0cd19,
          ];
          var len = bytes.length;
          var padded = new Uint8Array((((len + 8) >> 6) + 1) * 64);
          padded.set(bytes);
          padded[len] = 0x80;
          var dv = new DataView(padded.buffer);
          dv.setUint32(padded.length - 8, Math.floor(len / 536870912));
          dv.setUint32(padded.length - 4, (len << 3) >>> 0);
          var w = new Int32Array(64);
          for (var off = 0; off < padded.length; off += 64) {
            var i;
            for (i = 0; i < 16; i++) w[i] = dv.getUint32(off + i * 4);
            for (i = 16; i < 64; i++) {
              var x = w[i - 15],
                y = w[i - 2];
              w[i] =
                (w[i - 16] +
                  (rotr(x, 7) ^ rotr(x, 18) ^ (x >>> 3)) +
                  w[i - 7] +
                  (rotr(y, 17) ^ rotr(y, 19) ^ (y >>> 10))) |
                0;
            }
            var a = H[0],
              b = H[1],
              c = H[2],
              d = H[3],
              e = H[4],
              f = H[5],
              g = H[6],
              h = H[7];
            for (i = 0; i < 64; i++) {
              var t1 =
                (h +
                  (rotr(e, 6) ^ rotr(e, 11) ^ rotr(e, 25)) +
                  ((e & f) ^ (~e & g)) +
                  K[i] +
                  w[i]) |
                0;
              var t2 =
                ((rotr(a, 2) ^ rotr(a, 13) ^ rotr(a, 22)) +
                  ((a & b) ^ (a & c) ^ (b & c))) |
                0;
              h = g;
              g = f;
              f = e;
              e = (d + t1) | 0;
              d = c;
              c = b;
              b = a;
              a = (t1 + t2) | 0;
            }
            H[0] = (H[0] + a) | 0;
            H[1] = (H[1] + b) | 0;
            H[2] = (H[2] + c) | 0;
            H[3] = (H[3] + d) | 0;
            H[4] = (H[4] + e) | 0;
            H[5] = (H[5] + f) | 0;
            H[6] = (H[6] + g) | 0;
            H[7] = (H[7] + h) | 0;
          }
          var out = new Uint8Array(32);
          var odv = new DataView(out.buffer);
          for (var j = 0; j < 8; j++) odv.setUint32(j * 4, H[j] >>> 0);
          return out;
        }

        function install() {
          var host = window.crypto;
          if (!host) {
            try {
              Object.defineProperty(window, "crypto", {
                value: {},
                configurable: true,
                writable: true,
              });
            } catch (err) {}
            host = window.crypto;
          }
          if (!host) return;
          if (host.subtle && typeof host.subtle.digest === "function") return;

          var fallback = {
            digest: function (algorithm, data) {
              try {
                var name = String(algorithm).toUpperCase().replace(/-/g, "");
                if (name !== "SHA256")
                  return Promise.reject(
                    new DOMException(
                      "Algorithm not supported",
                      "NotSupportedError",
                    ),
                  );
                var bytes;
                if (data instanceof ArrayBuffer) bytes = new Uint8Array(data);
                else if (ArrayBuffer.isView(data))
                  bytes = new Uint8Array(
                    data.buffer,
                    data.byteOffset,
                    data.byteLength,
                  );
                else
                  throw new TypeError(
                    "digest() expects an ArrayBuffer or view",
                  );
                return Promise.resolve(sha256(bytes).buffer);
              } catch (err) {
                return Promise.reject(err);
              }
            },
          };

          try {
            Object.defineProperty(host, "subtle", {
              value: fallback,
              configurable: true,
              writable: true,
            });
          } catch (err) {
            try {
              host.subtle = fallback;
            } catch (err2) {
              console.warn("crypto.subtle fallback could not be installed");
            }
          }
        }

        install();
      })();
    </script>
  </head>
  <body>
    <canvas id="screen"></canvas>
    <div id="ui"></div>
    <div id="transition-layer"></div>
    <script>
      // PolyTrack (a webpack build) is streamed from the repo's game-assets
      // folder like every other game on the site. GitHub raw serves .js as
      // text/plain, so Chromium's Opaque Response Blocking refuses to execute
      // it from a cross-origin <script> tag -- instead every script is
      // downloaded as text and re-served from a same-origin blob: URL (the
      // trick used by FNAE, Going Balls, etc.). The <base> tag makes every URL
      // the game resolves against the document (images, models, tracks, draco,
      // fonts) point at the raw folder; webpack's publicPath and the physics
      // worker wiring are patched to match.
      (function () {
        var BASE =
          "https://raw.githubusercontent.com/Kyguyog/Knowwhere/main/game-assets/PolyTrack/";
        var CHUNKS = [
          "124.bundle.js",
          "142.bundle.js",
          "168.bundle.js",
          "280.bundle.js",
          "57.bundle.js",
          "789.bundle.js",
          "982.bundle.js",
        ];

        function fetchText(url) {
          return fetch(url).then(function (r) {
            if (!r.ok) throw new Error("HTTP " + r.status + " for " + url);
            return r.text();
          });
        }

        function blobUrl(src) {
          return URL.createObjectURL(
            new Blob([src], { type: "application/javascript" })
          );
        }

        function patchedBlob(src, patches, label) {
          var out = src;
          patches.forEach(function (p) {
            out = out.split(p[0]).join(p[1]);
            if (out.indexOf(p[1]) === -1)
              console.warn(label + ": patch text not present");
          });
          return blobUrl(out);
        }

        Promise.all([
          // Physics glue: it derives its relative wasm path from
          // `new URL(".", self.location.href)`, i.e. the worker script's own
          // folder -- pin it to the raw folder root where the wasm lives.
          fetchText(BASE + "lib/polytrack_physics.js").then(function (src) {
            return patchedBlob(
              src,
              [
                [
                  "r=self.location.href",
                  'r="' + BASE + 'simulation_worker.bundle.js"',
                ],
              ],
              "polytrack_physics.js"
            );
          }),
          // Simulation worker (patched once the physics blob exists).
          fetchText(BASE + "simulation_worker.bundle.js"),
          // Every script the build loads at runtime; chunks first so they sit
          // in webpack's shared array before the entry runtime consumes them.
          Promise.all(
            []
              .concat(CHUNKS, ["error_screen.bundle.js", "main.bundle.js"])
              .map(function (f) {
                return fetchText(BASE + f);
              })
          ),
        ])
          .then(function (results) {
            var physicsUrl = results[0];
            var workerSource = results[1];

            var workerBody = workerSource.split(
              'importScripts("lib/polytrack_physics.js")'
            ).join('importScripts("' + physicsUrl + '")');
            var workerUrl = URL.createObjectURL(
              new Blob([workerBody], { type: "application/javascript" })
            );

            var entrySources = results[2];
            var mainUrl = patchedBlob(
              entrySources[CHUNKS.length + 1],
              [
                // Freeze webpack's publicPath so every n.p + "..." asset
                // reference goes straight to the raw folder.
                ["(i.p = e)", '(i.p = "' + BASE + '")'],
                // Route the physics worker through its blob.
                [
                  'new Worker("simulation_worker.bundle.js")',
                  'new Worker("' + workerUrl + '")',
                ],
                // The shipped three.js WebGLState wrappers are mangled: each
                // `catch (e) { e("WebGLState:", e) }` captures the thrown
                // error into `e`, then calls it as a function -- minifiers
                // collapsed `console` and the catch parameter to the same
                // name. Whenever a WebGL texture call actually throws, the
                // handler itself throws "e is not a function" and the whole
                // game dies instead of logging and continuing. Restore the
                // intended log-and-continue behavior.
                [
                  '} catch (e) {\n                e("WebGLState:", e);\n              }',
                  '} catch (e) {\n                console.error("WebGLState:", e);\n              }',
                ],
              ],
              "main.bundle.js"
            );

            var urls = [];
            for (var i = 0; i < CHUNKS.length; i++)
              urls.push(blobUrl(entrySources[i]));
            urls.push(blobUrl(entrySources[CHUNKS.length])); // error_screen
            urls.push(mainUrl);

            urls.forEach(function (u) {
              var s = document.createElement("script");
              s.src = u;
              document.body.appendChild(s);
            });
          })
          .catch(function (err) {
            console.error("LOADER-FAIL", (err && err.stack) || err);
            alert("Failed to download the game: " + err.message);
          });
      })();
    </script>
  </body>
</html>
