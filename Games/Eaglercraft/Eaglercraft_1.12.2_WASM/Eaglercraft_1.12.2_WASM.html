    <!-- Network Fetch Interceptor Hook -->
    <script type="text/javascript">
        const repoBase = "https://raw.githubusercontent.com/Kyguyog/Knowwhere/refs/heads/main/game-assets/Eaglercraft/Eaglercraft_1.12.2_WASM/assets/";

        // Intercept browser network requests to catch hardcoded engine paths
        const nativeFetch = window.fetch;
        window.fetch = function(...args) {
            let url = args[0];
            if (typeof url === 'string') {
                // If the game tries to download any game asset chunks, force the GitHub path
                if (url.includes('asset_0.bin')) {
                    args[0] = repoBase + 'asset_0.bin';
                } else if (url.includes('asset_1.bin')) {
                    args[0] = repoBase + 'asset_1.bin';
                } else if (url.includes('assets.epk')) {
                    args[0] = repoBase + 'assets.epk';
                }
            }
            return nativeFetch.apply(this, args);
        };
    </script>

    <!-- The Final Pure GitHub WASM-GC Dynamic Executor -->
    <script type="text/javascript">
        // Standard option layout matching original configurations
        window.eaglercraftXOpts = {
            container: "game_frame", 
            assetsURI: "assets/asset_0.bin", 
            worldsDB: "worlds_1122_wasm",
            servers: [
                { serverName: "ArchMC", serverAddress: "wss://mc.arch.lol/", hideAddress: false }
            ]
        };

        const scriptFiles = ["script_0.js", "script_1.js", "script_2.js"];

        // Forces script element loading with proper execution context mapping
        function injectScriptElement(url) {
            return new Promise((resolve, reject) => {
                const script = document.createElement('script');
                script.type = 'text/javascript';
                
                nativeFetch(url)
                    .then(response => {
                        if (!response.ok) throw new Error("Network issue pulling from GitHub repository");
                        return response.text();
                    })
                    .then(code => {
                        const blob = new Blob([code], { type: 'application/javascript' });
                        const blobURL = URL.createObjectURL(blob);
                        
                        script.src = blobURL;
                        script.onload = () => {
                            // Keep context alive long enough for engine initialization steps
                            setTimeout(() => URL.revokeObjectURL(blobURL), 5000);
                            resolve();
                        };
                        script.onerror = reject;
                        document.body.appendChild(script);
                    })
                    .catch(err => {
                        console.error("Fetch pipeline failure:", err);
                        reject(err);
                    });
            });
        }

        async function startEngineQueue() {
            try {
                // Step 1: Load all 3 structural scripts sequentially
                for (const file of scriptFiles) {
                    await injectScriptElement(repoBase + file);
                    console.log(`Loaded: ${file}`);
                }
                
                // Step 2: Clear countdown overlays once memory finishes mounting
                const overlay = document.getElementById("launch_countdown_screen");
                if (overlay) overlay.style.display = "none";
                
                // Step 3: Spark the engine execution loop!
                console.log("Triggering Eaglercraft WASM engine main()...");
                if (typeof main === "function") {
                    main();
                } else if (typeof window.main === "function") {
                    window.main();
                } else {
                    console.warn("Main execution function block was not globally declared.");
                }
                
            } catch (queueError) {
                console.error("Initialization queue failure:", queueError);
            }
        }

        // Run execution queue right away
        startEngineQueue();
    </script>
