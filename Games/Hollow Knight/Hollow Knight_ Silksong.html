    <style>
html, body {

  <body>
    <div id="loading-text" style="color: white; font-size: 48px; font-family: cursive; text-align: center; margin-top: 20px;"> LOADING...</div>
    <div id="unity-container">
      <canvas id="unity-canvas" width=960 height=600 tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"> </div>
    </div>
<script>
const loadingText = document.querySelector("#loading-text");
const CACHE_NAME = "hksilksongcache-v2"; // bump version if needed

/* ================= GITHUB ASSET CONFIG ================= */
const GITHUB_BASE = "https://raw.githubusercontent.com/Kyguyog/Knowwhere/main/Games/Hollow%20Knight/assets/";
const CODE_BASE = "https://raw.githubusercontent.com/Kyguyog/Knowwhere/main/Games/Hollow%20Knight/code/";
var blobMap = Object.create(null);

function normalizePath(url) {
  if (url instanceof URL) url = url.href;
  url = String(url);
  try {
    if (/^https?:/.test(url)) {
      const u = new URL(url);
      url = u.pathname + u.search;
    }
  } catch (e) {}
  url = url.split("?")[0].split("#")[0];
  if (url.charAt(0) === "/") url = url.slice(1);
  if (url.indexOf("Hollow%20Knight/") !== -1) {
    url = url.slice(url.indexOf("Hollow%20Knight/") + "Hollow%20Knight/".length);
  }
  return url;
}

function lookup(url) {
  var name = normalizePath(url);
  for (var key in blobMap) {
    if (name === key || name.indexOf(key) !== -1 || key === "assets/" + name) {
      return blobMap[key];
    }
    var rel = key.replace(/^assets\//, "");
    if (name === rel || name.indexOf(rel) !== -1) {
      return blobMap[key];
    }
  }
  return null;
}

/* ================= FETCH OVERRIDE ================= */
const originalFetch = window.fetch;

window.fetch = async function(resource, options) {
  let url = typeof resource === "string" ? resource : resource.url;

  const blobUrl = lookup(url);
  if (blobUrl) {
    return originalFetch(blobUrl, options);
  }

  let cleanPath = url.split("/").pop();

  const cache = await caches.open(CACHE_NAME);

  const cachedResponse = await cache.match(cleanPath);
  if (cachedResponse) {
    return cachedResponse;
  }

  return originalFetch(resource, options);
};

/* ================= BLOB SCRIPT INJECTION ================= */
function loadBlobScript(url) {
  return originalFetch(url)
    .then(function (r) {
      if (!r.ok) throw new Error("Missing: " + url);
      return r.text();
    })
    .then(function (code) {
      return new Promise(function (resolve, reject) {
        var s = document.createElement("script");
        s.src = URL.createObjectURL(
          new Blob([code], { type: "application/javascript" })
        );
        s.onload = function () { setTimeout(resolve, 0); };
        s.onerror = function () { reject(new Error("Could not execute: " + url)); };
        document.body.appendChild(s);
      });
    });
}

/* ================= CACHE CHECK ================= */
async function isCached() {
  const cache = await caches.open(CACHE_NAME);
  const done = await cache.match("CACHE_COMPLETE");
  return !!done;
}

async function cleanupOldCaches() {
  const cacheNames = await caches.keys();

  await Promise.all(
    cacheNames.map(name => {
      if (name !== CACHE_NAME && name.includes("hksilksong")) {
        console.log("Deleting old cache:", name);
        return caches.delete(name);
      }
    })
  );
}

/* ================= UNZIP ================= */
async function unzipAndStore(zipBlob) {
  if (!zipBlob) {
    throw new Error("ZIP is missing");
  }

  loadingText.textContent = "EXTRACTING ASSETS...";

  const zip = await JSZip.loadAsync(zipBlob);
  const files = Object.values(zip.files).filter(f => !f.dir);
  const total = files.length;

  const cache = await caches.open(CACHE_NAME);

  let processed = 0;
  const batchSize = 10;

  for (let i = 0; i < files.length; i += batchSize) {
    const batch = files.slice(i, i + batchSize);

    await Promise.all(batch.map(async (file) => {
      try {
        const blob = await file.async("blob");
        await cache.put(file.name, new Response(blob));
        if (!blobMap["assets/" + file.name]) {
          blobMap["assets/" + file.name] = URL.createObjectURL(blob);
        }
      } catch (e) {
        console.error("Failed:", file.name, e);
      }

      processed++;
      loadingText.textContent =
        `EXTRACTING ASSETS... (${processed}/${total})`;
    }));

    await new Promise(r => setTimeout(r, 0));
  }

  // ✅ mark cache complete
  await cache.put("CACHE_COMPLETE", new Response("ok"));

  console.log("Cache complete");
}

/* ================= DOWNLOAD ================= */
let loadedBytes = 0;

async function fetchWithProgress(url) {
  const response = await originalFetch(url);

  if (!response.ok) {
    throw new Error("Failed to fetch: " + url);
  }

  const reader = response.body.getReader();
  let chunks = [];
  let received = 0;

  while (true) {
    const { done, value } = await reader.read();
    if (done) break;

    received += value.length;
    loadedBytes += value.length;
    chunks.push(value);

    let mbDone = (loadedBytes / (1024 * 1024)).toFixed(2);
    let mbTotal = '1986.64';

    loadingText.textContent =
      `DOWNLOADING ASSETS... (${mbDone} MB / ${mbTotal} MB)`;
  }

  let fullBuffer = new Uint8Array(received);
  let offset = 0;

  for (let chunk of chunks) {
    fullBuffer.set(chunk, offset);
    offset += chunk.length;
  }

  return fullBuffer.buffer;
}

/* ================= MERGE ================= */
async function mergeFiles(parts) {
  console.log("Downloading parts:", parts.length);

  const buffers = await Promise.all(
    parts.map(part => fetchWithProgress(GITHUB_BASE + part))
  );

  return new Blob(buffers);
}

/* ================= UTIL ================= */
function getParts(file, start, end) {
  let parts = [];
  for (let i = start; i <= end; i++) {
    parts.push(file + ".part" + i);
  }
  return parts;
}

/* ================= MAIN ================= */
(async () => {
  try {
    await cleanupOldCaches(); 
    if (!(await isCached())) {
      await loadBlobScript(CODE_BASE + "jszip.js");
      loadingText.textContent = "DOWNLOADING ASSETS...";

      const webglzip = await mergeFiles(
        getParts("StreamingAssets/aa/WebGL.zip", 1, 100)
      );

      await unzipAndStore(webglzip);
    } else {
      loadingText.textContent = "LOADING FROM CACHE...";
    }

    /* ================= PRELOAD BUILD FILES ================= */
    const buildFiles = [
      "Build/w-pt.data.unityweb",
      "Build/w-pt.framework.js.unityweb",
      "Build/w-pt.wasm.unityweb",
    ];

    await Promise.all(buildFiles.map(async (path) => {
      if (blobMap[path]) return;
      const res = await originalFetch(GITHUB_BASE + path);
      if (!res.ok) throw new Error("Missing build file: " + path);
      const blob = await res.blob();
      blobMap[path] = URL.createObjectURL(blob);
      console.log("Build blob ready:", path);
    }));

    /* ================= UNITY START ================= */
    const canvas = document.querySelector("#unity-canvas");
    const loadingBar = document.querySelector("#unity-loading-bar");
    const progressBarFull = document.querySelector("#unity-progress-bar-full");
    const warningBanner = document.querySelector("#unity-warning");

    function unityShowBanner(msg, type) {
      function update() {
        warningBanner.style.display =
          warningBanner.children.length ? 'block' : 'none';
      }

      let div = document.createElement('div');
      div.innerHTML = msg;
      warningBanner.appendChild(div);

      if (type == 'error') {
        div.style = 'background:red;padding:10px;';
      } else {
        if (type == 'warning') {
          div.style = 'background:yellow;padding:10px;';
        }
        setTimeout(() => {
          warningBanner.removeChild(div);
          update();
        }, 5000);
      }

      update();
    }

    const buildUrl = "Build";

    const config = {
      dataUrl: blobMap["Build/w-pt.data.unityweb"],
      frameworkUrl: blobMap["Build/w-pt.framework.js.unityweb"],
      codeUrl: blobMap["Build/w-pt.wasm.unityweb"],
      streamingAssetsUrl: "StreamingAssets",
      companyName: "EDUrocks Group, Truffled, GN-Math",
      productName: "Hollow Knight SilkSong",
      productVersion: "1.0",
      showBanner: unityShowBanner,
    };

    loadingBar.style.display = "block";

    const script = document.createElement("script");
    script.onload = () => {
      createUnityInstance(canvas, config, (progress) => {
        progressBarFull.style.width = (progress * 100) + "%";
      })
      .then(() => {
        loadingBar.remove();
        loadingText.remove();
      })
      .catch(alert);
    };

    originalFetch(CODE_BASE + "unity-loader.js")
      .then(function (r) {
        if (!r.ok) throw new Error("Missing unity-loader.js");
        return r.text();
      })
      .then(function (code) {
        const blob = new Blob([code], { type: "application/javascript" });
        script.src = URL.createObjectURL(blob);
        document.body.appendChild(script);
      })
      .catch(function (err) {
        console.error(err);
        loadingText.textContent = "ERROR: " + err.message;
      });

  } catch (err) {
    console.error(err);
    loadingText.textContent = "ERROR: " + err.message;
  }
})();
</script>
