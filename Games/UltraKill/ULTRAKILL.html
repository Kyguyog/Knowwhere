<body style="text-align: center; padding: 0; border: 0; margin: 0;">
    <div id='loading-text' style="color: black; font-family: cursive; font-size: 48px; text-align: center; margin-top: 20px;">LOADING...</div>
    <canvas id="unity-canvas" tabindex="-1" hidden></canvas>
    <script>
var GITHUB_BASE = "https://raw.githubusercontent.com/Kyguyog/Knowwhere/main/Games/UltraKill/assets/";

var loadingText = document.querySelector("#loading-text");

/* Load the Unity loader from GitHub and inject as a blob */
function injectScript(code) {
  var blob = new Blob([code], { type: 'application/javascript' });
  var src = URL.createObjectURL(blob);
  return new Promise(function (resolve, reject) {
    var s = document.createElement('script');
    s.src = src;
    s.async = false;
    s.onload = function () { setTimeout(resolve, 0); };
    s.onerror = function () { reject(new Error('Could not execute script')); };
    document.body.appendChild(s);
  });
}

function loadBlobText(name) {
  return fetch(GITHUB_BASE + name).then(function (r) {
    if (!r.ok) throw new Error('Missing: ' + name + ' (HTTP ' + r.status + ')');
    return r.text();
  });
}

function getParts(file, start, end) {
  let parts = [];
  for (let i = start; i <= end; i++) {
    parts.push(file + ".part" + i);
  }
  return parts;
}

function mergeFiles(fileParts) {
  return new Promise((resolve, reject) => {
    let buffers = [];

    function fetchPart(index) {
      if (index >= fileParts.length) {
        let mergedBlob = new Blob(buffers);
        resolve(URL.createObjectURL(mergedBlob));
        return;
      }
      fetch(GITHUB_BASE + fileParts[index]).then((response) => response.arrayBuffer()).then((data) => {
        buffers.push(data);
        fetchPart(index + 1);
      }).catch(reject);
    }
    fetchPart(0);
  });
}

(function() {
  loadBlobText("Build/ultrakill.loader.js")
    .then(injectScript)
    .then(function () {
      loadingText.textContent = "DOWNLOADING ASSETS...";
      return Promise.all([
        mergeFiles(getParts("Build/ultrakill.data.unityweb", 1, 4)),
        mergeFiles(getParts("Build/ultrakill.wasm.unityweb", 1, 2)),
        fetch(GITHUB_BASE + "Build/ultrakill.framework.js.unityweb").then(function (r) {
          if (!r.ok) throw new Error('Missing framework (HTTP ' + r.status + ')');
          return r.blob();
        }).then(function (blob) {
          return URL.createObjectURL(blob);
        })
      ]);
    })
    .then(function (results) {
      var dataUrl = results[0];
      var wasmUrl = results[1];
      var frameworkUrl = results[2];

      document.querySelector("#unity-canvas").hidden = false;
      createUnityInstance(document.querySelector("#unity-canvas"), {
        dataUrl: dataUrl,
        frameworkUrl: frameworkUrl,
        codeUrl: wasmUrl,
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Hakita and Cake Logic",
        productName: "ULTRAKILL",
        productVersion: "1.4",
      }).then(function () {
        loadingText.remove();
      });
    })
    .catch(function (err) {
      console.error('[ULTRAKILL]', err);
      loadingText.textContent = "ERROR: " + err.message;
    });
})();
</script>

<div id="sidebarad2">
