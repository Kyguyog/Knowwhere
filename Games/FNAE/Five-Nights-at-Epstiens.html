<!DOCTYPE html>
<html lang="en-us">
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Five Nights at Epstein's</title>
    <link rel="canonical" href="https://knowwhere.mygamesonline.org/Games/FNAE/Five-Nights-at-Epstiens.html">
    <link rel="icon" href="https://raw.githubusercontent.com/Kyguyog/Knowwhere/refs/heads/main/game-assets/FNAE/build/favicon-32x32.webp" type="image/webp">
    <style>
        * { margin: 0; padding: 0; }
        html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
        body { display: flex; align-items: center; justify-content: center; font-family: monospace; color: #888; }

        #boot { display: flex; flex-direction: column; align-items: center; gap: 14px; }
        #boot.done { display: none; }
        #boot-bar-empty { width: 300px; height: 18px; background: #1a1a1a; border: 1px solid #444; border-radius: 9px; overflow: hidden; }
        #boot-bar-full { width: 12%; height: 100%; background: linear-gradient(to right, #c8a600, #ffd700); border-radius: 9px; transition: width .4s ease; }
        #boot-text { font-size: 14px; }
        #boot-error { display: none; max-width: 620px; padding: 14px 18px; background: #1a0000; border: 1px solid #a00; border-radius: 8px; color: #e88; font-size: 13px; line-height: 1.5; }
        #boot-error a { color: #ffd700; }
        #boot-retry { display: none; margin-top: 4px; padding: 6px 14px; background: #222; border: 1px solid #555; border-radius: 6px; color: #ddd; font: inherit; font-size: 13px; cursor: pointer; }
        #boot-retry:hover { background: #2c2c2c; }
    </style>
</head>
<body>
    <div id="boot">
        <div id="boot-bar-empty"><div id="boot-bar-full"></div></div>
        <div id="boot-text">Pulling FNAE from GitHub...</div>
        <div id="boot-error"></div>
        <button id="boot-retry" type="button">Retry</button>
    </div>

    <script>
    // Thin launcher: the real game page lives in the repo's game-assets folder and
    // is streamed from raw.githubusercontent.com, same as every other asset on the
    // site. This file only fetches it and swaps it in, so the Unity build runs in
    // this page's origin (Unity needs a real origin for IndexedDB saves) instead of
    // a cross-origin iframe.
    //
    // raw.githubusercontent serves .html as text/plain, so the page has to be
    // fetched and written in - pointing an iframe straight at the raw URL would
    // render it as plain text.
    //
    // Query params: ?ref=<branch>  pull from another branch
    //                ?page=<path>  pull a different file (repo path, or a
    //                             root-relative/absolute URL for local testing)
    (function () {
        var OWNER = "Kyguyog";
        var REPO = "Knowwhere";
        var DEFAULT_REF = "main";
        var DEFAULT_PAGE = "game-assets/FNAE/index.html";
        var TIMEOUT_MS = 20000;

        var params = new URLSearchParams(location.search);
        var ref = params.get("ref") || DEFAULT_REF;
        var page = params.get("page") || DEFAULT_PAGE;
        // ?page= accepts a repo path (game-assets/FNAE/index.html), or a
        // root-relative / absolute URL so you can test local edits without
        // pushing first.
        var src = /^(https?:\/\/|\/)/.test(page)
            ? page
            : "https://raw.githubusercontent.com/" + OWNER + "/" + REPO + "/refs/heads/" +
              encodeURIComponent(ref) + "/" + page.split("/").map(encodeURIComponent).join("/");

        var boot = document.getElementById("boot");
        var bar = document.getElementById("boot-bar-full");
        var text = document.getElementById("boot-text");
        var errorBox = document.getElementById("boot-error");
        var retry = document.getElementById("boot-retry");

        function fail(message) {
            bar.style.display = "none";
            text.textContent = "Could not load FNAE";
            errorBox.style.display = "block";
            errorBox.innerHTML = message + "<br>Tried: <a href=\"" + src + "\" target=\"_blank\" rel=\"noopener\">" + src + "</a>";
            retry.style.display = "inline-block";
        }

        function load() {
            errorBox.style.display = "none";
            errorBox.textContent = "";
            retry.style.display = "none";
            bar.style.display = "";
            bar.style.width = "35%";
            text.textContent = "Pulling FNAE from GitHub...";

            var controller = new AbortController();
            var timer = setTimeout(function () { controller.abort(); }, TIMEOUT_MS);

            fetch(src, { signal: controller.signal, cache: "no-store" })
                .then(function (response) {
                    if (!response.ok) throw new Error("GitHub returned HTTP " + response.status);
                    return response.text();
                })
                .then(function (html) {
                    clearTimeout(timer);
                    if (!/<canvas|createUnityInstance/i.test(html)) {
                        throw new Error("that file is not the FNAE page (wrong ref or path?)");
                    }
                    bar.style.width = "100%";
                    // Drop the splash before the game's own markup is written over it.
                    boot.remove();
                    document.open();
                    document.write(html);
                    document.close();
                })
                .catch(function (err) {
                    clearTimeout(timer);
                    fail(err && err.name === "AbortError" ? "Timed out waiting on GitHub." : String(err && err.message || err));
                });
        }

        retry.addEventListener("click", load);
        load();
    })();
    </script>
</body>
</html>
