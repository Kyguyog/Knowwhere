  <style>
/* ===================== */
/* Canvas + Container    */
/* ===================== */
#unity-container {
  position: fixed;
  inset: 0;
}
#unity-canvas {
  background: #000;       /* dark screen while loading */
  display: block;
  width: 100vw;
  height: 100vh;
}

/* ===================== */
/* Loader UI             */
/* ===================== */
#unity-loading-bar {
  position: absolute;
  left: 50%;
  top: 36%;               /* moved up so content stays in view */
  transform: translate(-50%, -50%);
  display: block;
  z-index: 9999;          /* stay above canvas */
}

/* hide the loader once Unity is ready */
#unity-loading-bar.hidden {
  display: none !important;
}

/* ===================== */
/* Logo & Text           */
/* ===================== */
#unity-logo {
  width: clamp(160px, 38vw, 384px);
  aspect-ratio: 1 / 1;    /* keep square */
  height: auto;           /* aspect-ratio controls height */
  background: url('https://raw.githubusercontent.com/Kyguyog/Knowwhere/main/game-assets/Snow%20Rider%203D%202/html5.gamedistribution.com/longurls/TemplateData/logo.png') no-repeat center / contain;
}

/* Text + spinner tightly under the logo, same line */
#unity-text-progress {
  position: absolute;
  left: 50%;
  top: calc(100% + 6px);  /* small gap below the logo */
  transform: translateX(-50%);
  color: white;

  /* typography */
  font-weight: 700;
  font-family: "Times New Roman", Times, serif, Haettenschweiler, "Arial Narrow Bold", Helvetica, Verdana, sans-serif;
  font-size: clamp(14px, 2.4vw, 25px);
  line-height: 1.2;
  text-align: center;

  /* layout */
  width: min(90vw, 500px);
  display: inline-flex;   /* keep text + gear on one line */
  align-items: center;
  justify-content: center;
  gap: 6px;               /* space between text and spinner */
  white-space: nowrap;    /* prevent wrap; see media query below to relax */
}

#unity-text-progress img.spinner {
  display: inline-block;
  margin: 0;              /* no extra margins */
  vertical-align: middle;
  width: clamp(36px, 10vw, 66px);  /* responsive spinner */
  height: clamp(36px, 10vw, 66px);
}

/* ===================== */
/* Progress Bar          */
/* ===================== */
#unity-progress-bar-empty {
  width: 211px;
  height: 26px;
  margin-top: 20px;
  background: url('https://raw.githubusercontent.com/Kyguyog/Knowwhere/main/game-assets/Snow%20Rider%203D%202/html5.gamedistribution.com/longurls/TemplateData/progressEmpty.Light.png') no-repeat center;
}

#unity-progress-bar-full {
  width: 0%;
  height: 26px;
  background: url('https://raw.githubusercontent.com/Kyguyog/Knowwhere/main/game-assets/Snow%20Rider%203D%202/html5.gamedistribution.com/longurls/TemplateData/progressFull.Light.png') no-repeat center;
}

/* ===================== */
/* Warning Banner        */
/* ===================== */
#unity-warning {
  position: absolute;
  left: 50%;
  top: 5%;
  transform: translate(-50%);
  background: white;
  padding: 10px;
  display: none;
}

/* ===================== */
/* Small-screen tweaks   */
/* ===================== */
@media (max-height: 600px) {
  #unity-loading-bar { top: 32%; }  /* nudge higher on short displays */
}

@media (max-width: 360px) {
  /* allow wrapping if space is extremely tight */
  #unity-text-progress { white-space: normal; }
}

  <!-- UNITY_BUILD from your current index.html so hashed paths are available to both modes -->
  <script>
    window.kwLoadJs = function (url) {
      return fetch(url).then(function (r) {
        if (!r.ok) throw new Error("kw http " + r.status);
        return r.arrayBuffer();
      }).then(function (buf) {
        return URL.createObjectURL(new Blob([buf], { type: "text/javascript" }));
      });
    };
    window.kwEvalScript = function (url) {
      return kwLoadJs(url).then(function (objUrl) {
        return new Promise(function (res, rej) {
          var s = document.createElement("script");
          s.onload = res;
          s.onerror = function () { rej(new Error("kw exec " + url)); };
          s.src = objUrl;
          document.head.appendChild(s);
        });
      });
    };

    window.UNITY_BUILD = {
      companyName: "Snow Rider 3d",
      productName: "Snow Rider 3d",
      productVersion: "4.3",
      buildUrl: "https://raw.githubusercontent.com/Kyguyog/Knowwhere/main/game-assets/Snow%20Rider%203D%202/html5.gamedistribution.com/longurls/Build",
      loaderUrl: "https://raw.githubusercontent.com/Kyguyog/Knowwhere/main/game-assets/Snow%20Rider%203D%202/html5.gamedistribution.com/longurls/Build/snowrider3d_gd_4_2.loader.js",

    };
  </script>

  <!-- Your working orientation engine (used on MOBILE only) -->
  <script>
const WebglScreenOrientation = {
  Portrait: 0,
  Landscape: 1,
  AutoRotation: 2,
};

function launchFullscreen(element) {
  if (element.requestFullscreen) element.requestFullscreen();
  else if (element.mozRequestFullScreen) element.mozRequestFullScreen();
  else if (element.webkitRequestFullscreen) element.webkitRequestFullscreen();
  else if (element.msRequestFullscreen) element.msRequestFullscreen();
}
function exitFullscreen() {
  if (document.exitFullscreen) document.exitFullscreen();
  else if (document.mozCancelFullScreen) document.mozCancelFullScreen();
  else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
}

function SetOrientation(ScreenOrientation) {
  window.WebglOrientation = ScreenOrientation;
  RotScreen();
}
function GetOrientation() {
  return window.WebglOrientation;
}
function SetFullScreen(isFull) {
  try {
    if (isFull) launchFullscreen(window.document.body);
    else document.webkitCancelFullScreen();
  } catch (e) {}
}
function GetFullScreen() {
  return document.fullscreenElement == window.document.body;
}
function RotScreen() {
  if (window.WebglOrientation == WebglScreenOrientation.AutoRotation) {
    window.gameframe.style.transform = "";
    window.gameframe.style.transformOrigin = "";
    window.gameframe.style.height = '100dvh';
    window.gameframe.style.width = '100dvw';
    return;
  }
  var orientation = window.orientation;
  if (orientation == 180 || orientation == 0 || orientation == -180 || orientation == 360) {
    if (window.WebglOrientation == WebglScreenOrientation.Landscape) {
      window.gameframe.style.transformOrigin = "top left";
      window.gameframe.style.transform = "rotate(90deg) translateY(-100vw)";
      window.gameframe.style.height = '100dvw';
      window.gameframe.style.width = '100dvh';
    } else {
      window.gameframe.style.transform = "";
      window.gameframe.style.transformOrigin = "";
      window.gameframe.style.height = '100dvh';
      window.gameframe.style.width = '100vw';
    }
  } else {
    if (window.WebglOrientation == WebglScreenOrientation.Portrait) {
      window.gameframe.style.transformOrigin = "top right";
      window.gameframe.style.transform = "rotate(-90deg) translateY(-100vh)";
      window.gameframe.style.height = '100dvw';
      window.gameframe.style.width = '100dvh';
    } else {
      window.gameframe.style.height = '100dvh';
      window.gameframe.style.width = '100dvw';
      window.gameframe.style.transform = "";
      window.gameframe.style.transformOrigin = "";
    }
  }
}
  </script>

  <style>
    html, body { margin:0; height:100%; overflow:hidden; background:#000; }
    /* Containers: only one is visible at a time */
    #mobile-wrap, #desktop-wrap { position:fixed; inset:0; }
    #mobile-wrap { display:none; }   /* shown on mobile */
    #desktop-wrap { display:none; }  /* shown on desktop */

    /* Desktop canvas container uses same IDs/classes as your game.html */
    #unity-container { position: fixed; inset: 0; }
    #unity-canvas { display:block; outline:none; background:#000; }

    /* (Optional) harden overlay z-index to stay above canvas during load */
    #unity-loading-bar { z-index: 9999; }
  </style>
</head>
<body>
  <!-- MOBILE MODE (uses your exact iframe + RotScreen flow) -->
  <div id="mobile-wrap">
    <iframe id="Frame"
            src="about:blank"
            allow="autoplay; fullscreen; gamepad; xr-spatial-tracking"
            style="border:0; position:fixed; inset:0; width:100%; height:100%;"></iframe>
  </div>

  <!-- DESKTOP MODE (runs Unity directly on this page, no iframe) -->
  <div id="desktop-wrap">
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" width="960" height="600" tabindex="1"></canvas>

      <div id="unity-loading-bar">
        <div id="unity-logo">
          <div id="unity-text-progress"></div>
        </div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>

      <div id="unity-warning"></div>
    </div>
  </div>

  <script>
    // ---------- Device detection ----------
    const isMobileUA = /iPhone|iPad|iPod|Android|IEMobile|Windows Phone|BlackBerry|Opera Mini/i.test(navigator.userAgent);
    const prefersMobileLayout = isMobileUA || (('ontouchstart' in window) && Math.max(window.innerWidth, window.innerHeight) <= 1024);

    const mobileWrap  = document.getElementById('mobile-wrap');
    const desktopWrap = document.getElementById('desktop-wrap');

    if (prefersMobileLayout) {
      // ===== MOBILE: show iframe and rotate the container with your RotScreen() =====
      mobileWrap.style.display = 'block';
      const iframe = document.getElementById('Frame');
      iframe.src = 'game.html';

      // Hook your rotation helper exactly like your working page
      window.gameframe = iframe;                           // rotate this element (not the canvas)
      window.WebglOrientation = WebglScreenOrientation.AutoRotation;
      try { RotScreen(); } catch(e) { console.warn(e); }

      // Keep in sync with viewport changes
      function updateVH() {
        let vh = window.innerHeight * 0.01;
        document.documentElement.style.setProperty('--vh', vh + 'px');
      }
      updateVH();
      window.addEventListener('resize', function(){ updateVH(); try{ RotScreen(); }catch(_){ } }, false);
      window.addEventListener('orientationchange', function(){ try{ RotScreen(); }catch(_){ } }, false);

      // Optional: Load orientation config (same as your index.html)
      try {
        var xhr = new XMLHttpRequest();
        xhr.onreadystatechange = function () {
          if (xhr.readyState === 4 && xhr.status === 200) {
            var data = JSON.parse(xhr.responseText);
            window.WebglOrientation = data.ScreenOrientation;
            try { RotScreen(); } catch(_){}
          }
        };
        xhr.open("GET", "StreamingAssets/webglscreenSetting/ScreenConfig.json", true);
        xhr.send();
      } catch(e){}
    } else {
      // ===== DESKTOP: run Unity directly on this page (no iframe) =====
      desktopWrap.style.display = 'block';

      // Pull UB from this page (no parent iframe)
      var UB = window.UNITY_BUILD;
      if (!UB) { alert("UNITY_BUILD not found"); }

      var container = document.querySelector("#unity-container");
      var canvas = document.querySelector("#unity-canvas");
      var textProgress = document.querySelector("#unity-text-progress");
      var loadingBar = document.querySelector("#unity-loading-bar");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");
      var progressBarEmpty = document.querySelector("#unity-progress-bar-empty");
      var warningBanner = document.querySelector("#unity-warning");

      function unityShowBanner(msg, type) {
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type === 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type === 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function () {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      if (UB && UB.productName) document.title = UB.productName;

      // Desktop sizing (full window)
      canvas.style.width = window.innerWidth + 'px';
      canvas.style.height = window.innerHeight + 'px';
      window.addEventListener('resize', function(){
        // minor debounce so Unity doesn't thrash
        setTimeout(function(){
          canvas.style.width = window.innerWidth + 'px';
          canvas.style.height = window.innerHeight + 'px';
        }, 250);
      }, false);

      // Build config from UB (only include optional fields if present to avoid #if macros)
      var config = {
        dataUrl: UB.dataUrl,
        frameworkUrl: UB.frameworkUrl,
        streamingAssetsUrl: "StreamingAssets",
        companyName: UB.companyName,
        productName: UB.productName,
        productVersion: UB.productVersion,
        showBanner: unityShowBanner
      };
      if (UB.codeUrl)    config.codeUrl = UB.codeUrl;
      if (UB.memoryUrl)  config.memoryUrl = UB.memoryUrl;
      if (UB.symbolsUrl) config.symbolsUrl = UB.symbolsUrl;

      loadingBar.style.display = "block";
      var showLoadingBar = false;
      if (!showLoadingBar) progressBarEmpty.style.display = "none";

      const rootPath = 'https://raw.githubusercontent.com/Kyguyog/Knowwhere/main/game-assets/Snow%20Rider%203D%202/html5.gamedistribution.com/longurls/TemplateData';
      kwEvalScript(UB.loaderUrl).then(() => {
        createUnityInstance(canvas, config, (progress) => {
        if (progress >= 0.9 && progress < 1) {
            textProgress.innerHTML =
              'Opening ' + UB.productName +
              '<img src="' + rootPath + '/gears.gif" class="spinner" width="90" height="90" />';
            progressBarEmpty.style.display = "none";
          } else {
            textProgress.innerHTML =
              'Loading ' + UB.productName + ' - ' + Math.floor(progress * 100)  + '%' +
              '<img src="' + rootPath + '/gears.gif" class="spinner" width="90" height="90" />';
          }
          if (showLoadingBar) {
            progressBarFull.style.width = (progress * 100) + "%";
          }
        }).then((unityInstance) => {
          loadingBar.style.display = "none";
            // call is harmless on desktop (helper early-returns)
              if (window.__hookMobileAudio) { window.__hookMobileAudio(unityInstance); }
        }).catch((message) => {
          alert(message);
        });
      }).catch((message) => {
          alert(message);
      });
    }
  </script>
   <!-- Mobile-only keep-awake (inline, no external file) -->
<script>
(function(){
  var isMobile = /Android|iPhone|iPad|iPod|IEMobile|Windows Phone|BlackBerry|Opera Mini/i.test(navigator.userAgent);
  if (!isMobile) return;

  (function(global){
    var sentinel = null;
    var active = false;

    async function requestWakeLock(){
      if ('wakeLock' in navigator && navigator.wakeLock && typeof navigator.wakeLock.request === 'function'){
        try{
          sentinel = await navigator.wakeLock.request('screen');
          active = true;
          if (sentinel && typeof sentinel.addEventListener === 'function'){
            sentinel.addEventListener('release', function(){
              if (document.visibilityState === 'visible'){
                requestWakeLock().catch(function(){});
              }
            });
          }
          return true;
        }catch(e){}
      }
      return false;
    }

    function onGesture(){
      document.removeEventListener('pointerdown', onGesture, true);
      document.removeEventListener('touchend', onGesture, true);
      requestWakeLock().catch(function(){});
    }

    document.addEventListener('pointerdown', onGesture, true);
    document.addEventListener('touchend', onGesture, true);

    document.addEventListener('visibilitychange', function(){
      if (document.visibilityState === 'visible' && active && sentinel == null){
        requestWakeLock().catch(function(){});
      }
    }, false);
  })(window);
})();
</script>
