<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <title class="cloak">Drive Mad | MacVG</title>
    <span id="macvgmacvg" name="game75"></span>
    <link class="favicon" rel="shortcut icon" href="https://raw.githubusercontent.com/Kyguyog/Knowwhere/main/game-assets/Drive%20Mad/webapp/cover.jpg" />
    <script>
      window.G = "https://raw.githubusercontent.com/Kyguyog/Knowwhere/main/game-assets/Drive%20Mad/";
      window.kwLoadJs = function (url) {
        return fetch(url).then(function (r) {
          if (!r.ok) throw new Error("kw http " + r.status);
          return r.arrayBuffer();
        }).then(function (b) {
          return URL.createObjectURL(new Blob([b], { type: "text/javascript" }));
        });
      };
      window.kwEvalScript = function (url) {
        return kwLoadJs(url).then(function (obj) {
          return new Promise(function (res, rej) {
            var s = document.createElement("script");
            s.onload = res;
            s.onerror = function () { rej(new Error("kw exec " + url)); };
            s.src = obj;
            document.head.appendChild(s);
          });
        });
      };
      fetch(window.G + "webapp/fancade.css").then(function (r) { return r.text(); }).then(function (t) {
        var dir = window.G + "webapp/";
        t = t.replace(/url\(\s*(['"]?)([^'")]+)\1\s*\)/g, function (m, q, p) {
          if (/^(?:https?:|data:|blob:|#|\/\/)/.test(p)) return m;
          return "url('" + dir + p + "')";
        });
        var s = document.createElement("style"); s.textContent = t; document.head.appendChild(s);
      }).catch(function (e) { console.error("kw css", e); });
      window.kwEvalScript(window.G + "Jump_Gamemonetize.js");
    </script>
    <meta name="description" content="" />
    <meta name="google" content="notranslate" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  </head>
  <body id="body">
    <div id="modal_parent">
      <div id="modal_content">
        <span id="modal_close_button">&times;</span>
        <div id="store_link_modal_content" class="modal_inner"></div>
        <div id="share_file_modal_content" class="modal_inner"></div>
      </div>
    </div>
    <div id="canvas_border" class="emscripten_border">
      <div id="play_content" class="middle center">
        <div class="edge">
          <div class="box">
            <div class="black">
              <img src="https://raw.githubusercontent.com/Kyguyog/Knowwhere/main/game-assets/Drive%20Mad/webapp/cover.jpg" class="cover" />
              <p class="title">Drive Mad</p>
              <p class="author">Martin Magni</p>
            </div>
          </div>
        </div>
        <div id="progress_or_play"><progress id="progress" class="loading" value="0" max="100"></progress></div>
        <p class="description"></p>
      </div>
      <canvas class="emscripten" id="canvas" tabindex="-1"></canvas>
      <div id="gradient"></div>
      <div id="webview_content"></div>
    </div>
    <script>
        var Module = Module || {};
        Module.locateFile = function (path, scriptDirectory) {
            return "https://raw.githubusercontent.com/Kyguyog/Knowwhere/main/game-assets/Drive%20Mad/webapp/" + path;
        };
        window.kwEvalScript(window.G + "webapp/source_min.js").then(function () {
            return window.kwEvalScript(window.G + "webapp/index.js");
        }).catch(function (e) {
            console.error("kw", e);
        });
    </script>
</body>
</html>
