<!DOCTYPE html>
<html>

<head>
  
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0" />
  <style>
    html,
    body {
      position: absolute;
      top: 0px;
      left: 0px;
      margin: 0;
      padding: 0;
      border: 0;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }

    canvas {
      width: 100%;
    }
  #sidebarad1,
#sidebarad2 {
  position: fixed;
  top: 50%;
  transform: translateY(-50%);
  width: 160px;
  height: 600px;
  padding: 0;
  margin: 0;
  z-index: 999999;
}
#sidebarad1 {
  left: 0;
}
#sidebarad2 {
  right: 0;
}
.sidebar-close {
  position: absolute;
  top: 0;
  right: 0;
  width: 22px;
  height: 22px;
  line-height: 22px;
  text-align: center;
  background: rgba(0,0,0,0.7);
  color: #fff;
  font-size: 14px;
  cursor: pointer;
  user-select: none;
  z-index: 10;
}
.sidebar-frame {
  width: 160px;
  height: 600px;
  border: none;
  display: block;
}
</style>
  <script>
/* ================= GITHUB ASSET CONFIG ================= */
var GITHUB_BASE = "https://raw.githubusercontent.com/Kyguyog/Knowwhere/main/game-assets/Stickman%20Hook/code/";

function loadCode(name) {
  return fetch(GITHUB_BASE + name).then(function (r) {
    if (!r.ok) throw new Error("Missing code: " + name + " (HTTP " + r.status + ")");
    return r.text();
  });
}

function injectScript(code) {
  var blob = new Blob([code], { type: "application/javascript" });
  var src = URL.createObjectURL(blob);
  return new Promise(function (resolve, reject) {
    var s = document.createElement("script");
    s.src = src;
    s.async = false;
    s.onload = function () { setTimeout(resolve, 0); };
    s.onerror = function () { reject(new Error("Could not execute script")); };
    document.body.appendChild(s);
  });
}

/* ================= POKI SDK STUB =================
   The real PokiSDK.init() waits for a message from the Poki platform
   (a parent frame) and never resolves when the game is self-hosted, which
   stalls the game's boot before it ever creates its canvas. Provide a
   local no-op SDK so the game runs (and drop Poki's ad/tracking calls). */
function installPokiStub() {
  var noop = function () {};
  window.PokiSDK = {
    init: function () { return Promise.resolve(); },
    initWithVideoHB: function () { return Promise.resolve(); },
    commercialBreak: function () { return Promise.resolve(); },
    rewardedBreak: function () { return Promise.resolve(true); },
    getLeaderboard: function () { return Promise.resolve({}); },
    sendHighscore: function () { return Promise.resolve(); },
    setDebug: noop,
    customEvent: noop,
    displayAd: noop,
    destroyAd: noop,
    disableProgrammatic: noop,
    gameLoadingStart: noop,
    gameLoadingFinished: noop,
    gameInteractive: noop,
    roundStart: noop,
    roundEnd: noop,
    muteAd: noop,
    gameplayStart: noop,
    gameplayStop: noop,
    gameLoadingProgress: noop,
    happyTime: noop,
    setPlayerAge: noop,
    togglePlayerAdvertisingConsent: noop,
    toggleNonPersonalized: noop,
    setConsentString: noop,
    logError: noop,
    setDebugTouchOverlayController: noop
  };
}

function boot() {
  installPokiStub();
  loadCode("bundle.js")
    .then(injectScript)
    .catch(function (err) { console.error("[Stickman Hook]", err); });
}
if (document.readyState === "loading") {
  document.addEventListener("DOMContentLoaded", boot);
} else {
  boot();
}
</script>
</head>

<body>
  <div id="game"></div>
<div id="sidebarad1">
  <div class="sidebar-close" onclick="this.parentElement.style.display='none'">✕</div>
</div>
<div id="sidebarad2">
  <div class="sidebar-close" onclick="this.parentElement.style.display='none'">✕</div>
</div>
</body>
</html>
