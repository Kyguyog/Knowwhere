<!DOCTYPE html>
<html lang="en">
<head>
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta http-equiv="pragma" content="no-cache" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta charset="utf-8" />

    <title>Retro Bowl</title>

    <base href="https://raw.githubusercontent.com/Kyguyog/Knowwhere/main/game-assets/retrobowl/oldbowl/" />

    <style>
        body {
            background: #0;
            color: #cccccc;
            margin: 0px;
            padding: 0px;
            border: 0px;
        }

        canvas {
            image-rendering: optimizeSpeed;
            -webkit-interpolation-mode: nearest-neighbor;
            -ms-touch-action: none;
            margin: 0px;
            padding: 0px;
            border: 0px;
        }

        :-webkit-full-screen #canvas {
            width: 100%;
            height: 100%;
        }

        div.gm4html5_div_class {
            margin: 0px;
            padding: 0px;
            border: 0px;
        }
        /* START - Login Dialog Box */
        div.gm4html5_login {
            padding: 20px;
            position: absolute;
            border: solid 2px #000000;
            background-color: #404040;
            color: #00ff00;
            border-radius: 15px;
            box-shadow: #101010 20px 20px 40px;
        }

        div.gm4html5_cancel_button {
            float: right;
        }

        div.gm4html5_login_button {
            float: left;
        }

        div.gm4html5_login_header {
            text-align: center;
        }
        /* END - Login Dialog Box */
        :-webkit-full-screen {
            width: 100%;
            height: 100%;
        }
    </style>
</head>

    <body>
        <div class="gm4html5_div_class" id="gm4html5_div_id">
        <img src="html5game/splash.png" id="GM4HTML5_loadingscreen" alt="GameMaker:HTML5 loading screen" style="display:none;"/>
            <canvas id="canvas" width="853" height="480">
                     <p>Your browser doesn't support HTML5 canvas.</p>
            </canvas>
        </div>

        <script>
            // Everything is streamed from the repo's game-assets folder. GitHub
            // raw serves .js as text/plain, so GameMaker's runtime (RetroBowl.js)
            // is fetched as text and run from a same-origin blob: URL, after
            // which it resolves its textures/sounds against <base>. The Poki
            // hostname redirect baked into the original page is removed -- the
            // game just boots locally.
            window.KW_GITHUB_BASE = "https://raw.githubusercontent.com/Kyguyog/Knowwhere/main/game-assets/retrobowl/oldbowl/";
            window.PokiSDK = null;
            window.PokiSDK_loadState = 0;
            window.PokiSDK_OK = function () {};

            (function () {
                fetch(window.KW_GITHUB_BASE + "html5game/RetroBowl.js")
                    .then(function (r) {
                        if (!r.ok) throw new Error("HTTP " + r.status + " for RetroBowl.js");
                        return r.text();
                    })
                    .then(function (text) {
                        var url = URL.createObjectURL(new Blob([text], { type: "application/javascript" }));
                        return new Promise(function (resolve, reject) {
                            var s = document.createElement("script");
                            s.src = url;
                            s.async = false;
                            s.onload = function () { URL.revokeObjectURL(url); resolve(); };
                            s.onerror = function () { reject(new Error("RetroBowl.js failed to execute")); };
                            document.body.appendChild(s);
                        });
                    })
                    .then(function () {
                        if (document.readyState === "complete") {
                            window.GameMaker_Init();
                        } else {
                            window.addEventListener("load", function () {
                                window.GameMaker_Init();
                            });
                        }
                    })
                    .catch(function (err) { console.error("[retrobowl]", err); });
            })();
        </script>
    </body>
</html>
