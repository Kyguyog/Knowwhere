<!doctype HTML>
<html lang="en">
<head>
  <base href="https://raw.githubusercontent.com/Kyguyog/Knowwhere/main/Games/Bouncemasters/">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bouncemasters</title>

  <script>
    (function () {
      var GITHUB_BASE = "https://raw.githubusercontent.com/Kyguyog/Knowwhere/main/Games/Bouncemasters/";

      var loadingText = document.createElement('div');
      loadingText.id = 'kw-loading-text';
      loadingText.style.cssText = 'position:fixed;top:20px;left:50%;transform:translateX(-50%);color:#fff;background:rgba(0,0,0,.7);padding:8px 14px;border-radius:6px;font-family:Arial;font-size:14px;z-index:2147483647;';
      loadingText.textContent = 'LOADING...';
      (document.body || document.documentElement).appendChild(loadingText);

      function log(msg) {
        loadingText.textContent = msg;
      }

      function loadText(name) {
        return fetch(GITHUB_BASE + name).then(function (r) {
          if (!r.ok) throw new Error('Missing: ' + name + ' (HTTP ' + r.status + ')');
          return r.text();
        });
      }

      function blobURL(text, type) {
        return URL.createObjectURL(new Blob([text], { type: type }));
      }

      function absoluteURL(rel) {
        return new URL(rel, GITHUB_BASE).href;
      }

      /* Rewrite relative url() references so they survive blob loading. */
      function rewriteCss(name, text) {
        var dir = name.split("/").slice(0, -1).join("/");
        var base = new URL(dir ? dir + "/" : "./", GITHUB_BASE).href;
        return text.replace(/url\(\s*(['"]?)([^'")]+)\1\s*\)/g, function (m, q, p) {
          if (/^(?:https?:|data:|blob:|#|\/\/)/i.test(p)) return m;
          return "url('" + new URL(p, base).href + "')";
        });
      }

      var SCRIPT_FILES = ["game.js", "274.js"];
      var CSS_FILES = ["style/index.css"];

      var jsBlob = {};
      var cssBlob = {};
      var loadedScripts = {};

      /* Webpack's automatic publicPath reads document.currentScript.src,
         which points at our blob: URL and would break the 274.js chunk load.
         Pin o.p to the directory of the <base> element instead. */
      var PUBLIC_PATH_BLOCK =
        'o.g.importScripts && (t = o.g.location + "");\n' +
        '        var e = o.g.document;\n' +
        '        if (!t && e && (e.currentScript && (t = e.currentScript.src),\n' +
        '        !t)) {\n' +
        '            var r = e.getElementsByTagName("script");\n' +
        '            r.length && (t = r[r.length - 1].src)\n' +
        '        }\n' +
        '        if (!t)\n' +
        '            throw new Error("Automatic publicPath is not supported in this browser");\n' +
        '        t = t.replace(/#.*$/, "").replace(/\\?.*$/, "").replace(/\\/[^\\/]+$/, "/"),\n' +
        '        o.p = t';

      /* The shipped game.js has broken platform storage: its regenerator
         loader awaits a missing expression, so this.data becomes the number
         3 and later setItem calls throw "Cannot create property ... on
         number '3'". Force this.data to stay a plain object so saves work
         and the mobx reaction errors disappear. */
      var STORAGE_PATCH_BLOCK =
        'e = t.sent,\n' +
        '                                    this.data = e ? JSON.parse(e) : {},';
      var STORAGE_PATCH_REPLACEMENT =
        'e = void 0,\n' +
        '                                    this.data = {},';

      function blobCode(text) {
        return new Blob([text], { type: 'text/javascript' });
      }

      function injectScript(blobSrc, absUrl) {
        return new Promise(function (resolve, reject) {
          var s = document.createElement('script');
          s.src = blobSrc;
          s.async = false;
          s.setAttribute('data-kw', '1');
          s.onload = function () {
            if (absUrl) loadedScripts[absUrl] = true;
            resolve();
          };
          s.onerror = function () { reject(new Error('Script failed to execute')); };
          document.head.appendChild(s);
        });
      }

      var headAppend = document.head.appendChild.bind(document.head);
      var bodyPatched = false;

      function patchAppend(fn) {
        return function (node) {
          if (node && node.nodeType === 1) {
            if (node.tagName === 'SCRIPT' && node.src && jsBlob[node.src]) {
              var absUrl = node.src;
              if (loadedScripts[absUrl]) {
                node.src = URL.createObjectURL(new Blob([''], { type: 'text/javascript' }));
              } else {
                node.src = jsBlob[absUrl];
              }
            } else if (node.tagName === 'LINK' && node.rel === 'stylesheet' && node.href && cssBlob[node.href]) {
              node.href = cssBlob[node.href];
            }
          }
          return fn(node);
        };
      }
      document.head.appendChild = patchAppend(headAppend);

      function ensureBodyPatched() {
        if (bodyPatched || !document.body) return;
        document.body.appendChild = patchAppend(document.body.appendChild.bind(document.body));
        bodyPatched = true;
      }

      var preloadJs = SCRIPT_FILES.map(function (name) {
        return loadText(name).then(function (text) {
          var absUrl = absoluteURL(name);
          var code = text;
          if (name === 'game.js') {
            if (text.indexOf(PUBLIC_PATH_BLOCK) !== -1) {
              var baseHref = (document.querySelector("base") || { href: GITHUB_BASE }).href;
              code = text.replace(PUBLIC_PATH_BLOCK,
                'o.p = "' + baseHref.replace(/"/g, '\\"') + '"');
            } else {
              console.warn('[Bouncemasters] publicPath block not found; chunk loading may fail');
            }
            if (text.indexOf(STORAGE_PATCH_BLOCK) !== -1) {
              code = code.replace(STORAGE_PATCH_BLOCK, STORAGE_PATCH_REPLACEMENT);
            } else {
              console.warn('[Bouncemasters] storage patch block not found');
            }
          }
          jsBlob[absUrl] = blobURL(code, 'text/javascript');
        });
      });

      var preloadCss = CSS_FILES.map(function (name) {
        return loadText(name).then(function (text) {
          cssBlob[absoluteURL(name)] = blobURL(rewriteCss(name, text), 'text/css');
        });
      });

      Promise.all(preloadJs.concat(preloadCss))
        .then(function () {
          ensureBodyPatched();
          log('DOWNLOADING ASSETS...');

          var link = document.createElement('link');
          link.rel = 'stylesheet';
          link.href = cssBlob[absoluteURL('style/index.css')];
          document.head.appendChild(link);

          return injectScript(jsBlob[absoluteURL('game.js')], absoluteURL('game.js'));
        })
        .then(function () {
          if (typeof window.runGame === 'function') window.runGame();
          setTimeout(function () { loadingText.remove(); }, 3000);
        })
        .catch(function (err) {
          console.error('[Bouncemasters]', err);
          loadingText.textContent = 'ERROR: ' + err.message;
        });
    })();
  </script>
</head>

<body>
  <div id="game"></div>
</body>
</html>
