<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Time Shooter</title>
    <style>
html {
    box-sizing: border-box;
}
*, *:before, *:after {
    box-sizing: inherit;
}
html, body {
    height: 100%;
}
canvas {
    display: block;
}
body {
    margin: 0;
}
#unity-container {
    width: 100%;
    height: 100%;
}
#unity-canvas {
    width: 100%;
    height: 100%;
    background: #FFFFFF;
}
#loading-cover {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
}
#unity-loading-bar {
    flex: 1 1 auto;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
}
#unity-logo {
    text-align: center;
}
#unity-logo img {
    max-width: 80%;
}
#unity-progress-bar-empty {
    width: 80%;
    height: 24px;
    margin: 10px 20px 20px 10px;
    text-align: left;
    border: 1px solid white;
    padding: 2px;
}
#unity-progress-bar-full {
    width: 0%;
    height: 100%;
    background: white;
}
.light #unity-progress-bar-empty {
    border-color: black;
}
.light #unity-progress-bar-full {
    background: black;
}

#unity-fullscreen-button {
    position: absolute;
    right: 10px;
    bottom: 10px;
    width: 38px;
    height: 38px;
    background: #111;
    background-size: contain;
}

.spinner,
.spinner:after {
  border-radius: 50%;
  width: 5em;
  height: 5em;
}
.spinner {
  margin: 10px;
  font-size: 10px;
  position: relative;
  text-indent: -9999em;
  border-top: 1.1em solid rgba(255, 255, 255, 0.2);
  border-right: 1.1em solid rgba(255, 255, 255, 0.2);
  border-bottom: 1.1em solid rgba(255, 255, 255, 0.2);
  border-left: 1.1em solid #ffffff;
  transform: translateZ(0);
  animation: spinner-spin 1.1s infinite linear;
}
@keyframes spinner-spin {
  0% {
    transform: rotate(0deg);
  }
  100% {
    transform: rotate(360deg);
  }
}


    </style>
    <script>
(function () {
  var gd = /(^|\/\/)([a-z0-9.-]*\.)?gamedistribution\.com\//i;
  function isGdScript(n) {
    return !!n && n.tagName && String(n.tagName).toLowerCase() === "script" && gd.test(n.src || "");
  }
  function neutralize(n) {
    try {
      n.removeAttribute("src");
      n.type = "javascript/blocked";
    } catch (e) {}
  }
  var appendChild = Node.prototype.appendChild;
  Node.prototype.appendChild = function (n) {
    if (isGdScript(n)) {
      neutralize(n);
      return n;
    }
    return appendChild.call(this, n);
  };
  var insertBefore = Node.prototype.insertBefore;
  Node.prototype.insertBefore = function (n, ref) {
    if (isGdScript(n)) {
      neutralize(n);
      return n;
    }
    return insertBefore.call(this, n, ref);
  };
})();
    </script>
  </head>
  <body class="dark">
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas"></canvas>
    </div>
    <div id="loading-cover" style="display:none;">
      <div id="unity-loading-bar">
        <div id="unity-logo"><img id="unity-logo-image" alt="Time Shooter logo"></div>
        <div id="unity-progress-bar-empty" style="display: none;">
          <div id="unity-progress-bar-full"></div>
        </div>
        <div class="spinner"></div>
      </div>
    </div>
    <div id="unity-fullscreen-button" style="display: none;"></div>
    <script>
      const hideFullScreenButton = "1";
      const ts1Base = "https://raw.githubusercontent.com/Kyguyog/Knowwhere/main/Games/Time%20Shooter%201-3/assets/ts1";

      const config = {
        dataUrl: ts1Base + "/data.bin.unityweb",
        frameworkUrl: ts1Base + "/framework.js.unityweb",
        codeUrl: ts1Base + "/code.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "GoGoMan",
        productName: "Time Shooter",
        productVersion: "1.0",
      };

      const container = document.querySelector("#unity-container");
      const canvas = document.querySelector("#unity-canvas");
      const loadingCover = document.querySelector("#loading-cover");
      const progressBarEmpty = document.querySelector("#unity-progress-bar-empty");
      const progressBarFull = document.querySelector("#unity-progress-bar-full");
      const fullscreenButton = document.querySelector("#unity-fullscreen-button");
      const spinner = document.querySelector('.spinner');
      const logoImage = document.querySelector('#unity-logo-image');

    window.kwLoadJs = function (url) {
      return fetch(url).then(function (r) {
        if (!r.ok) throw new Error("kw http " + r.status);
        return r.arrayBuffer();
      }).then(function (buf) {
        return URL.createObjectURL(new Blob([buf], { type: "text/javascript" }));
      });
    };
    window.kwEvalScript = function (url) {
      return kwLoadJs(url).then(function (objUrl) {
        return new Promise(function (res, rej) {
          var s = document.createElement("script");
          s.onload = res;
          s.onerror = function () { rej(new Error("kw exec " + url)); };
          s.src = objUrl;
          document.head.appendChild(s);
        });
      });
    };

      const canFullscreen = (function() {
        for (const key of [
            'exitFullscreen',
            'webkitExitFullscreen',
            'webkitCancelFullScreen',
            'mozCancelFullScreen',
            'msExitFullscreen',
          ]) {
          if (key in document) {
            return true;
          }
        }
        return false;
      }());

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        container.className = "unity-mobile";
        config.devicePixelRatio = 1;
      }

      const favicon = document.createElement("link");
      favicon.rel = "icon";
      favicon.href = ts1Base + "/favicon.ico";
      document.head.appendChild(favicon);

      logoImage.src = ts1Base + "/logo.png";
      canvas.style.background = "url('" + ts1Base + "/background.jpg') center / cover";
      loadingCover.style.display = "";

      const loaderUrl = "https://raw.githubusercontent.com/Kyguyog/Knowwhere/main/Games/Time%20Shooter%201-3/assets/ts1/loader.js";
      kwEvalScript(loaderUrl).then(() => {
        createUnityInstance(canvas, config, (progress) => {
          spinner.style.display = "none";
          progressBarEmpty.style.display = "";
          progressBarFull.style.width = `${100 * progress}%`;
        }).then((unityInstance) => {
          loadingCover.style.display = "none";
          if (canFullscreen) {
            if (!hideFullScreenButton) {
              fullscreenButton.style.display = "";
            }
            fullscreenButton.onclick = () => {
              unityInstance.SetFullscreen(1);
            };
          }
        }).catch((message) => {
          alert(message);
        });
      });

      startUnity();
</script>
  </body>
</html>
