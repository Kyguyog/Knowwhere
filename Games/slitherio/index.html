<script>
(function(){
  var obs = new MutationObserver(function(m){
    m.forEach(function(mu){
      if(mu.addedNodes){
        for(var i=0;i<mu.addedNodes.length;i++){
          var n = mu.addedNodes[i];
          if(n.tagName === 'IFRAME'){
            try{
              var s = n.src||'';
              if(s.indexOf('raw.githubusercontent.com')>=0){ n.remove(); continue; }
            }catch(e){}
          }
          if(n.querySelectorAll){
            var fs = n.querySelectorAll('iframe');
            for(var j=0;j<fs.length;j++){
              try{
                var ss = fs[j].src||'';
                if(ss.indexOf('raw.githubusercontent.com')>=0) fs[j].remove();
              }catch(e){}
            }
          }
        }
      }
    });
  });
  try{ obs.observe(document.documentElement,{childList:true,subtree:true}); }catch(e){}
})();
</script>

<script>
// inline slither emulator
/* slither.io offline bot-only lobby emulator (in-page fake server).
 *
 * The scraped client (game1107249518.js) is client-only: it fetches a server
 * list and talks to a remote server over WebSocket using slither.io's binary
 * protocol. This script replaces window.WebSocket and the server-list XHR with
 * an in-page implementation that speaks the same protocol and simulates a
 * local lobby: the player snake (input handled by the client) plus AI bots and
 * food. No network traffic leaves the page.
 */
(function () {
  "use strict";

  var VER = "1.0";
  var PROTO = 17;              // protocol_version advertised in the "a" init packet
  var GRD = 16000;             // world edge length
  var SECTOR = 1600;           // sector size
  var DEFAULT_MSL = 34;        // default max segment length-ish

  // ---------------- byte writer ----------------
  function W() { this.a = []; }
  W.prototype.u8 = function (v) { this.a.push(v & 255); return this; };
  W.prototype.i16 = function (v) { this.a.push((v >> 8) & 255, v & 255); return this; };
  W.prototype.i24 = function (v) { this.a.push((v >> 16) & 255, (v >> 8) & 255, v & 255); return this; };
  W.prototype.str = function (s) { for (var i = 0; i < s.length; i++) this.a.push(s.charCodeAt(i) & 255); return this; };
  W.prototype.bytes = function (b) { for (var i = 0; i < b.length; i++) this.a.push(b[i] & 255); return this; };
  W.prototype.out = function () { return new Uint8Array(this.a); };

  var PI2 = Math.PI * 2;

  // ---------------- world + bots ----------------
  var NAMES = ["Noodle", "Slinky", "Wiggles", "Cobra", "Viper", "Python", "Boop", "Zigzag",
    "Squirm", "Fang", "Mamba", "Krait", "Rattler", "Slyther", "Twister", "Curly", "Nibbler"];
  function rname() { return NAMES[(Math.random() * NAMES.length) | 0] + (Math.random() < 0.5 ? "" : " " + (1 + (Math.random() * 8 | 0))); }

  function Bot() {
    this.id = Bot.nextId++;
    this.xx = 600 + Math.random() * (GRD - 1200);
    this.yy = 600 + Math.random() * (GRD - 1200);
    this.ang = Math.random() * PI2;
    this.sp = 4.4 + Math.random() * 2.2;
    this.cv = (Math.random() * 40) | 0;
    this.sct = 10 + ((Math.random() * 40) | 0);
    this.nk = rname();
    this.turn = (Math.random() < 0.5 ? -1 : 1) * (0.008 + Math.random() * 0.03);
    this.t = 0; this.tt = 30 + ((Math.random() * 150) | 0);
  }
  Bot.nextId = 2;
  Bot.prototype.step = function (dt) {
    this.t++;
    if (this.t > this.tt) { this.t = 0; this.tt = 30 + ((Math.random() * 180) | 0); this.turn = (Math.random() < 0.5 ? -1 : 1) * (0.006 + Math.random() * 0.035); }
    this.ang += this.turn * dt * 60;
    var d = this.sp * dt * 3;
    this.xx += Math.cos(this.ang) * d;
    this.yy += Math.sin(this.ang) * d;
    if (this.xx < 100) { this.xx = 100; this.ang = Math.PI - this.ang; }
    if (this.xx > GRD - 100) { this.xx = GRD - 100; this.ang = Math.PI - this.ang; }
    if (this.yy < 100) { this.yy = 100; this.ang = -this.ang; }
    if (this.yy > GRD - 100) { this.yy = GRD - 100; this.ang = -this.ang; }
  };

  // ---------------- packet builders ----------------
  function pktInit(realSid) {
    var w = new W();
    w.u8(97);                          // 'a'
    w.i24(GRD);
    w.i16(300);                        // mscps
    w.i16(SECTOR);
    w.i16(Math.ceil(GRD / SECTOR));
    w.u8(30);                          // spangdv/10 = 3.0
    w.i16(537);                        // nsp1 = 5.37
    w.i16(40);                         // nsp2 = 0.40
    w.i16(60);                         // nsp3
    w.i16(9);                          // mamu
    w.i16(9);                          // mamu2
    w.i16(10);                         // cst
    w.u8(PROTO);                       // protocol_version
    w.u8(DEFAULT_MSL);                 // default_msl
    w.i16(realSid);                    // real_sid
    w.i24(Math.floor(GRD * 0.98));     // flux_grd
    w.u8(1);                           // game_mode (normal)
    w.u8(0);
    return w.out();
  }

  // 's' snake packet. Must have dlen > 6 to hit the full form.
  function pktSnake(id, xx, yy, cv, nk, ang, sp, sct) {
    var w = new W();
    w.u8(115); // 's'
    w.i16(id);
    var a24 = ((Math.floor(ang / PI2 * 16777215) % 16777216) + 16777216) % 16777216;
    w.i24(a24);                        // ang
    w.u8(48);                          // dir '0'
    w.i24(a24);                        // wang
    w.i16(Math.floor(sp * 1000));      // speed
    w.i24(300);                        // fam
    w.u8(cv & 255);                    // cv
    var n = Math.max(2, Math.min(80, Math.floor(sct)));
    w.i24(Math.floor(xx * 5));         // snx
    w.i24(Math.floor(yy * 5));         // sny
    w.u8(nk.length); w.str(nk);
    w.u8(0);                           // custom skin length (proto>=11)
    w.u8(255);                         // cosmetic (proto>=12)
    // points
    var px = xx, py = yy;
    for (var i = 0; i < n; i++) {
      if (i === 0) { w.i24(Math.floor(px * 5)); w.i24(Math.floor(py * 5)); }
      else {
        var nx = px - Math.cos(ang) * DEFAULT_MSL;
        var ny = py - Math.sin(ang) * DEFAULT_MSL;
        if (i === n - 1 && PROTO >= 15) {
          // final point uses 2-byte iang encoding
          var iang = ((Math.floor(ang / PI2 * 65536) % 65536) + 65536) % 65536;
          w.i16(iang);
        } else {
          w.u8(clamp(Math.round((nx - px) / 2) + 127));
          w.u8(clamp(Math.round((ny - py) / 2) + 127));
        }
        px = nx; py = ny;
      }
    }
    return w.out();
  }
  function clamp(v) { return v < 0 ? 0 : v > 255 ? 255 : v; }

  // movement update: 'e' with id + ang + wang + speed (plen 6 path, proto>=14)
  function pktMove(id, ang, sp) {
    var w = new W();
    w.u8(101); // 'e'
    w.i16(id);
    w.u8((Math.floor(ang / PI2 * 256) + 256) % 256);
    w.u8((Math.floor(ang / PI2 * 256) + 256) % 256);
    w.u8(clamp(Math.floor(sp * 18)));
    return w.out();
  }

  // food burst (protocol>=4 form): 'F' then [cv][x16][y16][rad] per item? No:
  // proto>=14 form is sector based. Use the proto>=4 branch instead since we set
  // PROTO above -- but PROTO=17 selects the >=14 branch. So send >=14 form:
  // 'F' sx sy then per item [cv][rx][ry][rad].

    // group all in one sector-region by writing each item's own sx,sy (the
    // >=14 parser uses the LAST sx,sy as base for following items, and each item
    // is [cv][rx][ry][rad]). To keep it simple, emit one packet per item.
    return null; // handled by pktFoodOne loop

  // itemXxx/itemYyy are absolute world coords.
  function pktFoodOne(xx, yy, rad, cv) {
    var sx = Math.floor(xx / SECTOR);
    var sy = Math.floor(yy / SECTOR);
    var rx = Math.floor((xx - sx * SECTOR) / (SECTOR / 256)) & 255;
    var ry = Math.floor((yy - sy * SECTOR) / (SECTOR / 256)) & 255;

    w.u8(70);                 // 'F'
    w.u8(sx & 255); w.u8(sy & 255);
    w.u8(cv & 255); w.u8(rx); w.u8(ry);
    w.u8(clamp(Math.round(rad * 5)));

    w.u8(70);
    w.u8(sx & 255); w.u8(sy & 255);

      w.u8(it.cv & 255); w.u8(rx); w.u8(ry); w.u8(clamp(Math.round(it.rad * 5)));
