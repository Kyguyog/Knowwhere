
<!DOCTYPE html>
<html lang="en">
<head>
	
	<meta charset="utf-8">
	
	<title>Run 3</title>
	
	<meta id="viewport" name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
	<meta name="apple-mobile-web-app-capable" content="yes">

	<base href="https://raw.githubusercontent.com/Kyguyog/Knowwhere/main/game-assets/run3/">
	
	<script>
		window.addEventListener ("touchmove", function (event) { event.preventDefault (); }, { capture: false, passive: false });
		if (typeof window.devicePixelRatio !='undefined' && window.devicePixelRatio > 2) {
			var meta = document.getElementById ("viewport");
			meta.setAttribute ('content', 'width=device-width, initial-scale=' + (2 / window.devicePixelRatio) + ', user-scalable=no');
		}
	</script>

	<script>
		// Run3.js (the lime/OpenFL loader) and every asset live in the repo's
		// game-assets folder. GitHub raw serves .js as text/plain, so a
		// cross-origin <script src> is refused by Opaque Response Blocking: the
		// loader is fetched as text and run from a same-origin blob: URL, after
		// which lime.embed boots the game and resolves assets against <base>.
		window.KW_GITHUB_BASE = "https://raw.githubusercontent.com/Kyguyog/Knowwhere/main/game-assets/run3/";
		window.kwLoadScript = function (src) {
			return fetch(window.KW_GITHUB_BASE + src).then(function (r) {
				if (!r.ok) throw new Error("HTTP " + r.status + " for " + src);
				return r.text();
			}).then(function (text) {
				var url = URL.createObjectURL(new Blob([text], { type: "application/javascript" }));
				return new Promise(function (resolve, reject) {
					var s = document.createElement("script");
					s.src = url;
					s.async = false;
					s.onload = function () { URL.revokeObjectURL(url); resolve(); };
					s.onerror = function () { reject(new Error("Failed to execute " + src)); };
					document.body.appendChild(s);
				});
			});
		};
	</script>
	
	<style>
		html,body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
		#openfl-content { background: #000000; width: 100%; height: 100%; }
		@font-face {
			font-family: 'Comfortaa Bold';
			src: url('font/COMFORTAA-BOLD.eot?#iefix') format('embedded-opentype'),
			url('font/COMFORTAA-BOLD.woff') format('woff'),
			url('font/COMFORTAA-BOLD.TTF') format('truetype'),
			url('font/COMFORTAA-BOLD.svg#Comfortaa%20Bold') format('svg');
			font-weight: normal;
			font-style: normal;
		}
		@font-face {
			font-family: 'Comfortaa';
			src: url('font/Comfortaa.eot?#iefix') format('embedded-opentype'),
			url('font/Comfortaa.woff') format('woff'),
			url('font/Comfortaa.otf') format('truetype');
			font-weight: normal;
			font-style: normal;
		}
		@font-face {
			font-family: 'Permanent Marker';
			src: url('font/PERMANENTMARKER.eot?#iefix') format('embedded-opentype'),
			url('font/PERMANENTMARKER.woff') format('woff'),
			url('font/PERMANENTMARKER.TTF') format('truetype'),
			url('font/PERMANENTMARKER.svg#Permanent%20Marker') format('svg');
			font-weight: normal;
			font-style: normal;
		}

	</style>
	
</head>
<body>
	
	<noscript>This webpage makes extensive use of JavaScript. Please enable JavaScript in your web browser to view this page.</noscript>
	
	<div id="openfl-content"></div>
	
	<script type="text/javascript">
		kwLoadScript("Run3.js").then(function () {
			lime.embed ("Run3", "openfl-content", 800, 600, { parameters: {} });
		}).catch(function (err) { console.error("[run3]", err); });
	</script>
	
</body>
</html>
