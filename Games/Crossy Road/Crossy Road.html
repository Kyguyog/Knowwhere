<!doctype HTML>
<html lang="en">
<head>
  <base href="https://raw.githubusercontent.com/Kyguyog/Knowwhere/main/Games/Crossy%20Road/assets/">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Crossy Road</title>

  <script>
    (function () {
      var GITHUB_BASE = "https://raw.githubusercontent.com/Kyguyog/Knowwhere/main/Games/Crossy%20Road/assets/";

      var loadingText = document.createElement('div');
      loadingText.id = 'kw-loading-text';
      loadingText.style.cssText = 'position:fixed;top:20px;left:50%;transform:translateX(-50%);color:#fff;background:rgba(0,0,0,.6);padding:8px 14px;border-radius:6px;font-family:Arial;font-size:14px;z-index:2147483647;';
      loadingText.textContent = 'LOADING...';
      (document.body || document.documentElement).appendChild(loadingText);

      function log(msg) {
        loadingText.textContent = msg;
      }

      function loadText(name) {
        return fetch(GITHUB_BASE + name).then(function (r) {
          if (!r.ok) throw new Error('Missing: ' + name + ' (HTTP ' + r.status + ')');
          return r.text();
        });
      }

      function blobURL(text, type) {
        return URL.createObjectURL(new Blob([text], { type: type }));
      }

      function absoluteURL(rel) {
        return new URL(rel, GITHUB_BASE).href;
      }

      /* Rewrite relative url() references so they survive blob loading.
         Relative paths resolve against the directory of the CSS file. */
      function rewriteCss(name, text) {
        var dir = name.split("/").slice(0, -1).join("/");
        var base = new URL(dir ? dir + "/" : "./", GITHUB_BASE).href;
        return text.replace(/url\(\s*(['"]?)([^'")]+)\1\s*\)/g, function (m, q, p) {
          if (/^(?:https?:|data:|blob:|#|\/\/)/i.test(p)) return m;
          return "url('" + new URL(p, base).href + "')";
        });
      }

      var SCRIPT_FILES = [
        "ytgame.js",
        "scripts/three.min.js",
        "scripts/game.min.js",
        "scripts/extra.min.js",
        "scripts/bootstrap.min.js",
        "scripts/asset-loader.min.js",
        "scripts/loading-flow.min.js",
        "scripts/tween.min.js"
      ];
      var CSS_FILES = ["style.css", "fonts/EditUndoBrk.css", "fonts/8bitwonder.css"];

      var jsBlob = {};
      var cssBlob = {};
      var loadedScripts = {};

      function blobCode(text) {
        return new Blob([text], { type: 'text/javascript' });
      }

      function injectScript(blobSrc, absUrl) {
        return new Promise(function (resolve, reject) {
          var s = document.createElement('script');
          s.src = blobSrc;
          s.async = false;
          s.setAttribute('data-kw', '1');
          s.onload = function () {
            if (absUrl) loadedScripts[absUrl] = true;
            resolve();
          };
          s.onerror = function () { reject(new Error('Script failed to execute')); };
          document.head.appendChild(s);
        });
      }

      /* Intercept runtime-created <script> and <link> elements that resolve
         into our GitHub base, and swap them for blob URLs. Enables the
         game's own bootstrap to "reload" game.min.js at runtime without
         re-parsing it into the shared global scope. */
      var headAppend = document.head.appendChild.bind(document.head);
      var bodyPatched = false;

      function patchAppend(fn) {
        return function (node) {
          if (node && node.nodeType === 1) {
            if (node.tagName === 'SCRIPT' && node.src && jsBlob[node.src]) {
              var absUrl = node.src;
              if (loadedScripts[absUrl]) {
                node.src = URL.createObjectURL(new Blob([''], { type: 'text/javascript' }));
              } else {
                node.src = jsBlob[absUrl];
              }
            } else if (node.tagName === 'LINK' && node.rel === 'stylesheet' && node.href && cssBlob[node.href]) {
              node.href = cssBlob[node.href];
            }
          }
          return fn(node);
        };
      }
      document.head.appendChild = patchAppend(headAppend);

      function ensureBodyPatched() {
        if (bodyPatched || !document.body) return;
        document.body.appendChild = patchAppend(document.body.appendChild.bind(document.body));
        bodyPatched = true;
      }

      var preloadJs = SCRIPT_FILES.map(function (name) {
        return loadText(name).then(function (text) {
          var absUrl = absoluteURL(name);
          var code = text;
          if (name === 'ytgame.js') {
            /* The SDK parses its own <script> URL to detect dev/prod bundles.
               Under a blob: URL, origin+pathname becomes invalid, fa() throws
               and the whole SDK aborts before defining window.ytgame.
               Pre-declare loadYTGame so that block is skipped entirely. */
            code = 'window.loadYTGame = window.loadYTGame || function () {};\n' + text;
          }
          jsBlob[absUrl] = blobURL(code, 'text/javascript');
        });
      });
      var preloadCss = CSS_FILES.map(function (name) {
        return loadText(name).then(function (text) {
          cssBlob[absoluteURL(name)] = blobURL(rewriteCss(name, text), 'text/css');
        });
      });

Promise.all(preloadJs.concat(preloadCss))
        .then(function () {
          ensureBodyPatched();
          log('DOWNLOADING ASSETS...');

          var link = document.createElement('link');
          link.rel = 'stylesheet';
          link.href = cssBlob[absoluteURL('style.css')];
          document.head.appendChild(link);

          var init = ["ytgame.js", "scripts/three.min.js", "scripts/game.min.js", "scripts/extra.min.js", "scripts/bootstrap.min.js"];
          return init.reduce(function (p, name) {
            return p.then(function () {
              var absUrl = absoluteURL(name);
              return injectScript(jsBlob[absUrl], absUrl);
            });
          }, Promise.resolve());
        })
        .then(function () {
          setTimeout(function () { loadingText.remove(); }, 3000);
        })
        .catch(function (err) {
          console.error('[Crossy Road]', err);
          loadingText.textContent = 'ERROR: ' + err.message;
        });
    })();
  </script>

  <style>
#sidebarad1,
#sidebarad2 {
  position: fixed;
  top: 50%;
  transform: translateY(-50%);
  width: 160px;
  height: 600px;
  padding: 0;
  margin: 0;
  z-index: 999999;
}
#sidebarad1 {
  left: 0;
}
#sidebarad2 {
  right: 0;
}
.sidebar-close {
  position: absolute;
  top: 0;
  right: 0;
  width: 22px;
  height: 22px;
  line-height: 22px;
  text-align: center;
  background: rgba(0,0,0,0.7);
  color: #fff;
  font-size: 14px;
  cursor: pointer;
  user-select: none;
  z-index: 10;
}
.sidebar-frame {
  width: 160px;
  height: 600px;
  border: none;
  display: block;
}
  </style>
</head>

<body>
  <canvas id="canvas"></canvas>
  <div id="build-number"></div>

<div id="sidebarad1">
  <div class="sidebar-close" onclick="this.parentElement.style.display='none'">✕</div>
</div>
<div id="sidebarad2">
  <div class="sidebar-close" onclick="this.parentElement.style.display='none'">✕</div>
</div>
</body>
</html>
