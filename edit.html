<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Dashboard</title>
  <link rel="icon" href="https://instructure-uploads.s3.amazonaws.com/account_29340000000000001/attachments/112692/Screen%20Shot%202018-08-20%20at%206.22.27%20PM.png" type="image/x-icon">
  <script src="tab-config.js" defer></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
    @font-face{font-family:'Orbitron';font-style:normal;font-weight:400 900;font-display:swap;src:url('https://fonts.gstatic.com/s/orbitron/v35/yMJRMIlzdpvBhQQL_Qq7dy0.woff2') format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;}
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0f;
      --card: #111118;
      --border: #222230;
      --primary: #a855f7;
      --primary-dim: rgba(168,85,247,0.15);
      --secondary: #22d3ee;
      --secondary-dim: rgba(34,211,238,0.15);
      --danger: #ef4444;
      --danger-dim: rgba(239,68,68,0.12);
      --text: #e2e8f0;
      --muted: #64748b;
      --font-display: 'Orbitron', sans-serif;
      --font-body: 'Inter', sans-serif;
    }

    html { scroll-behavior: smooth; }

    body {
      background: #000;
      color: var(--text);
      font-family: var(--font-body);
      min-height: 100vh;
      overflow-x: hidden;
      padding-top: 56px;
    }

    /* ── AUTH WALL ── */
    #auth-wall {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    #auth-wall.hidden { display: none; }
    #main-content { display: none; }
    #main-content.visible { display: block; }

    .auth-box {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 0 60px rgba(168,85,247,0.12);
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .auth-logo {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 1.75rem;
    }
    .auth-logo img { width: 56px; height: 56px; object-fit: contain; filter: drop-shadow(0 0 12px rgba(168,85,247,0.8)); }
    .auth-logo-name {
      font-family: var(--font-display);
      font-size: 1.4rem;
      font-weight: 900;
      letter-spacing: 0.05em;
    }
    .auth-logo-name span { color: var(--primary); }
    .auth-tabs {
      display: flex;
      width: 100%;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid var(--border);
      margin-bottom: 1.75rem;
    }
    .auth-tab {
      flex: 1;
      padding: 0.65rem;
      background: transparent;
      border: none;
      color: var(--muted);
      font-family: var(--font-display);
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
    }
    .auth-tab.active { background: var(--primary-dim); color: var(--primary); border-bottom: 2px solid var(--primary); }
    .auth-form { width: 100%; display: flex; flex-direction: column; gap: 1rem; }
    .auth-field { display: flex; flex-direction: column; gap: 0.4rem; }
    .auth-field label {
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .auth-field input {
      width: 100%;
      background: #0d0d14;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.75rem 1rem;
      color: var(--text);
      font-size: 0.95rem;
      font-family: var(--font-body);
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .auth-field input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(168,85,247,0.15); }
    .auth-submit {
      width: 100%;
      margin-top: 0.5rem;
      padding: 0.85rem;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 6px;
      font-family: var(--font-display);
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(168,85,247,0.35);
      transition: transform 0.15s, box-shadow 0.15s, opacity 0.15s;
    }
    .auth-submit:hover { transform: scale(1.02); box-shadow: 0 0 32px rgba(168,85,247,0.6); }
    .auth-submit:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    .auth-error {
      width: 100%;
      background: var(--danger-dim);
      border: 1px solid rgba(239,68,68,0.3);
      border-radius: 6px;
      padding: 0.65rem 1rem;
      color: var(--danger);
      font-size: 0.85rem;
      display: none;
      margin-top: 0.25rem;
    }
    .auth-error.show { display: block; }
/* ── ADMIN PANEL ── */
    #admin-panel {
      display: none;
      position: fixed;
      top: 56px;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 90;
      background: #000;
      overflow-y: auto;
    }
    #admin-panel.open { display: flex; align-items: flex-start; justify-content: center; }
    .admin-modal {
      background: #000;
      border: none;
      border-radius: 0;
      width: 100%;
      max-width: 100%;
      min-height: calc(100vh - 56px);
      overflow: hidden;
      margin: 0;
    }
    .admin-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.25rem 1.75rem;
      border-bottom: 1px solid var(--border);
      background: rgba(168,85,247,0.05);
    }
    .admin-header-title {
      font-family: var(--font-display);
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--primary);
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }
    .admin-close {
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--muted);
      cursor: pointer;
      padding: 0.4rem 0.75rem;
      font-size: 0.75rem;
      font-family: var(--font-display);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      transition: border-color 0.2s, color 0.2s;
    }
    .admin-close:hover { border-color: var(--danger); color: var(--danger); }
    .admin-tabs {
      display: flex;
      border-bottom: 1px solid var(--border);
      overflow-x: auto;
      background: #0a0a0f;
      scrollbar-width: none;
    }
    .admin-tabs::-webkit-scrollbar { display: none; }
    .admin-tab {
      flex-shrink: 0;
      padding: 0.75rem 1.25rem;
      background: transparent;
      border: none;
      border-bottom: 2px solid transparent;
      color: var(--muted);
      font-family: var(--font-display);
      font-size: 0.6rem;
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      cursor: pointer;
      transition: color 0.2s, border-color 0.2s;
      white-space: nowrap;
    }
    .admin-tab.active { color: var(--primary); border-bottom-color: var(--primary); }
    .admin-tab:hover:not(.active) { color: var(--text); }
    .admin-body { padding: 1.75rem; }
    .admin-section { display: none; }
    .admin-section.active { display: block; }
    .admin-field { margin-bottom: 1.1rem; }
    .admin-field label {
      display: block;
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 0.35rem;
    }
    .admin-input {
      width: 100%;
      background: #111118;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.65rem 0.9rem;
      color: var(--text);
      font-size: 0.88rem;
      font-family: var(--font-body);
      outline: none;
      transition: border-color 0.2s;
    }
    .admin-input:focus { border-color: var(--primary); }
    .admin-textarea {
      width: 100%;
      background: #111118;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.7rem 0.9rem;
      color: var(--text);
      font-size: 0.82rem;
      font-family: monospace;
      outline: none;
      resize: vertical;
      min-height: 200px;
      line-height: 1.65;
      transition: border-color 0.2s;
    }
    .admin-textarea:focus { border-color: var(--primary); }
    .admin-hint {
      font-size: 0.72rem;
      color: var(--muted);
      margin-top: 0.35rem;
      line-height: 1.5;
    }
    .admin-hint code {
      background: #1a1a26;
      border-radius: 3px;
      padding: 0.1rem 0.3rem;
      font-size: 0.7rem;
      color: var(--secondary);
    }
    .admin-save-row {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-top: 1.5rem;
      padding-top: 1.25rem;
      border-top: 1px solid var(--border);
    }
    .admin-save-btn {
      padding: 0.7rem 1.75rem;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 6px;
      font-family: var(--font-display);
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(168,85,247,0.3);
      transition: opacity 0.2s, transform 0.15s;
    }
    .admin-save-btn:hover { opacity: 0.85; transform: scale(1.02); }
    .admin-save-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
    .admin-status { font-size: 0.8rem; font-weight: 600; }
    .admin-status.ok { color: #22c55e; }
    .admin-status.err { color: var(--danger); }
    .admin-row-list { display: flex; flex-direction: column; gap: 0.5rem; margin-bottom: 0.5rem; }
    .admin-row-item { display: flex; gap: 0.5rem; align-items: flex-start; }
    .admin-card-item {
      background: #111118;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.75rem;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      margin-bottom: 0.5rem;
    }
    .admin-card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.25rem;
    }
    .admin-card-label {
      font-size: 0.6rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .admin-row-input {
      flex: 1;
      background: #111118;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.52rem 0.75rem;
      color: var(--text);
      font-size: 0.85rem;
      font-family: var(--font-body);
      outline: none;
      transition: border-color 0.2s;
      min-width: 0;
    }
    .admin-row-input:focus { border-color: var(--primary); }
    .admin-row-input::placeholder { color: var(--muted); }

    /* ── Toggle Switch ── */
    .toggle-wrap {
      display: flex;
      align-items: center;
      gap: 0.55rem;
      height: 32px; /* match input height */
    }
    .toggle-switch {
      position: relative;
      display: inline-block;
      width: 38px;
      height: 22px;
      flex-shrink: 0;
    }
    .toggle-switch input { opacity: 0; width: 0; height: 0; position: absolute; }
    .toggle-track {
      position: absolute;
      inset: 0;
      border-radius: 999px;
      background: rgba(255,255,255,0.08);
      border: 1px solid var(--border);
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
    }
    .toggle-track::after {
      content: '';
      position: absolute;
      top: 3px;
      left: 3px;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--muted);
      transition: transform 0.2s, background 0.2s;
    }
    .toggle-switch input:checked + .toggle-track { background: rgba(34,197,94,0.25); border-color: rgba(34,197,94,0.5); }
    .toggle-switch input:checked + .toggle-track::after { transform: translateX(16px); background: #22c55e; }
    .toggle-switch.admin-toggle input:checked + .toggle-track { background: var(--primary-dim); border-color: rgba(168,85,247,0.5); }
    .toggle-switch.admin-toggle input:checked + .toggle-track::after { background: var(--primary); }
    .toggle-switch.editor-toggle input:checked + .toggle-track { background: rgba(34,211,238,0.2); border-color: rgba(34,211,238,0.5); }
    .toggle-switch.editor-toggle input:checked + .toggle-track::after { background: var(--secondary); }
    .toggle-switch.orders-toggle input:checked + .toggle-track { background: rgba(34,197,94,0.2); border-color: rgba(34,197,94,0.5); }
    .toggle-switch.orders-toggle input:checked + .toggle-track::after { background: #22c55e; }
    .toggle-switch input:disabled + .toggle-track { cursor: not-allowed; }
    .toggle-switch input:disabled:checked + .toggle-track { background: rgba(34,197,94,0.15); border-color: rgba(34,197,94,0.3); }
    .toggle-switch input:disabled:checked + .toggle-track::after { background: #22c55e; opacity: 0.6; }
    .toggle-label {
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--muted);
      transition: color 0.2s;
      min-width: 48px;
    }
    .toggle-switch input:checked ~ .toggle-label { color: var(--text); }
    .admin-card-input {
      width: 100%;
      background: #0d0d14;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.5rem 0.75rem;
      color: var(--text);
      font-size: 0.85rem;
      font-family: var(--font-body);
      outline: none;
      transition: border-color 0.2s;
    }
    .admin-card-input:focus { border-color: var(--primary); }
    .admin-card-input::placeholder { color: var(--muted); }
    .admin-row-remove {
      flex-shrink: 0;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--muted);
      cursor: pointer;
      padding: 0.45rem 0.6rem;
      font-size: 0.8rem;
      line-height: 1;
      transition: border-color 0.2s, color 0.2s;
    }
    .admin-row-remove:hover { border-color: var(--danger); color: var(--danger); }
    .admin-add-btn {
      width: 100%;
      background: transparent;
      border: 1px dashed rgba(168,85,247,0.4);
      border-radius: 6px;
      color: var(--primary);
      cursor: pointer;
      padding: 0.55rem 1rem;
      font-size: 0.7rem;
      font-family: var(--font-display);
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      transition: border-color 0.2s, background 0.2s;
      margin-top: 0.25rem;
    }
    .admin-add-btn:hover { border-color: var(--primary); background: var(--primary-dim); }
    .admin-sublabel {
      font-family: var(--font-display);
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--secondary);
      margin: 1.25rem 0 0.6rem;
    }
    .admin-divider { border: none; border-top: 1px solid var(--border); margin: 1.5rem 0; }

    /* ── MOBILE ── */
    @media (max-width: 768px) {
      .auth-box { padding: 2rem 1.25rem; }
      .admin-header { padding: 1rem 1.25rem; }
      .admin-header-title { font-size: 0.75rem; }
      .admin-tab { padding: 0.7rem 1rem; }
      .admin-body { padding: 1rem; }
      .admin-save-row { flex-wrap: wrap; gap: 0.75rem; }
      .admin-save-btn { padding: 0.6rem 1.25rem; }
      .admin-textarea { min-height: 160px; }
      .admin-row-item { flex-wrap: wrap; }
      .admin-row-item > * { flex: 1 1 100% !important; min-width: 0 !important; }
      .admin-row-item > button.admin-row-remove { flex: 0 0 auto !important; margin-left: 0; }
      .admin-row-item > div[style*="flex:3.8"] { flex-wrap: wrap !important; }
      #admin-games .game-screenshot-input { flex: 1 1 100% !important; }
      .admin-row-list .admin-card-item { padding: 0.65rem; }

      #admin-games div[style*="grid-template-columns:1fr 1fr"] { grid-template-columns: 1fr !important; }
      #admin-games div[style*="grid-template-columns:auto auto auto auto 1fr"] { grid-template-columns: 1fr !important; gap: 0.5rem !important; }
      #admin-games [id^="form-usr-"] { padding: 0.65rem; }
    }
    @media (max-width: 480px) {
      .admin-hint { font-size: 0.68rem; }
      .admin-tab { padding: 0.65rem 0.8rem; font-size: 0.55rem; }
    }

        
    #main-content.visible { display: block; }
  </style>
</head>

<script>

function escHtml(s) {
  return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}


// ── Admin: render shop editor ──
function renderShopEditor(items) {
  const list = document.getElementById('ae-shop-list');
  if (!list) return;
  list.innerHTML = (items || []).map((item, i) => shopEditorCard(item, i + 1)).join('');
}

function shopEditorCard(item, n) {
  const safeImg   = escHtml(item.img   || '');
  const safeName  = escHtml(item.name  || '');
  const safePrice = escHtml(item.price || '');
  return `
  <div class="admin-card-item">
    <div class="admin-card-header">
      <span class="admin-card-label">Item ${n}</span>
      <button class="admin-row-remove" onclick="adminRemoveRow(this)">✕</button>
    </div>
    <input class="shop-item-name admin-card-input" placeholder="Name (e.g. Monster Zero)" value="${safeName}" />
    <input class="shop-item-price admin-card-input" placeholder="Price (e.g. 3.99)" value="${safePrice}" type="number" min="0" step="0.01" />
    <input class="shop-item-img admin-card-input" placeholder="Image URL (transparent PNG recommended)" value="${safeImg}" />
    ${safeImg ? `<img src="${safeImg}" alt="preview" style="height:60px;object-fit:contain;margin-top:0.25rem;opacity:0.85;filter:drop-shadow(0 2px 6px rgba(168,85,247,0.3));" onerror="this.style.display='none'" />` : ''}
  </div>`;
}

window.adminAddShopItem = function() {
  const list = document.getElementById('ae-shop-list');
  const n = list.querySelectorAll('.admin-card-item').length + 1;
  const div = document.createElement('div');
  div.innerHTML = shopEditorCard({}, n);
  list.appendChild(div.firstElementChild);
  list.lastElementChild.querySelector('.shop-item-name').focus();
};
</script>

    const fullName = snapData.fullName || snapData.username || user.email;
    
    let orderNumber;
    const existingOrders = await getDocs(collection(db, 'orders'));
    const usedNumbers = new Set(existingOrders.docs.map(d => d.data().orderNumber).filter(Boolean));
    do {
      orderNumber = Math.floor(100000 + Math.random() * 900000);
    } while (usedNumbers.has(orderNumber));
    const orderDoc = {
      email: user.email,
      username,
      fullName,
      items: orderData.items,
      total: orderData.total,
      orderNumber,
      placedAt: new Date().toISOString()
    };
    
    const orderId = 'order_' + Date.now();
    await setDoc(doc(db, 'users', user.email, 'orders', orderId), orderDoc);
    
    await setDoc(doc(db, 'orders', orderId), orderDoc);
    return { orderNumber, fullName };
  };

  
  window._fetchAllOrders = async function() {
    const snap = await getDocs(collection(db, 'orders'));
    return snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a,b) => b.placedAt.localeCompare(a.placedAt));
  };

  
  window._fetchMyOrders = async function() {
    const user = auth.currentUser;
    if (!user) return [];
    const snap = await getDocs(collection(db, 'users', user.email, 'orders'));
    return snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a,b) => b.placedAt.localeCompare(a.placedAt));
  };

  
  Object.defineProperty(window, '_currentUserEmail', {
    get: () => auth.currentUser ? auth.currentUser.email : null,
    configurable: true
  });

  
  window._markOrderCompleted = async function(orderId) {
    const completedAt = new Date().toISOString();
    const patch = { completed: true, completedAt };
    
    await updateDoc(doc(db, 'orders', orderId), patch);
    
    try {
      const topSnap = await getDoc(doc(db, 'orders', orderId));
      if (topSnap.exists()) {
        const email = topSnap.data().email;
        if (email) {
          await updateDoc(doc(db, 'users', email, 'orders', orderId), patch);
        }
      }
    } catch(e) { console.warn('Could not sync completed status to user subcollection:', e); }
  };

  
  window._markOrderActive = async function(orderId) {
    const patch = { completed: false, completedAt: null };
    await updateDoc(doc(db, 'orders', orderId), patch);
    try {
      const topSnap = await getDoc(doc(db, 'orders', orderId));
      if (topSnap.exists()) {
        const email = topSnap.data().email;
        if (email) {
          await updateDoc(doc(db, 'users', email, 'orders', orderId), patch);
        }
      }
    } catch(e) { console.warn('Could not sync active status to user subcollection:', e); }
  };
  
  window._fetchSignupRequests = async function() {
    const snap = await getDocs(collection(db, 'signupRequests'));
    return snap.docs.map(d => ({ id: d.id, ...d.data() }));
  };

  window._fetchGameRequests = async function() {
    const snap = await getDocs(collection(db, 'gameRequests'));
    return snap.docs.map(d => ({ id: d.id, ...d.data() }));
  };

  window._deleteGameRequest = async function(requestId) {
    await deleteDoc(doc(db, 'gameRequests', requestId));
  };

  
  window._fetchAllUsers = async function() {
    const snap = await getDocs(collection(db, 'users'));
    return snap.docs.map(d => ({ id: d.id, ...d.data() }));
  };

  
  window._updateUserProfile = async function(email, patch) {
    await updateDoc(doc(db, 'users', email), patch);
  };

  
  window._saveUserPassword = async function(email, newPassword) {
    
    const secondaryAppName = 'secondary-pwchange-' + Date.now();
    const secondaryApp = initializeApp(firebaseConfig, secondaryAppName);
    const secondaryAuth = getAuth(secondaryApp);
    try {
      await signInWithEmailAndPassword(secondaryAuth, email, newPassword);
    } catch(e) {
      
    } finally {
      await signOut(secondaryAuth).catch(() => {});
      await deleteApp(secondaryApp).catch(() => {});
    }
    
    await setDoc(doc(db, 'users', email), { password: newPassword }, { merge: true });
  };

  
  window._updateSignupRequestPassword = async function(requestId, newPassword) {
    await updateDoc(doc(db, 'signupRequests', requestId), { password: newPassword });
  };

  
  
  window._approveSignup = async function(requestId, email, password, fullName, username) {
    
    
    const secondaryAppName = 'secondary-signup-' + Date.now();
    const secondaryApp = initializeApp(firebaseConfig, secondaryAppName);
    const secondaryAuth = getAuth(secondaryApp);

    try {
      
      await createUserWithEmailAndPassword(secondaryAuth, email, password);

      
      await signOut(secondaryAuth);
    } finally {
      
      await deleteApp(secondaryApp).catch(() => {});
    }

    
    await setDoc(doc(db, 'users', email), {
      email,
      username: username || '',
      fullName: fullName || '',
      password: password || '',
      createdAt: new Date().toISOString(),
      admin: false
    }, { merge: true });

    
    await updateDoc(doc(db, 'signupRequests', requestId), {
      status: 'approved',
      approvedAt: new Date().toISOString()
    });
  };

  
  window._denySignup = async function(requestId) {
    await updateDoc(doc(db, 'signupRequests', requestId), {
      status: 'denied',
      deniedAt: new Date().toISOString()
    });
  };

  
  window.switchTab = function(tab) {
    document.getElementById('auth-error').classList.remove('show');
    if (window._retryCountdownInterval) {
      clearInterval(window._retryCountdownInterval);
      window._retryCountdownInterval = null;
    }
  };

  
  function friendlyError(code) {
    const map = {
      'auth/invalid-email': 'That email address doesn\'t look right.',
      'auth/user-not-found': 'No account found with that email.',
      'auth/wrong-password': 'Incorrect password. Try again.',
      'auth/email-already-in-use': 'An account with that email already exists.',
      'auth/weak-password': 'Password must be at least 6 characters.',
      'auth/too-many-requests': 'Too many attempts. Try again later.',
      'auth/invalid-credential': 'Email or password is incorrect.',
      'auth/user-disabled': 'This account has been disabled.',
    };
    return map[code] || 'Something went wrong. Please try again.';
  }

  
  window.handleAuth = async function() {
    const email = document.getElementById('auth-email').value.trim();
    const password = document.getElementById('auth-password').value;
    const errEl = document.getElementById('auth-error');
    const btn = document.getElementById('auth-submit');

    errEl.classList.remove('show');
    if (!email || !password) { errEl.textContent = 'Please fill in all fields.'; errEl.classList.add('show'); return; }

    btn.disabled = true;
    btn.textContent = 'Logging in...';

    try {
      const cred = await signInWithEmailAndPassword(auth, email, password);
      const user = cred.user;
      
      
      
    } catch (err) {
      errEl.textContent = friendlyError(err.code);
      errEl.classList.add('show');
      btn.disabled = false;
      btn.textContent = 'Login';
    }
  };

  let accountStatusUnsubscribe = null;
  let _forcedSignout = false;

  onAuthStateChanged(auth, async (user) => {
    const wall = document.getElementById('auth-wall');
    const main = document.getElementById('main-content');
    const badge = document.getElementById('nav-user-badge');

    
    if (!user && _forcedSignout) {
      _forcedSignout = false;
      wall.classList.remove('hidden');
      main.classList.remove('visible');
      if (badge) badge.innerHTML = '';
      const errEl = document.getElementById('auth-error');
      if (errEl) {
        errEl.textContent = 'Your account has been disabled. Contact an admin for help.';
        errEl.classList.add('show');
      }
      return;
    }

    if (user) {
      
      
      try {
        const activeSnap = await getDoc(doc(db, 'users', user.email));
        const activeSnapLower = !activeSnap.exists() && user.email && user.email.toLowerCase() !== user.email
          ? await getDoc(doc(db, 'users', user.email.toLowerCase()))
          : activeSnap;
        if (activeSnapLower.exists()) {
          const d = activeSnapLower.data();
          if (d.active === false) {
            _forcedSignout = true;
            await signOut(auth);
            
            return;
          }
        }
        if (accountStatusUnsubscribe) accountStatusUnsubscribe();
        const accountDocId = activeSnap.exists() ? user.email : user.email.toLowerCase();
        accountStatusUnsubscribe = onSnapshot(doc(db, 'users', accountDocId), async (snap) => {
          const data = snap.exists() ? snap.data() : null;
          if (data && data.active === false && auth.currentUser) {
            _forcedSignout = true;
            if (accountStatusUnsubscribe) {
              accountStatusUnsubscribe();
              accountStatusUnsubscribe = null;
            }
            await signOut(auth);
          }
        });
      } catch(e) {
        
        
        console.warn('Could not verify account status — signing out for safety:', e);
        _forcedSignout = true;
        await signOut(auth);
        return;
      }

      
      wall.classList.add('hidden');
      main.classList.add('visible');

      
      let username = user.email;
      let fullName = '';
      try {
        const snap = await getDoc(doc(db, 'users', user.email));
        if (snap.exists()) {
          const snapData = snap.data();
          if (snapData.username) {
            username = snapData.username;
            if (user.displayName !== username) {
              await updateProfile(user, { displayName: username });
            }
          } else {
            username = user.displayName || user.email;
          }
          fullName = snapData.fullName || '';
        } else {
          username = user.displayName || user.email;
        }
      } catch(e) {
        username = user.displayName || user.email;
      }

      try {
        const contentSnap = await getDoc(doc(db, 'siteContent', 'main'));
        if (contentSnap.exists()) window._siteData = contentSnap.data();
      } catch (e) {}

      
      try {
        const userSnap = await getDoc(doc(db, 'users', user.email));
        const userSnapLower = !userSnap.exists() && user.email && user.email.toLowerCase() !== user.email
          ? await getDoc(doc(db, 'users', user.email.toLowerCase()))
          : userSnap;
        const userData = userSnapLower.exists() ? userSnapLower.data() : {};
        const isAdmin  = userData.admin  === true;
        const isEditor = userData.editor === true;

        if (isAdmin || isEditor) {
          window._isAdmin  = isAdmin;
          window._isEditor = isEditor && !isAdmin;
          injectAdminPanels();
          setTimeout(() => openAdminPanel(), 100);
        } else {
          window.location.href = '/';
        }
        
        window._canSeeAllOrders = (userData.orders === true || userData.admin === true);

        
        const ordersSection = document.getElementById('orders-popup-section');
        if (ordersSection) ordersSection.style.display = 'block';
      } catch(e) {
        console.warn('Could not check admin/editor status:', e);
      }

    } else {
      wall.classList.remove('hidden');
      main.classList.remove('visible');
      if (badge) badge.innerHTML = '';
      if (accountStatusUnsubscribe) {
        accountStatusUnsubscribe();
        accountStatusUnsubscribe = null;
      }
      
      document.getElementById('auth-email').value = '';
      document.getElementById('auth-password').value = '';
      document.getElementById('auth-error').classList.remove('show');
    }
  });

  
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !document.getElementById('auth-wall').classList.contains('hidden')) {
      const loginVisible = document.getElementById('login-form-wrap').style.display !== 'none';
      if (loginVisible) handleAuth();
    }
  });
</script>

window.loadSignupRequests = async function() {
  const list = document.getElementById('approvals-list');
  const summary = document.getElementById('approvals-summary');
  list.innerHTML = '<div style="color:var(--muted);font-size:0.8rem;text-align:center;padding:2rem 0;">Loading...</div>';
  summary.textContent = '';

  try {
    const requests = await window._fetchSignupRequests();
    const pending = requests.filter(r => r.status === 'pending');
    const others  = requests.filter(r => r.status !== 'pending').sort((a,b) => (b.approvedAt||b.deniedAt||'').localeCompare(a.approvedAt||a.deniedAt||''));

    summary.textContent = `${pending.length} pending · ${requests.length} total`;

    if (!requests.length) {
      list.innerHTML = '<div style="color:var(--muted);font-size:0.8rem;text-align:center;padding:2rem 0;">No signup requests yet.</div>';
      return;
    }

    const renderRow = (r) => {
      const isPending = r.status === 'pending';
      const date = new Date(r.requestedAt).toLocaleDateString('en-US', { month:'short', day:'numeric', hour:'2-digit', minute:'2-digit' });
      const statusColor = r.status === 'approved' ? '#22c55e' : r.status === 'denied' ? 'var(--danger)' : 'var(--secondary)';
      const statusLabel = r.status === 'approved' ? '✓ Approved' : r.status === 'denied' ? '✗ Denied' : '⏳ Pending';
      const safeFullName = (r.fullName || '').replace(/'/g, "\\'");
      const safeUsername = (r.username || '').replace(/'/g, "\\'");
      const safeId = r.id;

      return `<div style="display:flex;flex-direction:column;gap:0.5rem;padding:0.75rem;background:#0d0d14;border:1px solid ${isPending ? 'rgba(168,85,247,0.3)' : 'var(--border)'};border-radius:8px;">
        <div style="display:flex;align-items:center;justify-content:space-between;gap:0.5rem;flex-wrap:wrap;">
          <div style="display:flex;flex-direction:column;gap:0.1rem;min-width:0;">
            ${r.fullName ? `<span style="font-size:0.9rem;font-weight:700;color:var(--text);font-family:var(--font-display);letter-spacing:0.03em;">${escHtml(r.fullName)}</span>` : ''}
            ${r.username ? `<span style="font-size:0.75rem;color:var(--primary);font-weight:600;">@${escHtml(r.username)}</span>` : ''}
            <span style="font-size:0.85rem;font-weight:600;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escHtml(r.email)}</span>
            <span style="font-size:0.7rem;color:var(--muted);">Requested ${date}</span>
            ${r.password ? `<div style="margin-top:0.2rem;display:flex;align-items:center;gap:0.4rem;">
              <span style="font-size:0.65rem;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:var(--muted);">Password:</span>
              <span class="req-pw-mask" data-pw="${escAttr(r.password)}" style="font-size:0.78rem;color:var(--text);font-family:monospace;letter-spacing:0.05em;cursor:pointer;user-select:none;" onclick="toggleReqPw(this)" title="Click to reveal">••••••••</span>
            </div>` : ''}
          </div>
          <span style="font-size:0.7rem;font-weight:700;color:${statusColor};flex-shrink:0;">${statusLabel}</span>
        </div>
        ${isPending ? `
        <div style="display:flex;gap:0.5rem;">
          <button onclick="approveRequest('${safeId}','${r.email}','${r.password}','${safeFullName}','${safeUsername}')" style="flex:1;padding:0.5rem;background:rgba(34,197,94,0.12);border:1px solid rgba(34,197,94,0.4);border-radius:6px;color:#22c55e;font-family:var(--font-display);font-size:0.6rem;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;cursor:pointer;transition:background 0.2s;" onmouseover="this.style.background='rgba(34,197,94,0.22)'" onmouseout="this.style.background='rgba(34,197,94,0.12)'">✓ Approve</button>
          <button onclick="denyRequest('${safeId}')" style="flex:1;padding:0.5rem;background:var(--danger-dim);border:1px solid rgba(239,68,68,0.3);border-radius:6px;color:var(--danger);font-family:var(--font-display);font-size:0.6rem;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;cursor:pointer;transition:background 0.2s;" onmouseover="this.style.background='rgba(239,68,68,0.2)'" onmouseout="this.style.background='var(--danger-dim)'">✗ Deny</button>
        </div>` : ''}
      </div>`;
    };

    list.innerHTML = [
      ...pending.map(renderRow),
      ...(others.length && pending.length ? ['<div style="border-top:1px solid var(--border);margin:0.25rem 0;"></div>'] : []),
      ...others.map(renderRow)
    ].join('');

  } catch(e) {
    list.innerHTML = `<div style="color:var(--danger);font-size:0.8rem;text-align:center;padding:2rem 0;">Failed to load: ${e.message}</div>`;
  }
};


window.toggleReqPw = function(el) {
  const pw = el.dataset.pw;
  const shown = el.dataset.shown === '1';
  el.textContent = shown ? '••••••••' : pw;
  el.dataset.shown = shown ? '0' : '1';
};

window.approveRequest = async function(requestId, email, password, fullName, username) {
  const btn = event && event.target;
  if (btn) { btn.disabled = true; btn.textContent = 'Creating...'; }
  try {
    await window._approveSignup(requestId, email, password, fullName, username);
    loadSignupRequests();
  } catch(e) {
    alert('Failed to approve: ' + e.message);
    if (btn) { btn.disabled = false; btn.textContent = '✓ Approve'; }
  }
};

window.denyRequest = async function(requestId) {
  if (!confirm('Deny this signup request?')) return;
  try {
    await window._denySignup(requestId);
    loadSignupRequests();
  } catch(e) {
    alert('Failed to deny: ' + e.message);
  }
};


window._allUsers = [];

window.loadApprovedUsers = async function() {
  const list = document.getElementById('approvals-list');
  const summary = document.getElementById('approvals-summary');
  list.innerHTML = '<div style="color:var(--muted);font-size:0.8rem;text-align:center;padding:2rem 0;">Loading...</div>';
  summary.textContent = '';

  
  const searchEl = document.getElementById('user-search');
  if (searchEl) searchEl.value = '';

  try {
    const users = await window._fetchAllUsers();
    window._allUsers = users.sort((a,b) => (a.username||a.email).localeCompare(b.username||b.email));

    if (!users.length) {
      list.innerHTML = '<div style="color:var(--muted);font-size:0.8rem;text-align:center;padding:2rem 0;">No approved users yet.</div>';
      summary.textContent = '0 users';
      return;
    }

    renderUserList(window._allUsers);

  } catch(e) {
    list.innerHTML = `<div style="color:var(--danger);font-size:0.8rem;text-align:center;padding:2rem 0;">Failed to load: ${e.message}</div>`;
  }
};

function renderUserList(users) {
  const list = document.getElementById('approvals-list');
  const summary = document.getElementById('approvals-summary');
  summary.textContent = `${users.length} of ${window._allUsers.length} user${window._allUsers.length !== 1 ? 's' : ''}`;
  if (!users.length) {
    list.innerHTML = '<div style="color:var(--muted);font-size:0.8rem;text-align:center;padding:2rem 0;">No users match your search.</div>';
    return;
  }
  list.innerHTML = users.map(u => renderUserCard(u)).join('');
}

window.filterUsers = function(query) {
  const q = query.trim().toLowerCase();
  if (!q) {
    renderUserList(window._allUsers);
    return;
  }
  const filtered = window._allUsers.filter(u => {
    return (u.email      || '').toLowerCase().includes(q)
        || (u.username   || '').toLowerCase().includes(q)
        || (u.fullName   || '').toLowerCase().includes(q);
  });
  renderUserList(filtered);
};

window.updateToggleLabel = function(labelId, checked, onText, offText) {
  const el = document.getElementById(labelId);
  if (!el) return;
  el.textContent = checked ? onText : offText;
  if (onText === 'Active')      el.style.color = checked ? '#22c55e' : 'var(--danger)';
  else if (onText === 'Admin')  el.style.color = checked ? 'var(--primary)' : 'var(--muted)';
  else if (onText === 'Editor') el.style.color = checked ? 'var(--secondary)' : 'var(--muted)';
  else if (onText === 'Orders') el.style.color = checked ? '#22c55e' : 'var(--muted)';
  else                          el.style.color = checked ? 'var(--primary)' : 'var(--muted)';
};

window.toggleUserCard = function(safeId) {
  const form = document.getElementById('form-' + safeId);
  const chevron = document.getElementById('chevron-' + safeId);
  if (!form) return;
  const isOpen = form.style.display !== 'none';
  form.style.display = isOpen ? 'none' : 'flex';
  if (chevron) chevron.style.transform = isOpen ? '' : 'rotate(180deg)';
};

window.toggleUserPwField = function(safeId) {
  const input = document.getElementById('pw-' + safeId);
  if (!input) return;
  input.type = input.type === 'password' ? 'text' : 'password';
};

window.saveUserCard = async function(email, safeId) {
  const msgEl = document.getElementById('msg-' + safeId);
  const fullName = (document.getElementById('fn-' + safeId).value || '').trim();
  const username = (document.getElementById('un-' + safeId).value || '').trim();
  const isActive  = document.getElementById('st-' + safeId).checked;
  const isAdmin   = document.getElementById('ad-' + safeId).checked;
  const isEditor  = document.getElementById('ed-' + safeId).checked;
  const isOrders  = document.getElementById('or-' + safeId).checked;
  const password = (document.getElementById('pw-' + safeId).value || '').trim();

  msgEl.textContent = 'Saving…';
  msgEl.style.color = 'var(--muted)';

  try {
    const patch = { fullName, username, active: isActive, admin: isAdmin, editor: isEditor, orders: isOrders };
    if (password) patch.password = password;
    await window._updateUserProfile(email, patch);

    
    const activeBadge = document.getElementById('badge-active-' + safeId);
    if (activeBadge) {
      activeBadge.textContent = isActive ? 'ACTIVE' : 'INACTIVE';
      activeBadge.style.cssText = isActive
        ? 'font-size:0.6rem;font-weight:700;letter-spacing:0.1em;padding:0.18rem 0.5rem;border-radius:4px;background:rgba(34,197,94,0.12);color:#22c55e;border:1px solid rgba(34,197,94,0.3);'
        : 'font-size:0.6rem;font-weight:700;letter-spacing:0.1em;padding:0.18rem 0.5rem;border-radius:4px;background:var(--danger-dim);color:var(--danger);border:1px solid rgba(239,68,68,0.25);';
    }
    const adminBadge = document.getElementById('badge-admin-' + safeId);
    if (adminBadge) adminBadge.style.display = isAdmin ? 'inline-block' : 'none';
    const editorBadge = document.getElementById('badge-editor-' + safeId);
    if (editorBadge) editorBadge.style.display = isEditor ? 'inline-block' : 'none';
    const ordersBadge = document.getElementById('badge-orders-' + safeId);
    if (ordersBadge) ordersBadge.style.display = isOrders ? 'inline-block' : 'none';
    
    const card = document.getElementById('card-' + safeId);
    if (card) {
      const header = card.querySelector('div[onclick]');
      if (header) {
        const nameSpans = header.querySelector('div > div');
        if (nameSpans) {
          nameSpans.innerHTML = `
            <div style="display:flex;align-items:center;gap:0.5rem;flex-wrap:wrap;">
              ${fullName ? `<span style="font-size:0.88rem;font-weight:700;color:var(--text);font-family:var(--font-display);letter-spacing:0.02em;">${escHtml(fullName)}</span>` : ''}
              ${username ? `<span style="font-size:0.72rem;color:var(--primary);font-weight:600;">@${escHtml(username)}</span>` : ''}
            </div>
            <span style="font-size:0.75rem;color:var(--muted);">${escHtml(email)}</span>`;
        }
      }
    }

    msgEl.textContent = '✓ Saved';
    msgEl.style.color = '#22c55e';
    setTimeout(() => { msgEl.textContent = ''; }, 2500);
  } catch(e) {
    msgEl.textContent = '✗ ' + (e.message || 'Failed');
    msgEl.style.color = 'var(--danger)';
  }
};

window.openAdminPanel = function() {
  if (!window._isAdmin && !window._isEditor) return;
  const data = window._siteData;
  if (!data) { alert('Site data not loaded yet. Try again in a moment.'); return; }
  window._adminOriginalData = JSON.parse(JSON.stringify(data));

  
  renderGamesEditor(data.games || {});

  
  renderSitesEditor(data.sites || []);

  
  renderTabCloaksEditor((data.tabCloaks && data.tabCloaks.length) ? data.tabCloaks : (window._tabCloakDefaults || []));

  
  renderShopEditor(data.shop || []);

  
  renderBannedEditor(data.banned || []);

  
  const h = data.command?.hiring || {};
  document.getElementById('ae-hiring-active').value = h.active ? 'true' : 'false';
  document.getElementById('ae-hiring-badge').value = h.badge || '';
  document.getElementById('ae-hiring-title').value = h.title || '';
  document.getElementById('ae-hiring-desc').value = h.description || '';
  document.getElementById('ae-hiring-url').value = h.url || '';
  renderCommandLinksEditor(data.command?.links || []);

  
  document.querySelectorAll('.admin-status').forEach(el => { el.textContent=''; el.className='admin-status'; });

  
  const roleTag = document.getElementById('admin-role-badge');
  if (roleTag) {
    if (window._isEditor) {
      roleTag.textContent = 'EDITOR';
      roleTag.style.background = 'rgba(34,211,238,0.12)';
      roleTag.style.color = 'var(--secondary)';
      roleTag.style.borderColor = 'rgba(34,211,238,0.3)';
      roleTag.style.display = 'inline-flex';
    } else {
      roleTag.textContent = 'ADMIN';
      roleTag.style.background = 'rgba(168,85,247,0.12)';
      roleTag.style.color = 'var(--primary)';
      roleTag.style.borderColor = 'rgba(168,85,247,0.3)';
      roleTag.style.display = 'inline-flex';
    }
  }

  switchAdminTab('games');
  document.getElementById('admin-panel').classList.add('open');
};

window.closeAdminPanel = function() {
  document.getElementById('admin-panel').classList.remove('open');
};

window.loadGameRequestsEditor = async function() {
  const list = document.getElementById('ae-game-requests-list');
  const summary = document.getElementById('game-requests-summary');
  if (!list || !summary) return;
  list.innerHTML = '<div style="color:var(--muted);font-size:0.8rem;text-align:center;padding:1.5rem 0;">Loading game requests...</div>';
  summary.textContent = '';
  try {
    const rows = await window._fetchGameRequests();
    const sorted = rows.sort((a, b) => new Date(b.createdAt || 0) - new Date(a.createdAt || 0));
    const completed = sorted.filter(r => (r.status || '').toLowerCase() === 'done').length;
    summary.textContent = `${sorted.length} total · ${completed} completed`;
    if (!sorted.length) {
      list.innerHTML = '<div style="color:var(--muted);font-size:0.8rem;text-align:center;padding:1.5rem 0;">No game requests yet.</div>';
      return;
    }
    list.innerHTML = sorted.map(r => {
      const rid = escAttr(r.id || '');
      const isDone = (r.status || '').toLowerCase() === 'done';
      const created = r.createdAt ? new Date(r.createdAt).toLocaleString('en-US', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }) : 'Unknown date';
      return `<div style="display:flex;flex-direction:column;gap:0.35rem;padding:0.7rem;background:#0d0d14;border:1px solid var(--border);border-radius:8px;">
        <div style="display:flex;align-items:center;justify-content:space-between;gap:0.5rem;">
          <div style="font-size:0.82rem;color:var(--text);font-weight:700;">${escHtml(r.name || 'Untitled')}</div>
          <span style="font-size:0.62rem;color:${isDone ? '#22c55e' : 'var(--primary)'};font-weight:700;letter-spacing:0.06em;">${escHtml((r.status || 'pending').toUpperCase())}</span>
        </div>
        <div style="font-size:0.69rem;color:var(--muted);">${escHtml(r.email || 'unknown')}</div>
        ${r.url ? `<a href="${escAttr(r.url)}" target="_blank" rel="noopener noreferrer" style="font-size:0.72rem;color:var(--secondary);word-break:break-all;">${escHtml(r.url)}</a>` : ''}
        ${r.notes ? `<div style="font-size:0.75rem;color:var(--text);opacity:0.85;">${escHtml(r.notes)}</div>` : ''}
        <div style="display:flex;align-items:center;justify-content:space-between;gap:0.5rem;margin-top:0.2rem;">
          <span style="font-size:0.62rem;color:var(--muted);">${created}</span>
          <button onclick="deleteGameRequestEditor('${rid}')" style="padding:0.35rem 0.55rem;background:var(--danger-dim);border:1px solid rgba(239,68,68,0.3);border-radius:5px;color:var(--danger);font-size:0.58rem;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;cursor:pointer;">Delete</button>
        </div>
      </div>`;
    }).join('');
  } catch (e) {
    list.innerHTML = '<div style="color:var(--danger);font-size:0.8rem;text-align:center;padding:1.5rem 0;">Failed to load: ' + escHtml(e.message || 'error') + '</div>';
  }
};

window.deleteGameRequestEditor = async function(requestId) {
  if (!requestId) return;
  if (!confirm('Delete this game request?')) return;
  try {
    await window._deleteGameRequest(requestId);
    loadGameRequestsEditor();
  } catch (e) {
    alert('Failed to delete request: ' + e.message);
  }
};

window.switchAdminTab = function(tab) {
  
  const editorRestricted = ['command', 'ai'];
  if (window._isEditor && editorRestricted.includes(tab)) return;
  document.querySelectorAll('.admin-tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.admin-section').forEach(s => s.classList.remove('active'));
  document.getElementById('admin-' + tab).classList.add('active');
  event && event.target && event.target.classList && event.target.classList.add('active');
  
  document.querySelectorAll('.admin-tab').forEach(t => {
    if (t.getAttribute('onclick') === "switchAdminTab('" + tab + "')") t.classList.add('active');
  });
  if (tab === 'game-requests') {
    loadGameRequestsEditor();
  }
};


function makeCardInput(cls, placeholder, val) {
  return `<input class="${cls} admin-card-input" placeholder="${placeholder}" value="${escAttr(val)}" />`;
}

window.adminHandleGameUrlInput = function(input) {
  const container = input.closest('.admin-row-item, .admin-card-item');
  if (!container) return;
  const isSwf = /\.swf($|\?)/i.test(input.value.trim());
  const popupInput = container.querySelector('.game-popup-input, .site-popup-input');
  const toggleLabel = container.querySelector('.toggle-label');
  const toggleWrap = container.querySelector('.toggle-wrap');
  if (isSwf) {
    if (popupInput) { popupInput.checked = true; popupInput.disabled = true; }
    if (toggleLabel && !toggleLabel.textContent.includes('(Flash)')) toggleLabel.textContent = toggleLabel.textContent.trim() + ' (Flash)';
    if (toggleWrap) toggleWrap.style.opacity = '0.5';
  } else {
    if (popupInput) popupInput.disabled = false;
    if (toggleLabel) toggleLabel.textContent = toggleLabel.textContent.replace(/\s*\(Flash\)$/, '');
    if (toggleWrap) toggleWrap.style.opacity = '';
  }
};

function renderGamesEditor(gamesObj) {
  const flat = [];
  for (const [, games] of Object.entries(gamesObj || {}).sort(([a],[b]) => a.localeCompare(b))) {
    for (const g of games) flat.push(g);
  }
  document.getElementById('ae-games-list').innerHTML = flat.map(g => renderGameRow(g)).join('');
}

function normalizeGameKey(name) {
  return (name || '').trim().toLowerCase();
}

function flattenGames(gamesObj) {
  const flat = [];
  for (const [, games] of Object.entries(gamesObj || {}).sort(([a],[b]) => a.localeCompare(b))) {
    for (const g of games || []) flat.push(g);
  }
  return flat;
}

function getDomainFromUrl(url) {
  try {
    return new URL(url).hostname.replace(/^www\./i, '').toLowerCase();
  } catch {
    return '';
  }
}

function syncPopupTogglesByDomain(sourceRow, preferSourceState) {
  const rows = [...document.querySelectorAll('#ae-games-list .admin-row-item')];
  if (sourceRow) {
    const sourceDomain = getDomainFromUrl(sourceRow.querySelector('.game-url-input')?.value?.trim() || '');
    if (sourceDomain) {
      let desiredState = !!sourceRow.querySelector('.game-popup-input')?.checked;
      if (!preferSourceState) {
        const existing = rows.find(row => row !== sourceRow && getDomainFromUrl(row.querySelector('.game-url-input')?.value?.trim() || '') === sourceDomain);
        if (existing) desiredState = !!existing.querySelector('.game-popup-input')?.checked;
      }
      rows.forEach(row => {
        if (getDomainFromUrl(row.querySelector('.game-url-input')?.value?.trim() || '') !== sourceDomain) return;
        const popupInput = row.querySelector('.game-popup-input');
        if (popupInput) popupInput.checked = desiredState;
      });
      return;
    }
  }

  const domainStatus = new Map();
  rows.forEach(row => {
    const domain = getDomainFromUrl(row.querySelector('.game-url-input')?.value?.trim() || '');
    if (!domain) return;
    if (!domainStatus.has(domain)) {
      domainStatus.set(domain, !!row.querySelector('.game-popup-input')?.checked);
    }
  });
  rows.forEach(row => {
    const domain = getDomainFromUrl(row.querySelector('.game-url-input')?.value?.trim() || '');
    if (!domain || !domainStatus.has(domain)) return;
    const popupInput = row.querySelector('.game-popup-input');
    if (popupInput) popupInput.checked = domainStatus.get(domain);
  });
}

function mergeGameEditorChanges(latestGamesObj, originalGamesObj, rows) {
  const normalizedRows = rows.map(row => {
    const name = row.querySelector('.game-name-input').value.trim();
    const alias = row.querySelector('.game-alias-input').value.trim();
    const url = row.querySelector('.game-url-input').value.trim();
    const screenshot = row.querySelector('.game-screenshot-input').value.trim();
    const originalName = (row.dataset.originalName || '').trim();
    const domain = getDomainFromUrl(url);
    return {
      row,
      name,
      alias,
      url,
      screenshot,
      originalName,
      domain,
      description: row.querySelector('.game-desc-input').value.trim(),
      openInPopup: !!row.querySelector('.game-popup-input').checked,
      hiddenOnChromebook: !!row.querySelector('.game-hidden-chromebook-input')?.checked,
      isTopTier: !!row.querySelector('.game-toptier-input')?.checked
    };
  });

  const popupByDomain = new Map();
  normalizedRows.forEach(item => {
    if (!item.domain || popupByDomain.has(item.domain)) return;
    popupByDomain.set(item.domain, item.openInPopup);
  });
  normalizedRows.forEach(item => {
    if (!item.domain || !popupByDomain.has(item.domain)) return;
    item.openInPopup = popupByDomain.get(item.domain);
  });

  const latestMap = new Map();
  flattenGames(latestGamesObj).forEach(game => {
    const key = normalizeGameKey(game.name);
    if (key) latestMap.set(key, { ...game });
  });

  const originalMap = new Map();
  flattenGames(originalGamesObj).forEach(game => {
    const key = normalizeGameKey(game.name);
    if (key) originalMap.set(key, { ...game });
  });

  const remainingOriginalKeys = new Set(originalMap.keys());

  normalizedRows.forEach(item => {
    const name = item.name;
    const alias = item.alias;
    const url = item.url;
    const openInPopup = item.openInPopup;
    const screenshot = item.screenshot;
    const hiddenOnChromebook = item.hiddenOnChromebook;
    const isTopTier = item.isTopTier;
    const description = item.description;
    const originalName = item.originalName;
    const originalKey = normalizeGameKey(originalName);
    const nextKey = normalizeGameKey(name);
    const originalGame = originalKey ? originalMap.get(originalKey) : null;
    const nextGame = name ? { name, url } : null;
    if (nextGame && alias) nextGame.alias = alias;
    if (nextGame && openInPopup) nextGame.openInPopup = true;
    if (nextGame && screenshot) nextGame.screenshot = screenshot;
    if (nextGame && hiddenOnChromebook) nextGame.hiddenOnChromebook = true;
    if (nextGame && isTopTier) nextGame.isTopTier = true;
    if (nextGame && description) nextGame.description = description;
    if (nextGame && originalGame && originalGame.addedAt) nextGame.addedAt = originalGame.addedAt;
    if (nextGame && !originalGame) nextGame.addedAt = new Date().toISOString();

    if (originalKey) remainingOriginalKeys.delete(originalKey);

    if (!originalGame) {
      if (nextGame) latestMap.set(nextKey, nextGame);
      return;
    }

    const originalComparable = {
      name: originalGame.name || '',
      url: originalGame.url || ''
    };
    if (originalGame.alias) originalComparable.alias = originalGame.alias;
    if (originalGame.openInPopup === true) originalComparable.openInPopup = true;
    if (originalGame.screenshot) originalComparable.screenshot = originalGame.screenshot;
    if (originalGame.hiddenOnChromebook === true) originalComparable.hiddenOnChromebook = true;
    if (originalGame.isTopTier === true) originalComparable.isTopTier = true;
    if (originalGame.description) originalComparable.description = originalGame.description;

    const nextComparable = nextGame ? {
      name: nextGame.name || '',
      url: nextGame.url || ''
    } : null;
    if (nextComparable && nextGame.alias) nextComparable.alias = nextGame.alias;
    if (nextComparable && nextGame.openInPopup === true) nextComparable.openInPopup = true;
    if (nextComparable && nextGame.screenshot) nextComparable.screenshot = nextGame.screenshot;
    if (nextComparable && nextGame.hiddenOnChromebook === true) nextComparable.hiddenOnChromebook = true;
    if (nextComparable && nextGame.isTopTier === true) nextComparable.isTopTier = true;
    if (nextComparable && nextGame.description) nextComparable.description = nextGame.description;

    const unchanged = JSON.stringify(originalComparable) === JSON.stringify(nextComparable);
    if (unchanged) return;

    latestMap.delete(originalKey);
    if (nextGame) latestMap.set(nextKey, nextGame);
  });

  remainingOriginalKeys.forEach(key => {
    latestMap.delete(key);
  });

  const mergedGames = {};
  Array.from(latestMap.values())
    .sort((a, b) => a.name.localeCompare(b.name))
    .forEach(game => {
      const letter = (game.name[0] || '#').toUpperCase();
      if (!mergedGames[letter]) mergedGames[letter] = [];
      mergedGames[letter].push(game);
    });

  return mergedGames;
}

  row.remove();
};

document.addEventListener('change', function(e) {
  if (!e.target) return;
  if (e.target.classList.contains('game-popup-input')) {
    syncPopupTogglesByDomain(e.target.closest('.admin-row-item'), true);
    return;
  }
  if (e.target.classList.contains('game-url-input')) {

  }
});

window.adminSave = async function(section) {
  if (!window._isAdmin) return;
  const statusEl = document.getElementById('status-' + section);
  const btn = document.querySelector('#admin-' + section + ' .admin-save-btn');
  statusEl.textContent = 'Saving...';
  statusEl.className = 'admin-status';
  if (btn) btn.disabled = true;

  try {
    let patch = {};

    if (section === 'games') {
      const latestData = await window._firestoreGetSiteContent();
      const rows = [...document.querySelectorAll('#ae-games-list .admin-row-item')];
      const mergedGames = mergeGameEditorChanges(
        latestData.games || {},
        window._adminOriginalData?.games || {},
        rows
      );
      patch.games = mergedGames;
      window._siteData = Object.assign({}, latestData, { games: mergedGames });
      window._adminOriginalData = Object.assign({}, window._adminOriginalData || {}, { games: JSON.parse(JSON.stringify(mergedGames)) });
      renderGamesEditor(mergedGames);
    } else if (section === 'sites') {
      patch.sites = [...document.querySelectorAll('#ae-sites-list .admin-row-item')].map(row => {
        const [n, u] = row.querySelectorAll('input');
        return { name: n.value.trim(), url: u.value.trim(), openInPopup: !!row.querySelector('.site-popup-input')?.checked };
      }).filter(s => s.name);
    } else if (section === 'shop') {
      patch.shop = [...document.querySelectorAll('#ae-shop-list .admin-card-item')].map(card => ({
        name:  card.querySelector('.shop-item-name').value.trim(),
        price: card.querySelector('.shop-item-price').value.trim(),
        img:   card.querySelector('.shop-item-img').value.trim()
      })).filter(s => s.name);
      
      renderShopEditor(patch.shop);
    } else if (section === 'banned') {
      patch.banned = [...document.querySelectorAll('#ae-banned-list .admin-row-item')]
        .map(row => row.querySelector('input').value.trim()).filter(Boolean);
    } else if (section === 'command') {
      patch.command = {
        hiring: {
          active:      document.getElementById('ae-hiring-active').value === 'true',
          badge:       document.getElementById('ae-hiring-badge').value.trim(),
          title:       document.getElementById('ae-hiring-title').value.trim(),
          description: document.getElementById('ae-hiring-desc').value.trim(),
          url:         document.getElementById('ae-hiring-url').value.trim()
        },
        links: [...document.querySelectorAll('#ae-command-links-list .admin-card-item')].map(card => {
          const url = card.querySelector('.cl-url').value.trim();
          return {
            title:       card.querySelector('.cl-title').value.trim(),
            description: card.querySelector('.cl-desc').value.trim(),
            status:      url ? 'Active' : 'soon',
            url
          };
        }).filter(l => l.title)
      };
    } else if (section === 'tabcloaks') {
      const seen = new Set();
      patch.tabCloaks = [...document.querySelectorAll('#ae-tabcloaks-list .admin-row-item')].map(row => {
        const inputs = row.querySelectorAll('input');
        return { name: inputs[0].value.trim(), icon: inputs[1].value.trim() };
      }).filter(p => {
        if (!p.name || !p.icon) return false;
        const key = p.name.toLowerCase();
        if (seen.has(key)) return false;
        seen.add(key);
        return true;
      });
      if (patch.tabCloaks.length) {
        renderTabCloaksEditor(patch.tabCloaks);
      } else {
        renderTabCloaksEditor(window._tabCloakDefaults || []);
      }
    }

    await window._firestoreUpdate(patch);

    
    window._siteData = Object.assign({}, window._siteData, patch);
    if (window._adminOriginalData) {
      window._adminOriginalData = Object.assign({}, window._adminOriginalData, JSON.parse(JSON.stringify(patch)));
    }
    populatePage(window._siteData);

    statusEl.textContent = '✓ Saved';
    statusEl.className = 'admin-status ok';
    setTimeout(() => { statusEl.textContent = ''; statusEl.className = 'admin-status'; }, 3000);
  } catch(e) {
    console.error('Admin save error:', e);
    statusEl.textContent = '✗ ' + (e.message || 'Save failed');
    statusEl.className = 'admin-status err';
  }

  if (btn) btn.disabled = false;
};
