<!DOCTYPE html>

<html lang="en">
<head>

<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>

<style>
    @font-face{font-family:'Orbitron';font-style:normal;font-weight:400 900;font-display:swap;src:url('https://fonts.gstatic.com/s/orbitron/v35/yMJRMIlzdpvBhQQL_Qq7dy0.woff2') format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;}
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0f;
      --card: #111118;
      --border: #222230;
      --primary: #a855f7;
      --primary-dim: rgba(168,85,247,0.15);
      --secondary: #22d3ee;
      --secondary-dim: rgba(34,211,238,0.15);
      --danger: #ef4444;
      --danger-dim: rgba(239,68,68,0.12);
      --text: #e2e8f0;
      --muted: #64748b;
      --font-display: 'Orbitron', sans-serif;
      --font-body: 'Inter', sans-serif;
    }

    html { scroll-behavior: smooth; }

    body {
      background: #000;
      color: var(--text);
      font-family: var(--font-body);
      min-height: 100vh;
      overflow-x: hidden;
      padding-top: 56px;
    }

    /* ── AUTH WALL ── */
    #auth-wall {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    #auth-wall.hidden { display: none; }
    #main-content { display: none; }
    #main-content.visible { display: block; }

    .auth-box {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 0 60px rgba(168,85,247,0.12);
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .auth-logo {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 1.75rem;
    }
    .auth-logo img { width: 56px; height: 56px; object-fit: contain; filter: drop-shadow(0 0 12px rgba(168,85,247,0.8)); }
    .auth-logo-name {
      font-family: var(--font-display);
      font-size: 1.4rem;
      font-weight: 900;
      letter-spacing: 0.05em;
    }
    .auth-logo-name span { color: var(--primary); }
    .auth-tabs {
      display: flex;
      width: 100%;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid var(--border);
      margin-bottom: 1.75rem;
    }
    .auth-tab {
      flex: 1;
      padding: 0.65rem;
      background: transparent;
      border: none;
      color: var(--muted);
      font-family: var(--font-display);
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
    }
    .auth-tab.active { background: var(--primary-dim); color: var(--primary); border-bottom: 2px solid var(--primary); }
    .auth-form { width: 100%; display: flex; flex-direction: column; gap: 1rem; }
    .auth-field { display: flex; flex-direction: column; gap: 0.4rem; }
    .auth-field label {
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .auth-field input {
      width: 100%;
      background: #0d0d14;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.75rem 1rem;
      color: var(--text);
      font-size: 0.95rem;
      font-family: var(--font-body);
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .auth-field input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(168,85,247,0.15); }
    .auth-submit {
      width: 100%;
      margin-top: 0.5rem;
      padding: 0.85rem;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 6px;
      font-family: var(--font-display);
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(168,85,247,0.35);
      transition: transform 0.15s, box-shadow 0.15s, opacity 0.15s;
    }
    .auth-submit:hover { transform: scale(1.02); box-shadow: 0 0 32px rgba(168,85,247,0.6); }
    .auth-submit:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    .auth-error {
      width: 100%;
      background: var(--danger-dim);
      border: 1px solid rgba(239,68,68,0.3);
      border-radius: 6px;
      padding: 0.65rem 1rem;
      color: var(--danger);
      font-size: 0.85rem;
      display: none;
      margin-top: 0.25rem;
    }
    .auth-error.show { display: block; }
/* ── ADMIN PANEL ── */
    #admin-panel {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 10000;
      background: rgba(0,0,0,0.75);
      backdrop-filter: blur(6px);
      padding: 1.5rem;
      overflow-y: auto;
    }
    #admin-panel.open { display: flex; align-items: flex-start; justify-content: center; }
    .admin-modal {
      background: #0d0d14;
      border: 1px solid rgba(168,85,247,0.4);
      border-radius: 16px;
      width: 100%;
      max-width: min(1400px, 92vw);
      box-shadow: 0 0 80px rgba(168,85,247,0.15);
      overflow: hidden;
      margin: auto;
    }
    .admin-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.25rem 1.75rem;
      border-bottom: 1px solid var(--border);
      background: rgba(168,85,247,0.05);
    }
    .admin-header-title {
      font-family: var(--font-display);
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--primary);
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }
    .admin-close {
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--muted);
      cursor: pointer;
      padding: 0.4rem 0.75rem;
      font-size: 0.75rem;
      font-family: var(--font-display);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      transition: border-color 0.2s, color 0.2s;
    }
    .admin-close:hover { border-color: var(--danger); color: var(--danger); }
    .admin-tabs {
      display: flex;
      border-bottom: 1px solid var(--border);
      overflow-x: auto;
      background: #0a0a0f;
      scrollbar-width: none;
    }
    .admin-tabs::-webkit-scrollbar { display: none; }
    .admin-tab {
      flex-shrink: 0;
      padding: 0.75rem 1.25rem;
      background: transparent;
      border: none;
      border-bottom: 2px solid transparent;
      color: var(--muted);
      font-family: var(--font-display);
      font-size: 0.6rem;
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      cursor: pointer;
      transition: color 0.2s, border-color 0.2s;
      white-space: nowrap;
    }
    .admin-tab.active { color: var(--primary); border-bottom-color: var(--primary); }
    .admin-tab:hover:not(.active) { color: var(--text); }
    .admin-body { padding: 1.75rem; }
    .admin-section { display: none; }
    .admin-section.active { display: block; }
    .admin-field { margin-bottom: 1.1rem; }
    .admin-field label {
      display: block;
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 0.35rem;
    }
    .admin-input {
      width: 100%;
      background: #111118;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.65rem 0.9rem;
      color: var(--text);
      font-size: 0.88rem;
      font-family: var(--font-body);
      outline: none;
      transition: border-color 0.2s;
    }
    .admin-input:focus { border-color: var(--primary); }
    .admin-textarea {
      width: 100%;
      background: #111118;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.7rem 0.9rem;
      color: var(--text);
      font-size: 0.82rem;
      font-family: monospace;
      outline: none;
      resize: vertical;
      min-height: 200px;
      line-height: 1.65;
      transition: border-color 0.2s;
    }
    .admin-textarea:focus { border-color: var(--primary); }
    .admin-hint {
      font-size: 0.72rem;
      color: var(--muted);
      margin-top: 0.35rem;
      line-height: 1.5;
    }
    .admin-hint code {
      background: #1a1a26;
      border-radius: 3px;
      padding: 0.1rem 0.3rem;
      font-size: 0.7rem;
      color: var(--secondary);
    }
    .admin-save-row {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-top: 1.5rem;
      padding-top: 1.25rem;
      border-top: 1px solid var(--border);
    }
    .admin-save-btn {
      padding: 0.7rem 1.75rem;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 6px;
      font-family: var(--font-display);
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(168,85,247,0.3);
      transition: opacity 0.2s, transform 0.15s;
    }
    .admin-save-btn:hover { opacity: 0.85; transform: scale(1.02); }
    .admin-save-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
    .admin-status { font-size: 0.8rem; font-weight: 600; }
    .admin-status.ok { color: #22c55e; }
    .admin-status.err { color: var(--danger); }
    .admin-row-list { display: flex; flex-direction: column; gap: 0.5rem; margin-bottom: 0.5rem; }
    .admin-row-item { display: flex; gap: 0.5rem; align-items: flex-start; }
    .admin-card-item {
      background: #111118;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.75rem;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      margin-bottom: 0.5rem;
    }
    .admin-card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.25rem;
    }
    .admin-card-label {
      font-size: 0.6rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .admin-row-input {
      flex: 1;
      background: #111118;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.52rem 0.75rem;
      color: var(--text);
      font-size: 0.85rem;
      font-family: var(--font-body);
      outline: none;
      transition: border-color 0.2s;
      min-width: 0;
    }
    .admin-row-input:focus { border-color: var(--primary); }
    .admin-row-input::placeholder { color: var(--muted); }

    /* ── Toggle Switch ── */
    .toggle-wrap {
      display: flex;
      align-items: center;
      gap: 0.55rem;
      height: 32px; /* match input height */
    }
    .toggle-switch {
      position: relative;
      display: inline-block;
      width: 38px;
      height: 22px;
      flex-shrink: 0;
    }
    .toggle-switch input { opacity: 0; width: 0; height: 0; position: absolute; }
    .toggle-track {
      position: absolute;
      inset: 0;
      border-radius: 999px;
      background: rgba(255,255,255,0.08);
      border: 1px solid var(--border);
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
    }
    .toggle-track::after {
      content: '';
      position: absolute;
      top: 3px;
      left: 3px;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--muted);
      transition: transform 0.2s, background 0.2s;
    }
    .toggle-switch input:checked + .toggle-track { background: rgba(34,197,94,0.25); border-color: rgba(34,197,94,0.5); }
    .toggle-switch input:checked + .toggle-track::after { transform: translateX(16px); background: #22c55e; }
    .toggle-switch.admin-toggle input:checked + .toggle-track { background: var(--primary-dim); border-color: rgba(168,85,247,0.5); }
    .toggle-switch.admin-toggle input:checked + .toggle-track::after { background: var(--primary); }
    .toggle-switch.editor-toggle input:checked + .toggle-track { background: rgba(34,211,238,0.2); border-color: rgba(34,211,238,0.5); }
    .toggle-switch.editor-toggle input:checked + .toggle-track::after { background: var(--secondary); }
    .toggle-switch.orders-toggle input:checked + .toggle-track { background: rgba(34,197,94,0.2); border-color: rgba(34,197,94,0.5); }
    .toggle-switch.orders-toggle input:checked + .toggle-track::after { background: #22c55e; }
    .toggle-label {
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--muted);
      transition: color 0.2s;
      min-width: 48px;
    }
    .toggle-switch input:checked ~ .toggle-label { color: var(--text); }
    .admin-card-input {
      width: 100%;
      background: #0d0d14;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.5rem 0.75rem;
      color: var(--text);
      font-size: 0.85rem;
      font-family: var(--font-body);
      outline: none;
      transition: border-color 0.2s;
    }
    .admin-card-input:focus { border-color: var(--primary); }
    .admin-card-input::placeholder { color: var(--muted); }
    .admin-row-remove {
      flex-shrink: 0;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--muted);
      cursor: pointer;
      padding: 0.45rem 0.6rem;
      font-size: 0.8rem;
      line-height: 1;
      transition: border-color 0.2s, color 0.2s;
    }
    .admin-row-remove:hover { border-color: var(--danger); color: var(--danger); }
    .admin-add-btn {
      width: 100%;
      background: transparent;
      border: 1px dashed rgba(168,85,247,0.4);
      border-radius: 6px;
      color: var(--primary);
      cursor: pointer;
      padding: 0.55rem 1rem;
      font-size: 0.7rem;
      font-family: var(--font-display);
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      transition: border-color 0.2s, background 0.2s;
      margin-top: 0.25rem;
    }
    .admin-add-btn:hover { border-color: var(--primary); background: var(--primary-dim); }
    .admin-sublabel {
      font-family: var(--font-display);
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--secondary);
      margin: 1.25rem 0 0.6rem;
    }
    .admin-divider { border: none; border-top: 1px solid var(--border); margin: 1.5rem 0; }

    /* ── MOBILE ── */
    @media (max-width: 768px) {
      .auth-box { padding: 2rem 1.25rem; }
      .admin-header { padding: 1rem 1.25rem; }
      .admin-header-title { font-size: 0.75rem; }
      .admin-body { padding: 1rem; }
      .admin-save-row { flex-wrap: wrap; gap: 0.75rem; }
      .admin-textarea { min-height: 160px; }
      .admin-row-item { flex-wrap: wrap; }
      .admin-row-item > * { flex: 1 1 100% !important; min-width: 0 !important; }
      .admin-row-item > button.admin-row-remove { flex: 0 0 auto !important; margin-left: 0; }

      div[style*="grid-template-columns:1fr 1fr"] { grid-template-columns: 1fr !important; }

      #ap-toolbar { flex-wrap: wrap; padding: 0.6rem 1rem; }
      #ap-toolbar #search-wrapper { width: 100% !important; flex-basis: 100% !important; }
      #approvals-list { padding: 0.75rem 1rem; }
      #approvals-panel { top: 56px; }

      #user-modal div[style*="grid-template-columns:1fr 1fr"] { grid-template-columns: 1fr !important; }
      #user-history-modal div[style*="width:35%"] { width: 100% !important; border-right: none !important; border-bottom: 1px solid var(--border); }
      #user-history-modal div[style*="flex:1;overflow:hidden"] { flex-direction: column !important; overflow-y: auto !important; }

      #modal-header-name { font-size: 0.75rem; }
      #modal-msg { min-width: 0; }
    }
  </style>
</head>

<script>window.populatePage=function(){};</script>
<script>function escHtml(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
function renderShopEditor(items){const list=document.getElementById('ae-shop-list');if(!list)return;list.innerHTML=(items||[]).map((item,i)=>shopEditorCard(item,i+1)).join('');}
function shopEditorCard(item,n){const safeImg=escHtml(item.img||'');const safeName=escHtml(item.name||'');const safePrice=escHtml(item.price||'');return`
  <div class="admin-card-item">
    <div class="admin-card-header">
      <span class="admin-card-label">Drink ${n}</span>
      <button class="admin-row-remove" onclick="this.closest('.admin-card-item').remove()">✕</button>
    </div>
    <input class="shop-item-name admin-card-input" placeholder="Name (e.g. Monster Zero)" value="${safeName}" />
    <input class="shop-item-price admin-card-input" placeholder="Price (e.g. 3.99)" value="${safePrice}" type="number" min="0" step="0.01" />
    <input class="shop-item-img admin-card-input" placeholder="Image URL (transparent PNG recommended)" value="${safeImg}" />
    ${safeImg ? `<img src="${safeImg}"alt="preview"style="height:60px;object-fit:contain;margin-top:0.25rem;opacity:0.85;filter:drop-shadow(0 2px 6px rgba(168,85,247,0.3));"onerror="this.style.display='none'"/>` : ''}
  </div>`;}
window.adminAddShopItem=function(){const list=document.getElementById('ae-shop-list');const n=list.querySelectorAll('.admin-card-item').length+1;const div=document.createElement('div');div.innerHTML=shopEditorCard({},n);list.appendChild(div.firstElementChild);list.lastElementChild.querySelector('.shop-item-name').focus();};</script>

    <button class="admin-row-remove" onclick="this.closest('.admin-row-item').remove()">✕</button>`;document.getElementById('ae-banned-list').appendChild(div);};function renderCommandLinksEditor(items){document.getElementById('ae-command-links-list').innerHTML=items.map((link,i)=>`
    <div class="admin-card-item">
      <div class="admin-card-header">
        <span class="admin-card-label">Link ${i+1}</span>
        <button class="admin-row-remove" onclick="this.closest('.admin-card-item').remove()">✕</button>
      </div>
      <input class="cl-title admin-card-input" placeholder="Title" value="${escAttr(link.title)}" />
      <input class="cl-desc admin-card-input" placeholder="Description" value="${escAttr(link.description||'')}" />
      <input class="cl-url admin-card-input" placeholder="URL (leave blank = 'coming soon')" value="${escAttr(link.url||'')}" />
    </div>`).join('');}
window.adminAddCommandLink=function(){const div=document.createElement('div');div.className='admin-card-item';div.innerHTML=`
    <div class="admin-card-header">
      <span class="admin-card-label">New Link</span>
      <button class="admin-row-remove" onclick="this.closest('.admin-card-item').remove()">✕</button>
    </div>
    <input class="cl-title admin-card-input" placeholder="Title" />
    <input class="cl-desc admin-card-input" placeholder="Description" />
    <input class="cl-url admin-card-input" placeholder="URL (leave blank = 'coming soon')" />`;document.getElementById('ae-command-links-list').appendChild(div);};window.adminSave=async function(section){if(!window._isAdmin)return;const statusEl=document.getElementById('status-'+section);const btn=document.querySelector('#admin-'+section+' .admin-save-btn');statusEl.textContent='Saving...';statusEl.className='admin-status';if(btn)btn.disabled=true;try{let patch={};if(section==='toptier'){patch.topTier=[...document.querySelectorAll('#ae-toptier-list .admin-card-item')].map(card=>({name:card.querySelector('.tt-name').value.trim(),badge:card.querySelector('.tt-badge').value.trim(),url:card.querySelector('.tt-url').value.trim(),backgroundImage:card.querySelector('.tt-bg').value.trim()}));}else if(section==='games'){const latestData=await window._firestoreGetSiteContent();const rows=[...document.querySelectorAll('#ae-games-list .admin-row-item')];const mergedGames=mergeGameEditorChanges(latestData.games||{},window._adminOriginalData?.games||{},rows);patch.games=mergedGames;window._siteData=Object.assign({},latestData,{games:mergedGames});window._adminOriginalData=Object.assign({},window._adminOriginalData||{},{games:JSON.parse(JSON.stringify(mergedGames))});}else if(section==='sites'){patch.sites=[...document.querySelectorAll('#ae-sites-list .admin-row-item')].map(row=>{const[n,u]=row.querySelectorAll('input');return{name:n.value.trim(),url:u.value.trim()};}).filter(s=>s.name);}else if(section==='shop'){patch.shop=[...document.querySelectorAll('#ae-shop-list .admin-card-item')].map(card=>({name:card.querySelector('.shop-item-name').value.trim(),price:card.querySelector('.shop-item-price').value.trim(),img:card.querySelector('.shop-item-img').value.trim()})).filter(s=>s.name);renderShopEditor(patch.shop);}else if(section==='banned'){patch.banned=[...document.querySelectorAll('#ae-banned-list .admin-row-item')].map(row=>row.querySelector('input').value.trim()).filter(Boolean);}else if(section==='command'){patch.command={hiring:{active:document.getElementById('ae-hiring-active').value==='true',badge:document.getElementById('ae-hiring-badge').value.trim(),title:document.getElementById('ae-hiring-title').value.trim(),description:document.getElementById('ae-hiring-desc').value.trim(),url:document.getElementById('ae-hiring-url').value.trim()},links:[...document.querySelectorAll('#ae-command-links-list .admin-card-item')].map(card=>{const url=card.querySelector('.cl-url').value.trim();return{title:card.querySelector('.cl-title').value.trim(),description:card.querySelector('.cl-desc').value.trim(),status:url?'Active':'soon',url};}).filter(l=>l.title)};}
await window._firestoreUpdate(patch);window._siteData=Object.assign({},window._siteData,patch);if(window._adminOriginalData){window._adminOriginalData=Object.assign({},window._adminOriginalData,JSON.parse(JSON.stringify(patch)));}
populatePage(window._siteData);statusEl.textContent='✓ Saved';statusEl.className='admin-status ok';setTimeout(()=>{statusEl.textContent='';statusEl.className='admin-status';},3000);}catch(e){console.error('Admin save error:',e);statusEl.textContent='✗ '+(e.message||'Save failed');statusEl.className='admin-status err';}
if(btn)btn.disabled=false;};</script>
<script>window.closeAdminPanel=function(){window.location.href='/';};window.closeApprovalsPanel=function(){window.location.href='/';};</script>
</body>
</html>
