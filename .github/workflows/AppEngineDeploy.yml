name: Deploy to App Engine

on:
  push:
    branches:
      - main  # Adjust branch name if your default branch is different (e.g., master)

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Authenticate using your existing GCP_SA_KEY secret
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      # Set up gcloud CLI and set the project ID
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      # Deploy to App Engine
      - name: Deploy to App Engine
        run: gcloud app deploy app.yaml --quiet

      # Clean up older versions (retains the latest created version)
      - name: Delete Old App Engine Versions
        run: |
          OLD_VERSIONS=$(gcloud app versions list --format="value(version.id)" --sort-by="~version.createTime" | tail -n +2)
          if [ -n "$OLD_VERSIONS" ]; then
            gcloud app versions delete $OLD_VERSIONS --quiet
          else
            echo "No older versions found to delete."
          fi
