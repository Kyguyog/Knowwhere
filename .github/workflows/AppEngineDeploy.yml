name: Deploy to App Engine

on:
  push:
    branches:
      - main  # Trigger on pushes to the main branch

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Authenticate with GCP
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }} # Store your JSON key in GitHub Secrets

      # Set up gcloud CLI
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # Deploy to App Engine
      - name: Deploy to GCP App Engine
        run: gcloud app deploy app.yaml --quiet

      # Clean up older versions (retains the latest deployed version)
      - name: Delete Old App Engine Versions
        run: |
          VERSIONS_TO_DELETE=$(gcloud app versions list --format="value(version.id)" --sort-by="~version.createTime" | tail -n +2)
          if [ -n "$VERSIONS_TO_DELETE" ]; then
            gcloud app versions delete $VERSIONS_TO_DELETE --quiet
          else
            echo "No old versions to delete."
          fi
