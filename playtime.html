<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KnowWhere Playtime</title>
<link rel="icon" href="favicon.png" type="image/x-icon">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  @font-face{font-family:'Orbitron';font-style:normal;font-weight:400 900;font-display:swap;src:url('https://fonts.gstatic.com/s/orbitron/v35/yMJRMIlzdpvBhQQL_Qq7dy0.woff2') format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;}
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0a0a0f;
    --card: #111118;
    --border: #222230;
    --primary: #a855f7;
    --primary-dim: rgba(168,85,247,0.15);
    --secondary: #22d3ee;
    --danger: #ef4444;
    --text: #e2e8f0;
    --muted: #64748b;
    --font-display: 'Orbitron', sans-serif;
    --font-body: 'Inter', sans-serif;
  }
  body { min-height: 100vh; background: var(--bg); color: var(--text); font-family: var(--font-body); }
  body { padding-top: 56px; }
  .wrap { width: min(1080px, calc(100% - 2rem)); margin: 0 auto; padding: 3rem 0 4rem; }
  .heading { display: flex; align-items: end; justify-content: space-between; gap: 1rem; margin-bottom: 1.5rem; }
  h1 { font-family: var(--font-display); font-size: clamp(1.5rem, 4vw, 2.6rem); line-height: 1.05; letter-spacing: 0.03em; }
  h1 span { color: var(--primary); }
  .sub { color: var(--muted); margin-top: 0.65rem; line-height: 1.6; max-width: 640px; }
  .tabs { display: flex; gap: 0.5rem; margin: 1.4rem 0 1rem; border-bottom: 1px solid var(--border); }
  .tab {
    appearance: none; border: 0; border-bottom: 2px solid transparent; background: transparent; color: var(--muted);
    padding: 0.85rem 1rem; cursor: pointer; font-family: var(--font-display); font-size: 0.68rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase;
  }
  .tab.active { color: var(--primary); border-bottom-color: var(--primary); }
  .toolbar { display: flex; align-items: center; gap: 0.75rem; margin: 1rem 0; flex-wrap: wrap; }
  select, input {
    background: #0d0d14; border: 1px solid var(--border); border-radius: 6px; color: var(--text);
    padding: 0.7rem 0.85rem; font: inherit; outline: none;
  }
  select:focus, input:focus { border-color: var(--primary); }
  #game-search {
    min-width: 260px;
    width: min(460px, 100%);
    background: linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.01));
    border: 1px solid rgba(168,85,247,0.35);
    box-shadow: 0 0 0 1px rgba(168,85,247,0.08) inset;
  }
  #game-search:focus {
    border-color: var(--secondary);
    box-shadow: 0 0 0 3px rgba(34,211,238,0.18);
  }
  .board { border: 1px solid rgba(168,85,247,0.25); border-radius: 8px; overflow: hidden; background: rgba(255,255,255,0.03); }
  .row { display: grid; grid-template-columns: 54px 1.2fr 1fr 110px 88px; gap: 0.75rem; align-items: center; padding: 0.82rem 1rem; border-top: 1px solid rgba(255,255,255,0.06); }
  .row:first-child { border-top: 0; }
  .head { color: var(--muted); font-size: 0.62rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; background: rgba(0,0,0,0.18); }
  .rank { font-family: var(--font-display); color: var(--primary); font-size: 0.72rem; font-weight: 900; }
  .name { font-weight: 800; color: var(--text); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .muted { color: var(--muted); font-size: 0.78rem; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .time { font-family: var(--font-display); font-size: 0.78rem; color: var(--secondary); font-weight: 700; text-align: right; }
  .empty { padding: 2rem 1rem; color: var(--muted); text-align: center; }
  #auth-wall {
    position: fixed; inset: 0; z-index: 100; display: flex; align-items: center; justify-content: center;
    background: var(--bg); padding: 1rem;
  }
  #auth-wall.hidden { display: none; }
  .auth-box { width: 100%; max-width: 420px; border: 1px solid var(--border); border-radius: 12px; background: var(--card); padding: 2rem; }
  .auth-title { font-family: var(--font-display); font-weight: 900; letter-spacing: 0.05em; text-align: center; margin-bottom: 1rem; }
  .auth-title span { color: var(--primary); }
  .auth-form { display: flex; flex-direction: column; gap: 0.85rem; }
  .auth-submit { border: 0; border-radius: 6px; padding: 0.8rem 1rem; background: var(--primary); color: #fff; font-family: var(--font-display); font-size: 0.68rem; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; cursor: pointer; }
  .auth-error { display: none; color: var(--danger); font-size: 0.8rem; }
  .auth-error.show { display: block; }
  .auth-logo { display: flex; flex-direction: column; align-items: center; gap: 0.5rem; margin-bottom: 1.75rem; }
  .auth-logo img { width: 56px; height: 56px; object-fit: contain; filter: drop-shadow(0 0 12px rgba(168,85,247,0.8)); }
  .auth-logo-name { font-family: var(--font-display); font-size: 1.4rem; font-weight: 900; letter-spacing: 0.05em; }
  .auth-logo-name span { color: var(--primary); }
  .auth-field { display: flex; flex-direction: column; gap: 0.4rem; }
  .auth-field label { font-size: 0.7rem; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
  .auth-field input { width: 100%; background: #0d0d14; border: 1px solid var(--border); border-radius: 6px; padding: 0.75rem 1rem; color: var(--text); font-size: 0.95rem; font-family: var(--font-body); outline: none; transition: border-color 0.2s, box-shadow 0.2s; }
  .auth-field input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(168,85,247,0.15); }
  .auth-tabs { display: flex; width: 100%; border-radius: 8px; overflow: hidden; border: 1px solid var(--border); margin-bottom: 1.75rem; }
  .auth-tab { flex: 1; padding: 0.65rem; background: transparent; border: none; color: var(--muted); font-family: var(--font-display); font-size: 0.65rem; font-weight: 700; letter-spacing: 0.15em; text-transform: uppercase; cursor: pointer; transition: background 0.2s, color 0.2s; }
  .auth-tab.active { background: var(--primary-dim); color: var(--primary); border-bottom: 2px solid var(--primary); }
  @media (max-width: 760px) {
    nav { padding: 0 1rem; }
    .heading { display: block; }
    .row { grid-template-columns: 42px 1fr 82px; }
    .row .game-col, .row .plays-col { display: none; }
  }
  @media (max-width: 760px) {
    .tabs { flex-wrap: nowrap; overflow-x: auto; }
    .tab { white-space: nowrap; flex-shrink: 0; }
    .toolbar { flex-direction: column; align-items: stretch; }
    #game-search { width: 100%; min-width: 0; }
    .wrap { padding: 1.5rem 1rem 3rem; }
    .row { padding: 0.7rem 0.75rem; gap: 0.5rem; }
    .time { font-size: 0.75rem; }
  }
  @media (max-width: 420px) {
    .row { grid-template-columns: 36px 1fr 60px; }
    .rank { font-size: 0.8rem; }
    .auth-box { padding: 1.5rem 1.25rem; }
    .heading h1 { font-size: 1.4rem; }
  }
</style>
</head>
<body>
<div id="auth-wall"></div>
<script>window.KW_AUTH_OPTS = { allowUsername: true, signup: true };</script>
<script src="auth.js"></script>

<script src="tab-config.js"></script>
<script src="nav.js"></script>
<script type="module" src="user-menu.js"></script>
<script type="module" src="notifications.js"></script>
<script type="module" src="auth-flows.js"></script>

<main class="wrap">
  <div class="heading">
    <div>
      <h1>Playtime <span>Leaderboard</span></h1>
      <p class="sub">Popup-mode game sessions are counted here. The By Game tab lists every game by total playtime — pick one to break it down by player.</p>
    </div>
  </div>

  <div class="tabs">
    <button class="tab active" id="tab-total" onclick="setView('total')">By Player</button>
    <button class="tab" id="tab-game" onclick="setView('game')">By Game</button>
  </div>

  <div class="toolbar" id="game-toolbar" style="display:none;">
    <button class="tab" id="back-btn" onclick="backFromDrill()" style="display:none;border-color:transparent;color:var(--secondary);">← Back</button>
    <input id="game-search" type="text" placeholder="Search games..." oninput="renderCurrentView()">
  </div>

  <div class="board" id="leaderboard">
    <div class="empty">Loading leaderboard...</div>
  </div>
</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-auth.js";
import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyB_7DGpmrVotodTuPJDXoZrKrKbkzPhWDw",
  authDomain: "knowwhere-firebase.firebaseapp.com",
  projectId: "knowwhere-firebase",
  storageBucket: "knowwhere-firebase.firebasestorage.app",
  messagingSenderId: "389831660515",
  appId: "1:389831660515:web:0bcd3292610b1be0af86d6",
  measurementId: "G-9LMCC5TS1J"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
let playtimeRows = [];
let currentView = "total";
let allGameNames = [];
let selectedGameName = "";
let selectedPlayer = "";

function escHtml(value) {
  return String(value || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}
function formatTime(seconds) {
  const total = Math.max(0, Math.floor(Number(seconds) || 0));
  const h = Math.floor(total / 3600);
  const m = Math.floor((total % 3600) / 60);
  const s = total % 60;
  if (h) return `${h}h ${m}m`;
  if (m) return `${m}m ${s}s`;
  return `${s}s`;
}
function playerName(row) {
  return row.username || row.email || "Player";
}
function aggregateTotal(rows) {
  const byPlayer = new Map();
  rows.forEach(row => {
    const key = (row.email || playerName(row)).toLowerCase();
    const existing = byPlayer.get(key) || { username: playerName(row), email: row.email || "", totalSeconds: 0, plays: 0, games: new Set() };
    existing.username = row.username || existing.username;
    existing.totalSeconds += Number(row.totalSeconds) || 0;
    existing.plays += Number(row.plays) || 0;
    if (row.gameName) existing.games.add(row.gameName);
    byPlayer.set(key, existing);
  });
  return [...byPlayer.values()].map(row => ({ ...row, gameCount: row.games.size, gameName: `${row.games.size} games` })).sort((a, b) => b.totalSeconds - a.totalSeconds);
}
function aggregateGame(rows, gameName) {
  const byPlayer = new Map();
  rows.filter(row => row.gameName === gameName).forEach(row => {
    const key = String(row.email || playerName(row)).toLowerCase();
    const existing = byPlayer.get(key) || { username: row.username || playerName(row), email: row.email || "", totalSeconds: 0, plays: 0 };
    existing.username = row.username || existing.username;
    existing.totalSeconds += Number(row.totalSeconds) || 0;
    existing.plays += Number(row.plays) || 0;
    byPlayer.set(key, existing);
  });
  return [...byPlayer.values()].sort((a, b) => (Number(b.totalSeconds) || 0) - (Number(a.totalSeconds) || 0));
}
function aggregateGames(rows) {
  const byGame = new Map();
  rows.forEach(row => {
    const nm = row.gameName;
    if (!nm) return;
    const existing = byGame.get(nm) || { gameName: nm, totalSeconds: 0, plays: 0 };
    existing.totalSeconds += Number(row.totalSeconds) || 0;
    existing.plays += Number(row.plays) || 0;
    byGame.set(nm, existing);
  });
  return [...byGame.values()].sort((a, b) => (Number(b.totalSeconds) || 0) - (Number(a.totalSeconds) || 0));
}
function escAttr(value) {
  return String(value || "").replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/'/g, "&#39;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}
function aggregatePlayerGames(rows, playerKey) {
  const key = String(playerKey || "").toLowerCase();
  if (!key) return [];
  const mine = rows.filter(row => String(row.email || playerName(row)).toLowerCase() === key);
  const byGame = new Map();
  mine.forEach(row => {
    const nm = row.gameName;
    if (!nm) return;
    const existing = byGame.get(nm) || { gameName: nm, totalSeconds: 0, plays: 0 };
    existing.totalSeconds += Number(row.totalSeconds) || 0;
    existing.plays += Number(row.plays) || 0;
    byGame.set(nm, existing);
  });
  return [...byGame.values()].sort((a, b) => (Number(b.totalSeconds) || 0) - (Number(a.totalSeconds) || 0));
}
function renderRows(rows, mode) {
  const board = document.getElementById("leaderboard");
  const backBtn = document.getElementById("back-btn");
  const drilled = mode === "game" || mode === "player-games";
  if (backBtn) backBtn.style.display = drilled ? "flex" : "none";
  if (!rows.length) {
    board.innerHTML = '<div class="empty">No playtime found.</div>';
    return;
  }
  const header = '<div class="row head"><div>Rank</div><div>Player</div><div class="game-col">Game</div><div class="time">Time</div><div class="plays-col">Plays</div></div>';
  const body = rows.map((row, index) => {
    let name, sub, gameCell, clickAttr = "";
    if (mode === "total") {
      name = playerName(row);
      sub = row.email || "";
      gameCell = row.gameName || "";
      const key = String(row.email || playerName(row)).toLowerCase();
      clickAttr = ` style="cursor:pointer;" onclick="drillPlayer('${escAttr(key)}')"`;
    } else if (mode === "game-all") {
      name = row.gameName || "Unknown Game";
      sub = "";
      gameCell = "";
      clickAttr = ` style="cursor:pointer;" onclick="drillGame('${escAttr(row.gameName || "")}')"`;
    } else if (mode === "game") {
      name = playerName(row);
      sub = row.email || "";
      gameCell = "";
    } else {
      name = row.gameName || "Unknown Game";
      sub = "";
      gameCell = "";
    }
    return `
    <div class="row"${clickAttr}>
      <div class="rank">#${index + 1}</div>
      <div>
        <div class="name">${escHtml(name)}</div>
        ${sub ? `<div class="muted">${escHtml(sub)}</div>` : ""}
      </div>
      <div class="muted game-col">${escHtml(gameCell)}</div>
      <div class="time">${formatTime(row.totalSeconds)}</div>
      <div class="muted plays-col">${Number(row.plays) || 0}</div>
    </div>`;
  }).join("");
  board.innerHTML = header + body;
}
window.drillPlayer = function (key) {
  if (currentView !== "total") return;
  selectedPlayer = key || "";
  renderCurrentView();
};
window.drillGame = function (name) {
  if (currentView !== "game") return;
  selectedGameName = name || "";
  renderCurrentView();
};
window.backFromDrill = function () {
  if (currentView === "total") selectedPlayer = "";
  else selectedGameName = "";
  const input = document.getElementById("game-search");
  if (input) input.value = "";
  renderCurrentView();
};
window.renderCurrentView = function () {
  const input = document.getElementById("game-search");
  const toolbar = document.getElementById("game-toolbar");
  if (input) input.style.display = currentView === "game" ? "" : "none";
  if (toolbar) toolbar.style.display = (currentView === "game" || selectedPlayer) ? "flex" : "none";
  const currentInput = (input?.value || "").trim().toLowerCase();
  let rows, mode;
  if (currentView === "total") {
    if (selectedPlayer) {
      rows = aggregatePlayerGames(playtimeRows, selectedPlayer);
      mode = "player-games";
    } else {
      rows = aggregateTotal(playtimeRows);
      mode = "total";
    }
  } else if (selectedGameName) {
    rows = aggregateGame(playtimeRows, selectedGameName);
    mode = "game";
  } else {
    rows = aggregateGames(playtimeRows);
    if (currentInput) rows = rows.filter(row => String(row.gameName || "").toLowerCase().includes(currentInput));
    mode = "game-all";
  }
  renderRows(rows, mode);
};
window.setView = function (view) {
  currentView = view;
  selectedPlayer = "";
  selectedGameName = "";
  const input = document.getElementById("game-search");
  if (input) input.value = "";
  document.getElementById("tab-total").classList.toggle("active", view === "total");
  document.getElementById("tab-game").classList.toggle("active", view === "game");
  const backBtn = document.getElementById("back-btn");
  if (backBtn) backBtn.style.display = "none";
  renderCurrentView();
};
async function loadPlaytime() {
  const snap = await getDocs(collection(db, "playtime"));
  playtimeRows = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
  allGameNames = [...new Set(playtimeRows.map(row => row.gameName).filter(Boolean))].sort((a, b) => a.localeCompare(b));
  const input = document.getElementById("game-search");
  selectedGameName = "";
  selectedPlayer = "";
  input.value = "";
  renderCurrentView();
}
/* __kwSignIn provided by auth-flows.js */
onAuthStateChanged(auth, async user => {
  if (!user) return;
  document.getElementById("auth-wall").classList.add("hidden");
  try {
    await loadPlaytime();
  } catch (e) {
    document.getElementById("leaderboard").innerHTML = `<div class="empty">Failed to load leaderboard: ${escHtml(e.message || "Unknown error")}</div>`;
  }
});
</script>
</body>
</html>
