<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Admin Panel</title>
  <link rel="icon" href="https://instructure-uploads.s3.amazonaws.com/account_29340000000000001/attachments/112692/Screen%20Shot%202018-08-20%20at%206.22.27%20PM.png" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
    @font-face{font-family:'Orbitron';font-style:normal;font-weight:400 900;font-display:swap;src:url('https://fonts.gstatic.com/s/orbitron/v35/yMJRMIlzdpvBhQQL_Qq7dy0.woff2') format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;}
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0f;
      --card: #111118;
      --border: #222230;
      --primary: #a855f7;
      --primary-dim: rgba(168,85,247,0.15);
      --secondary: #22d3ee;
      --secondary-dim: rgba(34,211,238,0.15);
      --danger: #ef4444;
      --danger-dim: rgba(239,68,68,0.12);
      --text: #e2e8f0;
      --muted: #64748b;
      --font-display: 'Orbitron', sans-serif;
      --font-body: 'Inter', sans-serif;
    }

    html { scroll-behavior: smooth; }

    body {
      background: #000;
      color: var(--text);
      font-family: var(--font-body);
      min-height: 100vh;
      overflow-x: hidden;
      padding-top: 56px;
    }

    /* ── AUTH WALL ── */
    #auth-wall {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    #auth-wall.hidden { display: none; }
    #main-content { display: none; }
    #main-content.visible { display: block; }

    .auth-box {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 0 60px rgba(168,85,247,0.12);
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .auth-logo {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 1.75rem;
    }
    .auth-logo img { width: 56px; height: 56px; object-fit: contain; filter: drop-shadow(0 0 12px rgba(168,85,247,0.8)); }
    .auth-logo-name {
      font-family: var(--font-display);
      font-size: 1.4rem;
      font-weight: 900;
      letter-spacing: 0.05em;
    }
    .auth-logo-name span { color: var(--primary); }
    .auth-tabs {
      display: flex;
      width: 100%;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid var(--border);
      margin-bottom: 1.75rem;
    }
    .auth-tab {
      flex: 1;
      padding: 0.65rem;
      background: transparent;
      border: none;
      color: var(--muted);
      font-family: var(--font-display);
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
    }
    .auth-tab.active { background: var(--primary-dim); color: var(--primary); border-bottom: 2px solid var(--primary); }
    .auth-form { width: 100%; display: flex; flex-direction: column; gap: 1rem; }
    .auth-field { display: flex; flex-direction: column; gap: 0.4rem; }
    .auth-field label {
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .auth-field input {
      width: 100%;
      background: #0d0d14;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.75rem 1rem;
      color: var(--text);
      font-size: 0.95rem;
      font-family: var(--font-body);
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .auth-field input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(168,85,247,0.15); }
    .auth-submit {
      width: 100%;
      margin-top: 0.5rem;
      padding: 0.85rem;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 6px;
      font-family: var(--font-display);
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(168,85,247,0.35);
      transition: transform 0.15s, box-shadow 0.15s, opacity 0.15s;
    }
    .auth-submit:hover { transform: scale(1.02); box-shadow: 0 0 32px rgba(168,85,247,0.6); }
    .auth-submit:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    .auth-error {
      width: 100%;
      background: var(--danger-dim);
      border: 1px solid rgba(239,68,68,0.3);
      border-radius: 6px;
      padding: 0.65rem 1rem;
      color: var(--danger);
      font-size: 0.85rem;
      display: none;
      margin-top: 0.25rem;
    }
    .auth-error.show { display: block; }
/* ── ADMIN PANEL ── */
    #admin-panel {
      display: none;
      position: fixed;
      top: 56px;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 9997;
      background: #000;
      overflow: hidden;
      flex-direction: column;
    }
    #admin-panel.open { display: flex; }
    .admin-tab {
      flex: 1;
      padding: 0.7rem 1rem;
      background: transparent;
      border: none;
      border-bottom: 2px solid transparent;
      color: var(--muted);
      font-family: var(--font-display);
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      cursor: pointer;
      transition: color 0.2s, border-color 0.2s;
      white-space: nowrap;
    }
    .admin-tab:hover { color: var(--text); }
    #admin-content {
      overflow-y: auto;
      flex: 1;
      padding: 0.75rem 1.5rem;
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      align-content: flex-start;
    }
    .admin-section { display: none; width: 100%; }
    .admin-section.active { display: block; }
    .admin-field { margin-bottom: 1.1rem; }
    .admin-field label {
      display: block;
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 0.35rem;
    }
    .admin-input {
      width: 100%;
      background: #111118;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.65rem 0.9rem;
      color: var(--text);
      font-size: 0.88rem;
      font-family: var(--font-body);
      outline: none;
      transition: border-color 0.2s;
    }
    .admin-input:focus { border-color: var(--primary); }
    .admin-textarea {
      width: 100%;
      background: #111118;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.7rem 0.9rem;
      color: var(--text);
      font-size: 0.82rem;
      font-family: monospace;
      outline: none;
      resize: vertical;
      min-height: 200px;
      line-height: 1.65;
      transition: border-color 0.2s;
    }
    .admin-textarea:focus { border-color: var(--primary); }
    .admin-hint {
      font-size: 0.72rem;
      color: var(--muted);
      margin-top: 0.35rem;
      line-height: 1.5;
    }
    .admin-hint code {
      background: #1a1a26;
      border-radius: 3px;
      padding: 0.1rem 0.3rem;
      font-size: 0.7rem;
      color: var(--secondary);
    }
    .admin-save-row {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-top: 1.5rem;
      padding-top: 1.25rem;
      border-top: 1px solid var(--border);
    }
    .admin-save-btn {
      padding: 0.7rem 1.75rem;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 6px;
      font-family: var(--font-display);
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(168,85,247,0.3);
      transition: opacity 0.2s, transform 0.15s;
    }
    .admin-save-btn:hover { opacity: 0.85; transform: scale(1.02); }
    .admin-save-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
    .admin-status { font-size: 0.8rem; font-weight: 600; }
    .admin-status.ok { color: #22c55e; }
    .admin-status.err { color: var(--danger); }
    .admin-row-list { display: flex; flex-direction: column; gap: 0.5rem; margin-bottom: 0.5rem; }
    .admin-row-item { display: flex; gap: 0.5rem; align-items: flex-start; }
    .admin-card-item {
      background: #111118;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.75rem;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      margin-bottom: 0.5rem;
    }
    .admin-card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.25rem;
    }
    .admin-card-label {
      font-size: 0.6rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .admin-row-input {
      flex: 1;
      background: #111118;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.52rem 0.75rem;
      color: var(--text);
      font-size: 0.85rem;
      font-family: var(--font-body);
      outline: none;
      transition: border-color 0.2s;
      min-width: 0;
    }
    .admin-row-input:focus { border-color: var(--primary); }
    .admin-row-input::placeholder { color: var(--muted); }

    /* ── Toggle Switch ── */
    .toggle-wrap {
      display: flex;
      align-items: center;
      gap: 0.55rem;
      height: 32px; /* match input height */
    }
    .toggle-switch {
      position: relative;
      display: inline-block;
      width: 38px;
      height: 22px;
      flex-shrink: 0;
    }
    .toggle-switch input { opacity: 0; width: 0; height: 0; position: absolute; }
    .toggle-track {
      position: absolute;
      inset: 0;
      border-radius: 999px;
      background: rgba(255,255,255,0.08);
      border: 1px solid var(--border);
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
    }
    .toggle-track::after {
      content: '';
      position: absolute;
      top: 3px;
      left: 3px;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--muted);
      transition: transform 0.2s, background 0.2s;
    }
    .toggle-switch input:checked + .toggle-track { background: rgba(34,197,94,0.25); border-color: rgba(34,197,94,0.5); }
    .toggle-switch input:checked + .toggle-track::after { transform: translateX(16px); background: #22c55e; }
    .toggle-switch.admin-toggle input:checked + .toggle-track { background: var(--primary-dim); border-color: rgba(168,85,247,0.5); }
    .toggle-switch.admin-toggle input:checked + .toggle-track::after { background: var(--primary); }
    .toggle-switch.editor-toggle input:checked + .toggle-track { background: rgba(34,211,238,0.2); border-color: rgba(34,211,238,0.5); }
    .toggle-switch.editor-toggle input:checked + .toggle-track::after { background: var(--secondary); }
    .toggle-switch.orders-toggle input:checked + .toggle-track { background: rgba(34,197,94,0.2); border-color: rgba(34,197,94,0.5); }
    .toggle-switch.orders-toggle input:checked + .toggle-track::after { background: #22c55e; }
    .toggle-switch input:disabled + .toggle-track { cursor: not-allowed; }
    .toggle-switch input:disabled:checked + .toggle-track { background: rgba(34,197,94,0.15); border-color: rgba(34,197,94,0.3); }
    .toggle-switch input:disabled:checked + .toggle-track::after { background: #22c55e; opacity: 0.6; }
    .toggle-label {
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--muted);
      transition: color 0.2s;
      min-width: 48px;
    }
    .toggle-switch input:checked ~ .toggle-label { color: var(--text); }
    .admin-card-input {
      width: 100%;
      background: #0d0d14;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.5rem 0.75rem;
      color: var(--text);
      font-size: 0.85rem;
      font-family: var(--font-body);
      outline: none;
      transition: border-color 0.2s;
    }
    .admin-card-input:focus { border-color: var(--primary); }
    .admin-card-input::placeholder { color: var(--muted); }
    .admin-row-remove {
      flex-shrink: 0;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--muted);
      cursor: pointer;
      padding: 0.45rem 0.6rem;
      font-size: 0.8rem;
      line-height: 1;
      transition: border-color 0.2s, color 0.2s;
    }
    .admin-row-remove:hover { border-color: var(--danger); color: var(--danger); }
    .admin-add-btn {
      width: 100%;
      background: transparent;
      border: 1px dashed rgba(168,85,247,0.4);
      border-radius: 6px;
      color: var(--primary);
      cursor: pointer;
      padding: 0.55rem 1rem;
      font-size: 0.7rem;
      font-family: var(--font-display);
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      transition: border-color 0.2s, background 0.2s;
      margin-top: 0.25rem;
    }
    .admin-add-btn:hover { border-color: var(--primary); background: var(--primary-dim); }
    .admin-sublabel {
      font-family: var(--font-display);
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--secondary);
      margin: 1.25rem 0 0.6rem;
    }
    .admin-divider { border: none; border-top: 1px solid var(--border); margin: 1.5rem 0; }

    /* ── STAFF FORM ── */
    .staff-q-type-row { display: flex; gap: 0.75rem; align-items: center; flex-wrap: wrap; }
    .staff-q-type-row select { flex: 1; min-width: 160px; cursor: pointer; }
    .staff-q-tools { display: flex; gap: 0.35rem; }
    .staff-opt-row { display: flex; gap: 0.4rem; align-items: center; }
    .staff-opt-row .admin-card-input { flex: 1; min-width: 0; }
    .staff-q-choice-foot { display: flex; align-items: center; gap: 0.6rem; flex-wrap: wrap; }
    .staff-q-choice-foot .admin-add-btn { width: auto; margin-top: 0.15rem; padding: 0.4rem 0.9rem; }
    .staff-opt-limit { font-size: 0.68rem; color: var(--muted); }
    .staff-q-error { font-size: 0.7rem; font-weight: 600; color: var(--danger); }
    .staff-q-card.has-error { border-color: rgba(239,68,68,0.5); background: rgba(239,68,68,0.04); }
    .staff-problems {
      background: var(--danger-dim);
      border: 1px solid rgba(239,68,68,0.35);
      border-radius: 8px;
      padding: 0.7rem 0.9rem;
      margin-bottom: 0.75rem;
    }
    .staff-problems-title { font-size: 0.7rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--danger); }
    .staff-problems ul { margin: 0.4rem 0 0 1.1rem; }
    .staff-problems li { font-size: 0.75rem; color: #fca5a5; line-height: 1.5; margin-bottom: 0.15rem; }
    .staff-q-card.has-warning { border-color: rgba(245,158,11,0.45); background: rgba(245,158,11,0.04); }
    .staff-q-card.has-warning .staff-q-error { color: #fbbf24; }
    .staff-problems.warn { background: rgba(245,158,11,0.08); border-color: rgba(245,158,11,0.35); }
    .staff-problems.warn .staff-problems-title { color: #fbbf24; }
    .staff-problems.warn li { color: #fcd34d; }
    .staff-dirty { font-size: 0.7rem; color: var(--muted); }
    .staff-dirty.on { color: #fbbf24; }
    .sq-req-badge {
      font-size: 0.65rem; font-weight: 600; letter-spacing: 0.02em;
      color: var(--primary); background: var(--primary-dim);
      border: 1px solid rgba(168,85,247,0.3); border-radius: 999px;
      padding: 0.1rem 0.5rem; white-space: nowrap;
    }
    .sq-req-badge.off { color: var(--muted); background: transparent; border-color: var(--border); }
    .sq-options-btn {
      font-size: 0.65rem; font-weight: 600; color: var(--muted);
      background: transparent; border: 1px solid var(--border); border-radius: 6px;
      padding: 0.15rem 0.5rem; cursor: pointer; white-space: nowrap;
      transition: color 0.15s, border-color 0.15s, background 0.15s;
    }
    .sq-options-btn:hover { color: var(--text); border-color: var(--secondary); }
    .sq-options-btn.on { color: var(--primary); border-color: rgba(168,85,247,0.5); background: var(--primary-dim); }
    .sq-opts-panel {
      display: flex; flex-direction: column; gap: 0.6rem;
      margin-top: 0.55rem; padding: 0.7rem 0.8rem;
      background: rgba(255,255,255,0.02);
      border: 1px solid var(--border); border-left: 2px solid rgba(168,85,247,0.45);
      border-radius: 8px;
    }
    .sq-maxlen-wrap { display: flex; flex-direction: column; gap: 0.3rem; }
    .sq-opt-label { font-size: 0.7rem; font-weight: 600; color: var(--muted); }
    .sq-maxlen { max-width: 9rem; }
    .sq-maxlen-hint { font-size: 0.65rem; color: var(--muted); line-height: 1.4; }

    /* ── MOBILE ── */
    @media (max-width: 768px) {
      .auth-box { padding: 2rem 1.25rem; }
      .admin-tab { padding: 0.7rem 1rem; }
      #admin-content { padding: 0.75rem 1rem; }
      .admin-save-row { flex-wrap: wrap; gap: 0.75rem; }
      .admin-save-btn { padding: 0.6rem 1.25rem; }
      .admin-textarea { min-height: 160px; }
      .admin-row-item { flex-wrap: wrap; }
      .admin-row-item > * { flex: 1 1 100% !important; min-width: 0 !important; }
      .admin-row-item > button.admin-row-remove { flex: 0 0 auto !important; margin-left: 0; }
    }
    @media (max-width: 480px) {
      .admin-hint { font-size: 0.68rem; }
      .admin-tab { padding: 0.65rem 0.8rem; font-size: 0.55rem; }
    }

        
    #main-content.visible { display: block; }
  </style>
</head>
<body>
<script src="cloak.js?v=2"></script>


<div id="auth-wall"></div>
<script>window.KW_AUTH_OPTS = { allowUsername: true, subtitle: "Admin Panel" };</script>
<script src="auth.js"></script>


<div id="main-content">

<script src="nav.js"></script>
<script type="module" src="user-menu.js?v=3"></script>
  <script type="module" src="notifications.js"></script>
  <script type="module" src="auth-flows.js"></script>
  <script type="module" src="payment-wall.js"></script>


</div>

<div id="admin-panels-mount"></div>

<script>
window.populatePage = function() {};
</script>

<script>

function escHtml(s) {
  return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function escAttr(s) {
  return (s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

window.adminRemoveRow = function(btn) {
  const row = btn ? btn.closest('.admin-row-item, .admin-card-item') : null;
  if (!row) return;
  row.remove();
};


// ── Admin: render shop editor ──
function renderShopEditor(items) {
  const list = document.getElementById('ae-shop-list');
  if (!list) return;
  list.innerHTML = (items || []).map((item, i) => shopEditorCard(item, i + 1)).join('');
}

function shopEditorCard(item, n) {
  const safeImg   = escAttr(item.img   || '');
  const safeImgVC = escHtml(item.img   || '');
  const safeName  = escHtml(item.name  || '');
  const safePrice = escHtml(item.price || '');
  return `
  <div class="admin-card-item">
    <div class="admin-card-header">
      <span class="admin-card-label">Item ${n}</span>
      <button class="admin-row-remove" onclick="adminRemoveRow(this)">✕</button>
    </div>
    <input class="shop-item-name admin-card-input" placeholder="Name (e.g. Monster Zero)" value="${safeName}" />
    <input class="shop-item-price admin-card-input" placeholder="Price (e.g. 3.99)" value="${safePrice}" type="number" min="0" step="0.01" />
    <input class="shop-item-img admin-card-input" placeholder="Image URL (transparent PNG recommended)" value="${safeImg}" />
    ${safeImgVC ? `<img src="${safeImg}" alt="preview" style="height:60px;object-fit:contain;margin-top:0.25rem;opacity:0.85;filter:drop-shadow(0 2px 6px rgba(168,85,247,0.3));" onerror="this.style.display='none'" />` : ''}
  </div>`;
}

window.adminAddShopItem = function() {
  const list = document.getElementById('ae-shop-list');
  const n = list.querySelectorAll('.admin-card-item').length + 1;
  const div = document.createElement('div');
  div.innerHTML = shopEditorCard({}, n);
  list.appendChild(div.firstElementChild);
  list.lastElementChild.querySelector('.shop-item-name').focus();
};


// ── Admin: render banned editor ──
function renderBannedEditor(items) {
  const list = document.getElementById('ae-banned-list');
  if (!list) return;
  list.innerHTML = items.map(name => `
    <div class="admin-row-item">
      <input class="admin-row-input" placeholder="Name" value="${escAttr(name)}" />
      <button class="admin-row-remove" onclick="adminRemoveRow(this)">✕</button>
    </div>`).join('');
}

// ── Admin: staff form editor ──
const MAX_STAFF_CHOICES = 4;
const MIN_STAFF_CHOICES = 2;
const MAX_STAFF_CHARS = 5000;
const DEFAULT_STAFF_QUESTIONS = [
  { id: 'q_why', label: 'Why do you want to join the KnowWhere staff?', type: 'text', required: true, placeholder: 'Tell us why you want to help run the site.' },
  { id: 'q_skills', label: 'What would you help with?', type: 'choice', required: true, options: ['Game requests', 'Moderation', 'Editing / site content', 'Something else'] },
  { id: 'q_extra', label: 'Anything else we should know?', type: 'text', required: false, placeholder: 'Availability, experience, links…' }
];

let _staffEditorBound = false;
let _staffDirty = false;

function staffNewQuestionId() {
  return 'q' + Date.now().toString(36) + Math.floor(Math.random() * 1e4).toString(36);
}

function staffType(value) {
  return value === 'choice' || value === 'multi' ? value : 'text';
}

function staffOptionRow(value, n) {
  return `
    <div class="staff-opt-row">
      <input class="sq-option admin-card-input" placeholder="Choice ${n}" value="${escAttr(value == null ? '' : value)}" />
      <button class="admin-row-remove sq-opt-remove" onclick="staffRemoveOption(this)" title="Remove this choice">✕</button>
    </div>`;
}

function staffQuestionCard(q, n) {
  q = q || {};
  const type = staffType(q.type);
  const saved = (q.options || []).map(o => String(o == null ? '' : o)).slice(0, MAX_STAFF_CHOICES);
  // keep the saved choices and pad with blank rows so there is always somewhere to type
  while (type !== 'text' && saved.length < MIN_STAFF_CHOICES) saved.push('');
  const rows = (type === 'text' ? [] : saved).map((o, i) => staffOptionRow(o, i + 1)).join('');
  return `
  <div class="admin-card-item staff-q-card" data-qid="${escAttr(q.id || staffNewQuestionId())}">
    <div class="admin-card-header">
      <span class="admin-card-label">Question ${n}</span>
      <span class="sq-req-badge"></span>
      <div class="staff-q-tools">
        <button class="admin-row-remove" onclick="staffMoveQuestion(this,-1)" title="Move up">↑</button>
        <button class="admin-row-remove" onclick="staffMoveQuestion(this,1)" title="Move down">↓</button>
        <button class="sq-options-btn" onclick="staffToggleOptions(this)" aria-expanded="false" aria-controls="sq-opts-${n}">Options</button>
        <button class="admin-row-remove" onclick="staffRemoveQuestion(this)" title="Delete this question">✕</button>
      </div>
    </div>
    <input class="sq-label admin-card-input" placeholder="Question (e.g. Why do you want to join the staff?)" value="${escAttr(q.label||'')}" />
    <div class="staff-q-type-row">
      <select class="sq-type admin-card-input" onchange="staffTypeChanged(this)">
        <option value="text"${type==='text'?' selected':''}>✏️ Text — they type an answer</option>
        <option value="choice"${type==='choice'?' selected':''}>◉ Multiple choice — pick one</option>
        <option value="multi"${type==='multi'?' selected':''}>☑ Multiple answer — pick any</option>
      </select>
    </div>
    <div class="sq-text-wrap">
      <input class="sq-placeholder admin-card-input" placeholder="Placeholder — text questions only" value="${escAttr(q.placeholder||'')}" />
    </div>
    <div class="sq-choice-wrap" style="display:flex;flex-direction:column;gap:0.4rem;">
      <div class="sq-options" style="display:flex;flex-direction:column;gap:0.4rem;">${rows}</div>
      <div class="staff-q-choice-foot">
        <button class="admin-add-btn sq-add-opt" onclick="staffAddOption(this)">+ Add Choice</button>
        <span class="sq-opt-limit"></span>
      </div>
    </div>
    <div class="sq-opts-panel" id="sq-opts-${n}" style="display:none;">
      <label class="toggle-wrap" style="margin:0;">
        <span class="toggle-switch admin-toggle">
          <input type="checkbox" class="sq-required"${q.required===false?'':' checked'} />
          <span class="toggle-track"></span>
        </span>
        <span class="toggle-label">Required</span>
      </label>
      <div class="sq-maxlen-wrap">
        <span class="sq-opt-label">Character limit</span>
        <input type="number" class="sq-maxlen admin-card-input" min="0" max="${MAX_STAFF_CHARS}" step="1" inputmode="numeric" placeholder="No limit" value="${q.maxLength ? escAttr(String(q.maxLength)) : ''}" />
        <span class="sq-maxlen-hint">Text answers only. Leave blank (or 0) for no limit, up to ${MAX_STAFF_CHARS}.</span>
      </div>
    </div>
    <div class="staff-q-error" style="display:none;"></div>
  </div>`;
}

// Character limit for a text answer. 0 / blank means "no limit".
function staffMaxLength(card) {
  const input = card.querySelector('.sq-maxlen');
  if (!input) return 0;
  const n = parseInt(input.value, 10);
  if (!isFinite(n) || n <= 0) return 0;
  return Math.min(n, MAX_STAFF_CHARS);
}

window.staffToggleOptions = function(btn) {
  const card = btn ? btn.closest('.staff-q-card') : null;
  if (!card) return;
  const panel = card.querySelector('.sq-opts-panel');
  if (!panel) return;
  const open = panel.style.display === 'none';
  panel.style.display = open ? '' : 'none';
  btn.classList.toggle('on', open);
  btn.setAttribute('aria-expanded', open ? 'true' : 'false');
};

// Shows/hides the parts of a card that belong to the selected type and keeps
// the choice list within the 2–4 limits.
function staffSyncCard(card) {
  const type = staffType(card.querySelector('.sq-type').value);
  const textWrap = card.querySelector('.sq-text-wrap');
  const choiceWrap = card.querySelector('.sq-choice-wrap');
  const opts = card.querySelector('.sq-options');
  const addBtn = card.querySelector('.sq-add-opt');
  const limit = card.querySelector('.sq-opt-limit');
  if (textWrap) textWrap.style.display = type === 'text' ? '' : 'none';
  if (choiceWrap) choiceWrap.style.display = type === 'text' ? 'none' : '';

  // A character limit only means anything for a typed answer.
  const maxWrap = card.querySelector('.sq-maxlen-wrap');
  if (maxWrap) maxWrap.style.display = type === 'text' ? '' : 'none';

  // Required + limit live in the Options panel, so surface them on the card.
  const badge = card.querySelector('.sq-req-badge');
  if (badge) {
    const required = card.querySelector('.sq-required').checked;
    const max = staffMaxLength(card);
    const bits = [required ? 'Required' : 'Optional'];
    if (type === 'text' && max) bits.push('max ' + max + ' chars');
    badge.textContent = bits.join(' · ');
    badge.classList.toggle('off', !required);
    badge.title = required ? 'Applicants must answer this one' : 'Applicants can skip this one';
  }

  if (type !== 'text') {
    while (opts.querySelectorAll('.staff-opt-row').length < MIN_STAFF_CHOICES) {
      const div = document.createElement('div');
      div.innerHTML = staffOptionRow('', opts.querySelectorAll('.staff-opt-row').length + 1);
      opts.appendChild(div.firstElementChild);
    }
  }
  const rows = [...opts.querySelectorAll('.staff-opt-row')];
  rows.forEach((row, i) => {
    row.querySelector('.sq-option').placeholder = 'Choice ' + (i + 1);
    row.querySelector('.sq-opt-remove').style.visibility = rows.length > MIN_STAFF_CHOICES ? 'visible' : 'hidden';
  });
  const atMax = rows.length >= MAX_STAFF_CHOICES;
  if (addBtn) addBtn.style.display = atMax ? 'none' : '';
  if (limit) limit.textContent = atMax ? MAX_STAFF_CHOICES + ' choices is the max' : rows.length + ' of ' + MAX_STAFF_CHOICES + ' choices';
}

function staffRenumberQuestions() {
  const list = document.getElementById('ae-sf-questions');
  if (!list) return;
  [...list.querySelectorAll('.staff-q-card')].forEach((card, i) => {
    const label = card.querySelector('.admin-card-label');
    if (label) label.textContent = 'Question ' + (i + 1);
    staffSyncCard(card);
  });
}

// Called as staffTypeChanged(this) from the card markup, so the select arrives
// as the first argument — `this` is only a fallback for direct .call() usage.
window.staffTypeChanged = function(select) {
  const input = select || (this && this.closest ? this.closest('.sq-type') : null);
  const card = input ? input.closest('.staff-q-card') : null;
  if (!card) return;
  staffSyncCard(card);
  staffClearError(card);
  staffSetDirty(true);
};
window.staffQuestionTypeChanged = window.staffTypeChanged;

window.staffAddOption = function(btn) {
  const card = btn ? btn.closest('.staff-q-card') : null;
  if (!card) return;
  const opts = card.querySelector('.sq-options');
  if (!opts || opts.querySelectorAll('.staff-opt-row').length >= MAX_STAFF_CHOICES) return;
  const div = document.createElement('div');
  div.innerHTML = staffOptionRow('', opts.querySelectorAll('.staff-opt-row').length + 1);
  opts.appendChild(div.firstElementChild);
  staffSyncCard(card);
  staffSetDirty(true);
  opts.lastElementChild.querySelector('.sq-option').focus();
};

window.staffRemoveOption = function(btn) {
  const card = btn ? btn.closest('.staff-q-card') : null;
  if (!card) return;
  const opts = card.querySelector('.sq-options');
  if (!opts || opts.querySelectorAll('.staff-opt-row').length <= MIN_STAFF_CHOICES) return;
  btn.closest('.staff-opt-row').remove();
  staffSyncCard(card);
  staffSetDirty(true);
};

window.staffRemoveQuestion = function(btn) {
  if (!btn) return;
  btn.closest('.staff-q-card').remove();
  staffClearProblems();
  staffRenumberQuestions();
  staffSetDirty(true);
};

window.staffMoveQuestion = function(btn, dir) {
  const card = btn.closest('.staff-q-card');
  const list = card.parentElement;
  let moved = false;
  if (dir < 0 && card.previousElementSibling) { list.insertBefore(card, card.previousElementSibling); moved = true; }
  else if (dir > 0 && card.nextElementSibling) { list.insertBefore(card.nextElementSibling, card); moved = true; }
  if (!moved) return; // a no-op nudge shouldn't look like an edit
  staffRenumberQuestions();
  staffSetDirty(true);
};

window.adminAddStaffQuestion = function() {
  const list = document.getElementById('ae-sf-questions');
  const div = document.createElement('div');
  div.innerHTML = staffQuestionCard({ type: 'text' }, list.querySelectorAll('.staff-q-card').length + 1);
  list.appendChild(div.firstElementChild);
  const card = list.lastElementChild;
  staffRenumberQuestions();
  card.querySelector('.sq-label').focus();
  staffSetDirty(true);
};

function renderStaffFormEditor(form) {
  form = form || {};
  document.getElementById('ae-sf-enabled').checked = form.enabled !== false;
  updateStaffFormLabel();
  document.getElementById('ae-sf-title').value = form.title || '';
  document.getElementById('ae-sf-intro').value = form.intro || '';
  document.getElementById('ae-sf-submit-label').value = form.submitLabel || '';
  document.getElementById('ae-sf-success').value = form.successMessage || '';

  const list = document.getElementById('ae-sf-questions');
  const questions = Array.isArray(form.questions)
    ? form.questions.filter(q => q && String(q.label || '').trim())
    : DEFAULT_STAFF_QUESTIONS;
  list.innerHTML = questions.map((q, i) => staffQuestionCard(q, i + 1)).join('');
  [...list.querySelectorAll('.staff-q-card')].forEach(card => staffSyncCard(card));
  staffClearProblems();
  staffSetDirty(false);

  if (!_staffEditorBound) {
    const section = document.getElementById('admin-staffform');
    if (section) {
      // Editing a flagged question clears its flag straight away, so the admin
      // never stares at a stale "needs fixing" warning they already resolved.
      const onEdit = e => {
        staffSetDirty(true);
        const card = e.target && e.target.closest ? e.target.closest('.staff-q-card') : null;
        if (!card) return;
        staffClearError(card);
        // The badge previews the Options panel, so keep it in step with it.
        if (e.target.matches('.sq-required, .sq-maxlen')) staffSyncCard(card);
      };
      section.addEventListener('input', onEdit);
      section.addEventListener('change', onEdit);
      _staffEditorBound = true;
    }
  }
}

window.updateStaffFormLabel = function() {
  const input = document.getElementById('ae-sf-enabled');
  const lbl = document.getElementById('ae-sf-enabled-lbl');
  if (!input || !lbl) return;
  const on = input.checked;
  lbl.textContent = on ? 'Enabled' : 'Disabled';
  lbl.style.color = on ? '#22c55e' : 'var(--muted)';
};

function staffSetDirty(on) {
  _staffDirty = on !== false;
  const el = document.getElementById('ae-sf-dirty');
  if (!el) return;
  el.textContent = _staffDirty ? '• unsaved changes' : '';
  el.classList.toggle('on', _staffDirty);
}

function staffClearError(card) {
  if (!card) return;
  card.classList.remove('has-error', 'has-warning');
  const err = card.querySelector('.staff-q-error');
  if (err) { err.style.display = 'none'; err.textContent = ''; }
  // The summary is only worth showing while something is still wrong.
  const box = document.getElementById('ae-sf-problems');
  if (box && !document.querySelector('#ae-sf-questions .staff-q-card.has-error')) {
    box.style.display = 'none';
    box.innerHTML = '';
    box.classList.remove('warn');
  }
}

function staffClearProblems() {
  document.querySelectorAll('#ae-sf-questions .staff-q-card').forEach(card => staffClearError(card));
  const box = document.getElementById('ae-sf-problems');
  if (box) { box.style.display = 'none'; box.innerHTML = ''; box.classList.remove('warn'); }
}

function staffShowProblems(errors) {
  document.querySelectorAll('#ae-sf-questions .staff-q-card').forEach(card => staffClearError(card));
  errors.forEach(e => {
    if (!e.card) return; // form-level problem (e.g. "add at least one question")
    e.card.classList.add('has-error');
    const err = e.card.querySelector('.staff-q-error');
    if (err) { err.style.display = ''; err.textContent = e.msg; }
  });
  const box = document.getElementById('ae-sf-problems');
  if (!box) return;
  box.classList.remove('warn');
  box.innerHTML = `<div class="staff-problems-title">Fix ${errors.length} question${errors.length === 1 ? '' : 's'} before saving</div>
    <ul>${errors.map(e => `<li><strong>${escHtml(e.title)}</strong> — ${escHtml(e.msg)}</li>`).join('')}</ul>`;
  box.style.display = 'block';
  box.scrollIntoView({ behavior: 'smooth', block: 'center' });
}

// Non-blocking notes shown after a successful save (e.g. duplicate labels).
function staffShowWarnings(warnings) {
  staffClearProblems();
  const box = document.getElementById('ae-sf-problems');
  if (!box || !warnings.length) return;
  warnings.forEach(w => {
    if (!w.card) return;
    w.card.classList.add('has-warning');
    const err = w.card.querySelector('.staff-q-error');
    if (err) { err.style.display = ''; err.textContent = w.msg; }
  });
  box.innerHTML = `<div class="staff-problems-title">Saved with ${warnings.length} note${warnings.length === 1 ? '' : 's'}</div>
    <ul>${warnings.map(w => `<li><strong>${escHtml(w.title)}</strong> — ${escHtml(w.msg)}</li>`).join('')}</ul>`;
  box.classList.add('warn');
  box.style.display = 'block';
}

// Reads the editor. Nothing is ever dropped silently: an unfinished question
// comes back as an error so the admin can finish (or delete) it.
function collectStaffForm() {
  const cards = [...document.querySelectorAll('#ae-sf-questions .staff-q-card')];
  const errors = [];
  const warnings = [];
  const questions = [];

  cards.forEach((card, i) => {
    const title = 'Question ' + (i + 1);
    const type = staffType(card.querySelector('.sq-type').value);
    const label = card.querySelector('.sq-label').value.trim();
    const options = type === 'text'
      ? []
      : [...card.querySelectorAll('.sq-option')].map(o => o.value.trim()).filter(Boolean);
    const dup = label && questions.some(q => q.label.toLowerCase() === label.toLowerCase());

    if (!label) { errors.push({ card, title, msg: 'Add the question text.' }); return; }
    if (type !== 'text' && options.length < MIN_STAFF_CHOICES) {
      errors.push({ card, title, msg: 'This question needs at least ' + MIN_STAFF_CHOICES + ' choices (' + options.length + ' filled in).' });
      return;
    }
    // A repeated label is odd but not broken, so it only warns.
    if (dup) warnings.push({ card, title, msg: 'Another question already says "' + label + '".' });

    questions.push({
      id:         card.dataset.qid || staffNewQuestionId(),
      label,
      type,
      required:   card.querySelector('.sq-required').checked,
      placeholder: type === 'text' ? card.querySelector('.sq-placeholder').value.trim() : '',
      maxLength:  type === 'text' ? staffMaxLength(card) : 0,
      options:    options.slice(0, MAX_STAFF_CHOICES)
    });
  });

  if (!questions.length && !errors.length) errors.push({ card: null, title: 'Form', msg: 'Add at least one question.' });

  return {
    errors,
    warnings,
    form: {
      enabled: document.getElementById('ae-sf-enabled').checked,
      title: document.getElementById('ae-sf-title').value.trim(),
      intro: document.getElementById('ae-sf-intro').value.trim(),
      submitLabel: document.getElementById('ae-sf-submit-label').value.trim(),
      successMessage: document.getElementById('ae-sf-success').value.trim(),
      questions
    }
  };
}

// ── Admin: save ──
window.adminSave = async function(section) {
  if (!window._isAdmin) return;
  const statusEl = document.getElementById('status-' + section);

  // Validate the form builder BEFORE locking the UI, so a half-finished
  // question can never be silently dropped and the Save button can't stick.
  let staffForm = null;
  let staffWarnings = [];
  if (section === 'staffform') {
    const check = collectStaffForm();
    if (check.errors.length) {
      staffShowProblems(check.errors);
      statusEl.textContent = '✗ ' + check.errors.length + ' question' + (check.errors.length === 1 ? '' : 's') + ' need' + (check.errors.length === 1 ? 's' : '') + ' fixing';
      statusEl.className = 'admin-status err';
      return;
    }
    staffForm = check.form;
    staffWarnings = check.warnings || [];
  }

  const btn = document.querySelector('#admin-' + section + ' .admin-save-btn');
  statusEl.textContent = 'Saving...';
  statusEl.className = 'admin-status';
  if (btn) btn.disabled = true;

  try {
    let patch = {};

    if (section === 'shop') {
      patch.shop = [...document.querySelectorAll('#ae-shop-list .admin-card-item')].map(card => ({
        name:  card.querySelector('.shop-item-name').value.trim(),
        price: card.querySelector('.shop-item-price').value.trim(),
        img:   card.querySelector('.shop-item-img').value.trim()
      })).filter(s => s.name);

      renderShopEditor(patch.shop);
    } else if (section === 'banned') {
      patch.banned = [...document.querySelectorAll('#ae-banned-list .admin-row-item')]
        .map(row => row.querySelector('input').value.trim()).filter(Boolean);
    } else if (section === 'command') {
      patch.command = Object.assign({}, window._siteData?.command || {}, {
        hiring: {
          active:      document.getElementById('ae-hiring-active').value === 'true',
          badge:       document.getElementById('ae-hiring-badge').value.trim(),
          title:       document.getElementById('ae-hiring-title').value.trim(),
          description: document.getElementById('ae-hiring-desc').value.trim(),
          url:         document.getElementById('ae-hiring-url').value.trim()
        },
        links: [...document.querySelectorAll('#ae-command-links-list .admin-card-item')].map(card => {
          const url = card.querySelector('.cl-url').value.trim();
          return {
            title:       card.querySelector('.cl-title').value.trim(),
            description: card.querySelector('.cl-desc').value.trim(),
            status:      url ? 'Active' : 'soon',
            url
          };
        }).filter(l => l.title)
      });
    } else if (section === 'staffform') {
      const latest = await window._firestoreGetSiteContent();
      patch.command = Object.assign({}, latest.command || window._siteData?.command || {}, { staffForm });
      window._siteData = Object.assign({}, latest, { command: patch.command });
    } else if (section === 'paywall') {
      const disabled = !document.getElementById('ae-paywall-enabled').checked;
      const untilRaw = document.getElementById('ae-paywall-until').value;
      const until = untilRaw ? new Date(untilRaw) : null;
      patch.paywall = {
        disabled,
        disableUntil: (until && !isNaN(until.getTime())) ? until.toISOString() : null
      };
      renderPaywallEditor(patch.paywall);
    } else if (section === 'noticepopup') {
      patch.noticePopup = {
        enabled: document.getElementById('ae-noticepopup-enabled').checked,
        remember: document.getElementById('ae-noticepopup-remember').checked,
        title: document.getElementById('ae-noticepopup-title').value.trim(),
        text: document.getElementById('ae-noticepopup-text').value
      };
      renderNoticePopupEditor(patch.noticePopup);
    }

    await window._firestoreUpdate(patch);

    window._siteData = Object.assign({}, window._siteData, patch);
    if (window._adminOriginalData) {
      window._adminOriginalData = Object.assign({}, window._adminOriginalData, JSON.parse(JSON.stringify(patch)));
    }

    if (section === 'staffform') { staffSetDirty(false); staffShowWarnings(staffWarnings); }

    statusEl.textContent = '✓ Saved';
    statusEl.className = 'admin-status ok';
    setTimeout(() => { statusEl.textContent = ''; statusEl.className = 'admin-status'; }, 3000);
  } catch(e) {
    console.error('Admin save error:', e);
    statusEl.textContent = '✗ ' + (e.message || 'Save failed');
    statusEl.className = 'admin-status err';
  }

  if (btn) btn.disabled = false;
};

window.switchAdminTab = function(tab) {
  document.querySelectorAll('.admin-tab').forEach(t => {
    const isActive = t.getAttribute('data-tab') === tab;
    t.style.color = isActive ? 'var(--primary)' : 'var(--muted)';
    t.style.borderBottomColor = isActive ? 'var(--primary)' : 'transparent';
  });
  document.querySelectorAll('.admin-section').forEach(s => s.classList.remove('active'));
  const section = document.getElementById('admin-' + tab);
  if (section) section.classList.add('active');
};

window.openAdminPanel = function() {
  if (!window._isAdmin) return;
  const data = window._siteData;
  if (!data) { alert('Site data not loaded yet. Try again in a moment.'); return; }
  window._adminOriginalData = JSON.parse(JSON.stringify(data));

  renderShopEditor(data.shop || []);

  document.getElementById('ae-hiring-active').value = h.active ? 'true' : 'false';
  document.getElementById('ae-hiring-badge').value = h.badge || '';
  document.getElementById('ae-hiring-title').value = h.title || '';
  document.getElementById('ae-hiring-desc').value = h.description || '';
  document.getElementById('ae-hiring-url').value = h.url || '';
  renderCommandLinksEditor(data.command?.links || []);
  renderStaffFormEditor(data.command?.staffForm);
  renderPaywallEditor(data.paywall);
  renderNoticePopupEditor(data.noticePopup);

  document.querySelectorAll('.admin-status').forEach(el => { el.textContent=''; el.className='admin-status'; });

  switchAdminTab('shop');
  document.getElementById('admin-panel').classList.add('open');
};

window.closeAdminPanel = function() {
  window.location.href = '/';
};

</script>

  let accountStatusUnsubscribe = null;

  onAuthStateChanged(auth, async (user) => {
    const wall = document.getElementById('auth-wall');
    const main = document.getElementById('main-content');
    const badge = document.getElementById('nav-user-badge');

    if (!user && _forcedSignout) {
      _forcedSignout = false;
      wall.classList.remove('hidden');
      main.classList.remove('visible');
      if (badge) badge.innerHTML = '';
      const errEl = document.getElementById('auth-error');

      }
      return;
    }

    if (!user) {
      wall.classList.remove('hidden');
      main.classList.remove('visible');
      return;
    }

    try {
      const activeSnap = await getDoc(doc(db, 'users', user.email));
      const activeSnapLower = !activeSnap.exists() && user.email && user.email.toLowerCase() !== user.email
        ? await getDoc(doc(db, 'users', user.email.toLowerCase()))
        : activeSnap;
      if (activeSnapLower.exists()) {
        const d = activeSnapLower.data();
        if (d.active === false) {
          _forcedSignout = true;
          await signOut(auth);
          return;
        }
      }
      if (accountStatusUnsubscribe) accountStatusUnsubscribe();
      const accountDocId = activeSnap.exists() ? user.email : user.email.toLowerCase();
      accountStatusUnsubscribe = onSnapshot(doc(db, 'users', accountDocId), async (snap) => {
        const data = snap.exists() ? snap.data() : null;
        if (data && data.active === false && auth.currentUser) {
          _forcedSignout = true;
          if (accountStatusUnsubscribe) {
            accountStatusUnsubscribe();
            accountStatusUnsubscribe = null;
          }
          await signOut(auth);
        }
      });
    } catch(e) {
      console.warn('Could not verify account status — signing out for safety:', e);
      _forcedSignout = true;
      await signOut(auth);
      return;
    }

    wall.classList.add('hidden');
    main.classList.add('visible');

    let username = user.email;
    let fullName = '';
    try {
      const snap = await getDoc(doc(db, 'users', user.email));
      if (snap.exists()) {
        const snapData = snap.data();
        if (snapData.username) {
          username = snapData.username;
          if (user.displayName !== username) {
            await updateProfile(user, { displayName: username });
          }
        } else {
          username = user.displayName || user.email;
        }
        fullName = snapData.fullName || '';
      } else {
        username = user.displayName || user.email;
      }
    } catch(e) {
      username = user.displayName || user.email;
    }

    try {
      const contentSnap = await getDoc(doc(db, 'siteContent', 'main'));
      if (contentSnap.exists()) window._siteData = contentSnap.data();
    } catch (e) {}

    try {
      const userSnap = await getDoc(doc(db, 'users', user.email));
      const userSnapLower = !userSnap.exists() && user.email && user.email.toLowerCase() !== user.email
        ? await getDoc(doc(db, 'users', user.email.toLowerCase()))
        : userSnap;
      const userData = userSnapLower.exists() ? userSnapLower.data() : {};
      const isAdmin = userData.admin === true;

      if (isAdmin) {
        window._isAdmin = true;
        window._isEditor = false;
        injectAdminPanels();
        setTimeout(() => openAdminPanel(), 100);
      } else {
        window.location.href = '/';
      }
    } catch(e) {
      console.warn('Could not check admin status:', e);
      window.location.href = '/';
    }
  });
